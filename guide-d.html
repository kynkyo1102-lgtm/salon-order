gory-button");b.type="button";const ic=el("span","category-icon");ic.innerHTML='<svg viewBox="0 0 64 64" aria-hidden="true">'+icons[i]+'</svg>';b.append(ic,el("span","category-text",names[i]),el("span","chevron","›"));b.onclick=()=>category(i);grid.append(b)});app.append(grid)}function category(i){app.replaceChildren();back("カテゴリーに戻る",home);heading(names[i]);intro("該当する手続きを選んでください。");const list=el("div","procedure-list");groups[i][1].forEach((v,j)=>list.append(row(v.split("|")[0],()=>detail(i,j))));app.append(list)}function detail(i,j){const [purpose,document]=groups[i][1][j].split("|");app.replaceChildren();back("手続き一覧に戻る",()=>category(i));heading(purpose);intro("必要な申請書と確認方法をご案内します。");const info=el("div","information");info.append(el("p","information-label","必要な申請書"),el("p","document-name",document));app.append(info);const link=el("a","eservice-link","E-Serviceにログインする ↗");link.href=login;link.target="_blank";link.rel="noopener noreferrer";app.append(link,el("p","notice","ログイン後、E-Service内の申請書ダウンロードページをご確認ください。"));const guide=el("div","guide-placeholder");guide.append(el("h3","","申請書ダウンロードページへの行き方"),el("p","","ログイン後の操作手順は、画面を確認してから掲載します。"));app.append(guide)}home();
