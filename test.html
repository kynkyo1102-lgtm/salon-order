<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- ... (省略) ... -->
</head>
<body>
  <!-- ヘッダー -->
  <header>
    <!-- ... (省略: ログインボタンを目立たせる) ... -->
  </header>

  <!-- メインコンテンツ -->
  <div class="container">
    <!-- ページタイトル -->
    <div class="page-header">
      <!-- ... (省略: キャッチコピーを直感的に) ... -->
    </div>

    <!-- 目次 (ビジュアル化) -->
    <div class="toc-visual">
      <div class="toc-step">
        <img src="icon-step1.png" alt="ステップ1">
        <span>基本条件</span>
      </div>
      <div class="toc-step">
        <img src="icon-step2.png" alt="ステップ2">
        <span>ボーナス解説</span>
      </div>
      <div class="toc-step">
        <img src="icon-step3.png" alt="ステップ3">
        <span>タイトル昇格</span>
      </div>
    </div>

    <!-- 1. 基本条件 (極限までシンプルに) -->
    <div id="sec-1" class="section-card">
      <div class="section-card-title">💡 1. ボーナス取得の3つの鍵</div>
      <div class="condition-icons">
        <div class="condition-item">
          <img src="icon-valid.png" alt="会員資格有効">
          <span>会員資格有効</span>
        </div>
        <div class="condition-item">
          <img src="icon-purchase.png" alt="自己購入10,000PT">
          <span>自己購入 10,000PT</span>
        </div>
        <div class="condition-item">
          <img src="icon-active.png" alt="アクティブ紹介者">
          <span>アクティブ紹介者</span>
        </div>
      </div>
      <!-- 条件チェックボタンを強調 -->
    </div>

    <!-- 2. ボーナスプラン (直感的な図解) -->
    <div id="sec-2" class="section-card">
      <div class="section-card-title">📊 2. ボーナスプラン完全図解</div>
      <!-- 各ボーナスを直感的な図解で表現 -->
      <div class="bonus-visual-item">
        <img src="bonus-first-start.png" alt="ファーストスタートボーナス図解">
        <h3>ファーストスタート</h3>
        <p>新規紹介で<br><strong>3,000円</strong></p>
      </div>
      <!-- 他のボーナスも同様に図解 -->
    </div>

    <!-- 3. タイトル昇格とブランチ (ロードマップ化) -->
    <div id="sec-3" class="section-card">
      <div class="section-card-title">🏆 3. タイトル昇格ロードマップ</div>
      <!-- ロードマップ（双六）形式の図解 -->
      <img src="promotion-roadmap.png" alt="タイトル昇格ロードマップ図解">
      
      <!-- ブランチの活用 (ネットワーク図) -->
      <div class="branch-visual">
        <h3>■ ブランチ活用</h3>
        <img src="branch-network.png" alt="ブランチ活用ネットワーク図解">
      </div>
    </div>
  </div>

  <!-- フッター -->
  <!-- ... (省略) ... -->
</body>
</html>
