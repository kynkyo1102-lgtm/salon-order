<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>南熊本サロン専用商品購入注文書</title>
  
  <!-- フォント・ライブラリ群 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://yubinbango.github.io/yubinbango/yubinbango.js" charset="UTF-8"></script>

  <style>
    @charset "UTF-8";

    :root {
      --wood-dark: #231610;
      --wood-medium: #4a3222;
      --accent-gold: #c8a261;
      --gold-light: #e6cb96;
      --bg-color: #f7f4ee;
      --card-bg: #ffffff;
      --text-main: #2b2019;
      --text-sub: #78695f;
      --border-color: #e5dac9;
      --font-sans: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-script: 'Great Vibes', cursive;
    }

    body {
      margin: 0;
      padding: 0;
      padding-bottom: 110px;
      font-family: var(--font-sans);
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ヘッダー */
    header {
      background: linear-gradient(180deg, #1b100a 0%, var(--wood-dark) 100%);
      color: #ffffff;
      padding: 24px 20px 20px;
      text-align: center;
      border-bottom: 3px solid var(--accent-gold);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      position: relative;
    }
    header::after {
      content: "";
      position: absolute;
      top: 8px; left: 8px; right: 8px; bottom: 8px;
      border: 1px solid rgba(200, 162, 97, 0.3);
      border-radius: 4px;
      pointer-events: none;
    }
    .header-logo {
      font-family: var(--font-script);
      font-size: 2.2rem;
      color: var(--gold-light);
      line-height: 1;
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      text-decoration: none;
      display: inline-block;
    }
    .header-logo:hover {
      opacity: 0.85;
    }
    h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: 0.1em;
    }
    .header-guide-link {
      display: inline-block;
      font-size: 0.78rem;
      color: var(--gold-light);
      font-weight: normal;
      margin-top: 8px;
      text-decoration: underline;
    }

    main {
      flex: 1;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px;
      box-sizing: border-box;
    }

    /* セクション＆カード */
    .section-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--wood-medium);
      margin: 20px 0 10px 4px;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border-color), transparent);
    }

    .card-box {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(35, 22, 16, 0.05);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-gold);
    }

    /* フォーム要素 */
    .form-group {
      margin-bottom: 12px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--wood-dark);
    }
    input[type="text"], input[type="password"], input[type="number"], input[type="tel"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.88rem;
      background-color: #fcfcfc;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--accent-gold);
      background-color: #fff;
    }

    .flex-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* 商品テーブル */
    .product-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.78rem;
      background-color: #fff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .product-table th, .product-table td {
      border-bottom: 1px solid var(--border-color);
      padding: 8px 6px;
      text-align: left;
    }
    .product-table th {
      background-color: #f7f3eb;
      color: var(--wood-dark);
      font-size: 0.75rem;
      font-weight: 700;
      text-align: center;
    }
    .product-table td.qty-col {
      width: 65px;
      text-align: center;
    }
    .product-table td.pt-col {
      width: 65px;
      text-align: right;
      color: var(--wood-medium);
      font-weight: bold;
    }

    /* 固定フッター */
    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      box-shadow: 0 -4px 20px rgba(35, 22, 16, 0.12);
      border-top: 1px solid var(--border-color);
      padding: 12px 16px;
      z-index: 1000;
    }
    .footer-content {
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-totals {
      font-size: 0.82rem;
      color: var(--wood-dark);
    }
    .btn-add {
      background-color: var(--wood-dark);
      color: var(--gold-light);
      border: 1px solid var(--accent-gold);
      padding: 10px 18px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(35, 22, 16, 0.15);
      transition: all 0.2s;
    }
    .btn-add:active {
      transform: translateY(1px);
    }

    /* 注文書カードスタイル */
    .card-wrapper {
      margin-bottom: 24px;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(35, 22, 16, 0.08);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .receipt-box {
      background-color: #fffdf9;
      padding: 18px;
      text-align: left;
    }
    .receipt-header {
      text-align: center;
      border-bottom: 2px solid var(--accent-gold);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .receipt-info {
      margin-bottom: 12px;
      font-size: 0.8rem;
      line-height: 1.6;
      color: var(--text-main);
    }
    .order-id-badge {
      display: inline-block;
      background-color: var(--wood-dark);
      color: var(--gold-light);
      font-size: 0.72rem;
      font-weight: bold;
      padding: 2px 10px;
      border-radius: 12px;
      margin-top: 6px;
      border: 1px solid var(--accent-gold);
    }
    .btn-card-download {
      width: 100%;
      padding: 12px;
      background-color: var(--wood-medium);
      color: var(--gold-light);
      border: none;
      border-top: 1px solid var(--border-color);
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-card-download:active {
      background-color: var(--wood-dark);
    }

    .btn-action {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 1px solid var(--border-color);
      border-radius: 25px;
      font-size: 0.88rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(35, 22, 16, 0.08);
    }
    .btn-pdf { background-color: var(--wood-dark); color: var(--gold-light); border-color: var(--accent-gold); }
    .btn-reload { background-color: #ffffff; color: var(--text-sub); }

    .guide-box {
      background-color: rgba(200, 162, 97, 0.12);
      border: 1px solid var(--accent-gold);
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.78rem;
      color: var(--wood-medium);
      line-height: 1.5;
      text-align: center;
    }

    /* 長押し保存用モーダル */
    .image-modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
      box-sizing: border-box;
    }
    .image-modal-content {
      max-width: 90%;
      max-height: 55vh;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      background: #fff;
      object-fit: contain;
    }
    .image-modal-instruction {
      color: #fff;
      font-size: 0.82rem;
      margin-bottom: 10px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }
    .image-modal-close {
      margin-top: 12px;
      padding: 8px 24px;
      background: #6c757d;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: bold;
    }
    .android-warning-box {
      margin-top: 8px;
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      line-height: 1.4;
      text-align: left;
    }
  </style>
</head>
<body>

  <header>
    <a href="https://kynkyo1102-lgtm.github.io/salon-order/" class="header-logo">Place de Nina</a>
    <h1>南熊本サロン専用商品購入注文書</h1>
    <a href="https://kynkyo1102-lgtm.github.io/salon-order/guidebulk.html" target="_blank" rel="noopener noreferrer" class="header-guide-link">
      📖 詳しい操作手順・使い方を見る
    </a>
  </header>

  <main>
    <!-- 入力フォーム画面 -->
    <div id="formSection">
      <form id="orderForm" class="h-adr">
        <span class="p-country-name" style="display:none;">Japan</span>
        
        <!-- 基本情報エリア -->
        <div class="section-title">👤 ご注文者様基本情報</div>
        <div class="card-box">
          <div class="form-group">
            <label for="month">発注月度 *</label>
            <select id="month" name="month" required>
              <option value="">選択してください</option>
            </select>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label style="margin-bottom: 0;">購入会員番号 *</label>
              <a href="register.html" target="_blank" style="font-size: 0.72rem; color: var(--wood-medium); text-decoration: underline;">⚙️ 番号の事前登録はこちら</a>
            </div>
            <div class="flex-row">
              <!-- ドロップダウン選択欄（登録がある場合） -->
              <select id="memberIdSelect" style="flex: 1; display: none;" onchange="handleMemberSelectChange()"></select>
              <!-- 直接入力欄（登録がない場合や手入力切替時） -->
              <input type="text" id="memberIdMain" placeholder="例: 12345" style="flex: 1;" required>
              <span>-</span>
              <select id="memberIdSub" style="width: 85px;"></select>
            </div>
          </div>

          <div class="form-group">
            <label for="fullName">氏名 *</label>
            <input type="text" id="fullName" name="fullName" placeholder="例: 山田 太郎" required>
          </div>
        </div>

        <!-- お支払い方法エリア -->
        <div class="section-title">💳 お支払い方法</div>
        <div class="card-box">
          <div class="form-group">
            <label for="paymentMethod">お支払い方法を選択 *</label>
            <select id="paymentMethod" required onchange="togglePaymentFields()">
              <option value="現金">現金</option>
              <option value="ニナファームカード">ニナファームカード</option>
              <option value="クレジットカード">クレジットカード</option>
              <option value="PayPay">PayPay</option>
            </select>
          </div>

          <!-- 領収書の宛名（※必要な場合のみ） -->
          <div class="form-group" style="margin-top: 12px;">
            <label for="receiptName">領収書の宛名 <span style="font-weight: normal; font-size: 0.72rem; color: var(--text-sub);">(※必要な場合のみ)</span></label>
            <input type="text" id="receiptName" placeholder="例: 株式会社〇〇、〇〇様">
          </div>

          <div id="paymentExtraFields" style="display: none; background-color: #fcfaf5; padding: 12px; border-radius: 8px; border: 1px solid var(--accent-gold); margin-top: 10px;">
            <div id="eservicePwGroup" class="form-group">
              <label for="eservicePw">E-Service PW</label>
              <input type="password" id="eservicePw" placeholder="パスワードを入力">
            </div>

            <div id="ninaPointGroup" class="form-group" style="display: none;">
              <label for="ninaPoint">ニナポイント利用（※利用する場合のみ）</label>
              <input type="number" id="ninaPoint" placeholder="例: 1000" min="0" oninput="updateCalc()">
              <small style="color: var(--text-sub); font-size: 0.72rem;">※1pt ＝ 1円としてお値引きされます</small>
            </div>
          </div>
        </div>

        <!-- お届け先エリア -->
        <div class="section-title">📦 お届け先（配送ご希望の方のみ）</div>
        <div class="card-box">
          <div class="form-group">
            <label for="shipName">お届け先お名前</label>
            <input type="text" id="shipName" placeholder="例: 山田 花子（氏名と異なる場合等）">
          </div>

          <div class="form-group">
            <label for="zip">郵便番号（ハイフンなし7桁）</label>
            <input type="text" id="zip" class="p-postal-code" maxlength="7" placeholder="例: 8600000">
          </div>

          <div class="form-group">
            <label for="address">住所</label>
            <input type="text" id="address" class="p-region p-locality p-street-address p-extended-address" placeholder="自動入力されます">
          </div>

          <div class="form-group">
            <label for="phone">電話番号</label>
            <input type="tel" id="phone" placeholder="例: 09012345678">
          </div>

          <div style="text-align: right; margin-top: 8px;">
            <button type="button" onclick="clearSavedInfo()" style="background: none; border: none; color: var(--text-sub); text-decoration: underline; font-size: 0.72rem; cursor: pointer;">
              端末に保存された住所等を削除
            </button>
          </div>
        </div>

        <!-- 商品一覧テーブル -->
        <div class="section-title">🛍️ 注文商品選択</div>
        <div style="margin-bottom: 6px; font-size: 0.78rem; color: var(--text-sub);">ご希望商品の数量を選択してください</div>
        <table class="product-table">
          <thead>
            <tr>
              <th>商品名</th>
              <th style="width: 65px;">価格(税込)</th>
              <th style="width: 55px;">獲得Pt</th>
              <th class="qty-col">数量</th>
            </tr>
          </thead>
          <tbody id="productTableBody"></tbody>
        </table>

        <!-- 追加済み注文リスト（確認用） -->
        <div id="orderListContainer" class="card-box" style="margin-top: 20px; display: none; border-color: var(--accent-gold); background-color: #fcfaf5;">
          <div style="font-weight: bold; font-size: 0.88rem; color: var(--wood-dark); border-bottom: 1px dashed var(--border-color); padding-bottom: 6px; margin-bottom: 8px;">
            📋 追加済みの注文（<span id="orderCount">0</span>件）
          </div>
          <div id="addedOrdersList" style="font-size: 0.8rem; margin-bottom: 12px;"></div>
          <button type="button" onclick="generateAllReceipts()" class="btn-action btn-pdf">
            🏁 注文書の一括作成画面へ
          </button>
        </div>

        <!-- 下部固定フッター -->
        <div class="footer-bar">
          <div class="footer-content">
            <div class="footer-totals">
              <div>お支払額: <span id="displayPrice" style="font-size: 1.05rem; color: #c94b4b; font-weight:bold;">¥0</span></div>
              <div style="font-size: 0.72rem; color: var(--text-sub);">
                (小計: <span id="displaySubtotal">¥0</span> / 獲得Pt: <span id="displayPt" style="color: var(--wood-medium); font-weight: bold;">0pt</span>)
              </div>
            </div>
            <button type="button" onclick="addOrderToList()" class="btn-add">
              ＋ この注文を追加
            </button>
          </div>
        </div>

      </form>
    </div>

    <!-- 完成画面 -->
    <div id="completeSection" style="display: none;">
      
      <div class="guide-box">
        📱 各カード下のボタンをタップすると、注文書を画像として保存できます。
      </div>

      <!-- 注文書カードが動的に生成されるコンテナ -->
      <div id="receiptsWrapper"></div>

      <!-- 下部ボタンエリア -->
      <div style="margin-top: 15px;">
        <button onclick="downloadAllPDF()" class="btn-action btn-pdf">📄 全枚数をまとめて1つのPDFで保存</button>
        <button onclick="location.reload()" class="btn-action btn-reload">🔄 最初の入力に戻る</button>
      </div>

    </div>
  </main>

      try {
        const response = await fetch('./month_config.json?cache=' + new Date().getTime());
        if (response.ok) {
          const remoteConfig = await response.json();
          currentMaster = remoteConfig;
          localStorage.setItem('salonOrderMasterConfig', JSON.stringify(currentMaster));
        }
      } catch (e) {
        // ② ネットワークオフライン等で取得できなかった場合は過去のキャッシュを利用
        const savedConfig = localStorage.getItem('salonOrderMasterConfig');
        if (savedConfig) {
          try { currentMaster = JSON.parse(savedConfig); } catch (err) {}
        }
      }

      renderUIFromMaster();

      // ユーザー情報復元
      const savedUser = localStorage.getItem('salonOrderUserInfo');
      if (savedUser) {
        try {
          const user = JSON.parse(savedUser);
          if (user.month && currentMaster.activeMonths.includes(user.month)) {
            document.getElementById('month').value = user.month;
          }
          if (user.memberIdMain) {
            const memberSelect = document.getElementById('memberIdSelect');
            if (memberSelect.style.display !== 'none' && Array.from(memberSelect.options).some(o => o.value === user.memberIdMain)) {
              memberSelect.value = user.memberIdMain;
              handleMemberSelectChange();
            } else {
              document.getElementById('memberIdMain').value = user.memberIdMain;
            }
          }
          if (user.memberIdSub) document.getElementById('memberIdSub').value = user.memberIdSub;
          if (user.fullName) document.getElementById('fullName').value = user.fullName;
          if (user.paymentMethod) {
            document.getElementById('paymentMethod').value = user.paymentMethod;
            togglePaymentFields();
          }
          if (user.receiptName) document.getElementById('receiptName').value = user.receiptName;
          if (user.shipName) document.getElementById('shipName').value = user.shipName;
          if (user.zip) document.getElementById('zip').value = user.zip;
          if (user.address) document.getElementById('address').value = user.address;
          if (user.phone) document.getElementById('phone').value = user.phone;
          updateCalc();
        } catch (e) {}
      }
    });

    // 会員番号ドロップダウン選択時の処理（氏名自動入力の連動対応版）
function handleMemberSelectChange() {
  const selectEl = document.getElementById('memberIdSelect');
  const inputEl = document.getElementById('memberIdMain');
  const fullNameEl = document.getElementById('fullName');

  if (selectEl.value === 'DIRECT_INPUT') {
    selectEl.style.display = 'none';
    inputEl.style.display = 'block';
    inputEl.value = '';
    fullNameEl.value = ''; // 直接入力切替時は氏名を空に
    inputEl.focus();
  } else {
    const selectedMemberId = selectEl.value;
    inputEl.value = selectedMemberId;

    // register.html で保存した「会員番号 ↔ 氏名」のマッピング情報を取得して自動入力
    const memberNameMap = JSON.parse(localStorage.getItem('salonOrderMemberNames') || '{}');
    if (memberNameMap[selectedMemberId]) {
      fullNameEl.value = memberNameMap[selectedMemberId];
    }
  }
}

    function renderUIFromMaster() {
      // 月度プルダウン描画
      const monthSelect = document.getElementById('month');
      const currentVal = monthSelect.value;
      monthSelect.innerHTML = '<option value="">選択してください</option>';
      currentMaster.activeMonths.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        monthSelect.appendChild(opt);
      });
      if (currentMaster.activeMonths.includes(currentVal)) {
        monthSelect.value = currentVal;
      } else if (currentMaster.activeMonths.length > 0) {
        monthSelect.value = currentMaster.activeMonths[0];
      }

      // 商品テーブル描画
      const tbody = document.getElementById('productTableBody');
      tbody.innerHTML = '';

      currentMaster.products.forEach((prod, index) => {
        const tr = document.createElement('tr');
        let qtyOptions = '<option value="0">0</option>';
        for (let i = 1; i <= 20; i++) {
          qtyOptions += `<option value="${i}">${i}</option>`;
        }

        tr.innerHTML = `
          <td><strong>${prod.name}</strong></td>
          <td style="color: var(--text-sub); text-align: right;">¥${prod.price.toLocaleString()}</td>
          <td class="pt-col" id="pt-cell-${index}">-</td>
          <td class="qty-col">
            <select class="qty-select" data-index="${index}">
              ${qtyOptions}
            </select>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.querySelectorAll('.qty-select').forEach(sel => sel.addEventListener('change', updateCalc));
      document.getElementById('month').addEventListener('change', updateCalc);

      updateCalc();
    }

    function togglePaymentFields() {
      const method = document.getElementById('paymentMethod').value;
      const extraContainer = document.getElementById('paymentExtraFields');
      const pwGroup = document.getElementById('eservicePwGroup');
      const ptGroup = document.getElementById('ninaPointGroup');

      if (method === 'ニナファームカード') {
        extraContainer.style.display = 'block';
        pwGroup.style.display = 'block';
        ptGroup.style.display = 'block';
      } else if (method === 'クレジットカード') {
        extraContainer.style.display = 'block';
        pwGroup.style.display = 'block';
        ptGroup.style.display = 'none';
        document.getElementById('ninaPoint').value = '';
      } else {
        extraContainer.style.display = 'none';
        pwGroup.style.display = 'none';
        ptGroup.style.display = 'none';
        document.getElementById('eservicePw').value = '';
        document.getElementById('ninaPoint').value = '';
      }
      updateCalc();
    }

    function updateCalc() {
      const month = document.getElementById('month').value;
      const selects = document.querySelectorAll('.qty-select');
      
      currentSubtotal = 0;
      currentGrandPt = 0;
      currentItemsData = [];

      currentMaster.products.forEach((prod, index) => {
        const cell = document.getElementById(`pt-cell-${index}`);
        if (cell) {
          if (month && prod.pts && prod.pts[month] !== undefined) {
            cell.textContent = prod.pts[month].toLocaleString() + "pt";
          } else {
            cell.textContent = "-";
          }
        }
      });

      selects.forEach(sel => {
        const qty = parseInt(sel.value) || 0;
        if (qty > 0) {
          const index = sel.getAttribute('data-index');
          const prod = currentMaster.products[index];
          const itemPrice = prod.price * qty;
          let itemPt = (month && prod.pts && prod.pts[month]) ? prod.pts[month] * qty : 0;

          currentSubtotal += itemPrice;
          currentGrandPt += itemPt;

          currentItemsData.push({
            product: prod.name,
            quantity: qty,
            price: itemPrice,
            pt: itemPt
          });
        }
      });

      const method = document.getElementById('paymentMethod').value;
      let usedPt = 0;
      if (method === 'ニナファームカード') {
        usedPt = parseInt(document.getElementById('ninaPoint').value) || 0;
      }

      currentGrandTotal = Math.max(0, currentSubtotal - usedPt);

      document.getElementById('displaySubtotal').textContent = "¥" + currentSubtotal.toLocaleString();
      document.getElementById('displayPrice').textContent = "¥" + currentGrandTotal.toLocaleString();
      document.getElementById('displayPt').textContent = currentGrandPt.toLocaleString() + "pt";
    }

    function addOrderToList() {
      if (currentItemsData.length === 0) {
        alert("数量が選択されている商品がありません。1点以上選択してください。");
        return;
      }

      const month = document.getElementById('month').value;
      const memberIdMain = document.getElementById('memberIdMain').value.trim();
      const memberIdSub = document.getElementById('memberIdSub').value;
      const fullName = document.getElementById('fullName').value.trim();

      if (!month || !memberIdMain || !fullName) {
        alert("発注月度、会員番号、氏名は必須項目です。");
        return;
      }

      const paymentMethod = document.getElementById('paymentMethod').value;
      const receiptName = document.getElementById('receiptName').value.trim();
      const eservicePw = document.getElementById('eservicePw').value.trim();
      const ninaPoint = parseInt(document.getElementById('ninaPoint').value) || 0;

      const shipName = document.getElementById('shipName').value.trim();
      const zip = document.getElementById('zip').value.trim();
      const address = document.getElementById('address').value.trim();
      const phone = document.getElementById('phone').value.trim();

      localStorage.setItem('salonOrderUserInfo', JSON.stringify({
        month, memberIdMain, memberIdSub, fullName, paymentMethod, receiptName, shipName, zip, address, phone
      }));

      const today = new Date();
      const yy = String(today.getFullYear()).slice(-2);
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const randomStr = Math.random().toString(36).substring(2, 6).toUpperCase();
      const generatedOrderId = `${yy}${mm}${dd}-${randomStr}`;

      allOrders.push({
        orderId: generatedOrderId,
        month,
        memberId: memberIdMain + "-" + memberIdSub,
        fullName,
        paymentMethod,
        receiptName,
        eservicePw: (paymentMethod === 'ニナファームカード' || paymentMethod === 'クレジットカード') ? eservicePw : '',
        ninaPoint: paymentMethod === 'ニナファームカード' ? ninaPoint : 0,
        shipName, zip, address, phone,
        items: [...currentItemsData],
        subtotalPrice: currentSubtotal,
        totalPrice: currentGrandTotal,
        totalPt: currentGrandPt
      });

      document.querySelectorAll('.qty-select').forEach(sel => sel.value = "0");
      
      // 登録情報がある場合はプルダウンの選択をリセットして手入力フォームに戻さない
      initMemberIdOptions();
      document.getElementById('fullName').value = "";
      document.getElementById('receiptName').value = "";
      document.getElementById('eservicePw').value = "";
      document.getElementById('ninaPoint').value = "";
      updateCalc();

      renderOrderList();
      alert(`「${fullName}」様の注文を追加しました！（現在 ${allOrders.length} 件）`);
    }

              <tr>
                <th>商品名（全体合計）</th>
                <th style="width: 45px; text-align: center;">総数量</th>
                <th style="width: 75px; text-align: right;">総合計(税込)</th>
                <th style="width: 60px; text-align: right;">総ポイント</th>
              </tr>
            </thead>
            <tbody>${summaryRows}</tbody>
          </table>
          <div style="border-top: 2px solid var(--accent-gold); padding-top: 10px; font-size: 0.88rem;">
            <div style="display: flex; justify-content: space-between; font-weight: bold; color: var(--wood-dark); margin-bottom: 4px;">
              <span>全合算 総数量:</span>
              <span>${grandTotalQty} 点</span>
            </div>
            ${summaryTotalBlock}
            <div style="display: flex; justify-content: space-between; font-weight: bold; margin-top: 4px;">
              <span>全合算 総獲得ポイント:</span>
              <span style="color: var(--wood-medium);">${totalAllPt.toLocaleString()}pt</span>
            </div>
          </div>
        </div>
        <button type="button" class="btn-card-download" style="background-color: var(--wood-dark); color: var(--gold-light);" onclick="downloadSingleCard('card-target-summary')">
          📊 「全体まとめ」を画像保存
        </button>
      `;
      wrapper.appendChild(summaryWrapper);

      document.getElementById('formSection').style.display = "none";
      document.querySelector('.footer-bar').style.display = "none";
      document.getElementById('completeSection').style.display = "block";
      window.scrollTo(0, 0);
    }

    async function downloadSingleCard(elementId) {
      const targetElement = document.getElementById(elementId);
      if (!targetElement) return;

      const btn = (typeof event !== 'undefined' && event) ? event.currentTarget : null;
      const originalText = btn ? btn.textContent : '';
      if (btn) {
        btn.textContent = "⌛ 画像を生成中...";
        btn.disabled = true;
      }

      try {
        const canvas = await html2canvas(targetElement, { scale: 2 });
        const imgData = canvas.toDataURL('image/png');

        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isMobile = /iPhone|iPad|iPod|Android/i.test(ua);
        const isLine = /Line/i.test(ua);
        const isAndroid = /Android/i.test(ua);

        if (isMobile) {
          const modal = document.createElement('div');
          modal.className = 'image-modal-overlay';
          
          let lineWarningText = "";
          if (isAndroid && isLine) {
            lineWarningText = `
              <div class="android-warning-box">
                ⚠️ <strong>LINEなどのアプリ内で開いている場合</strong><br>
                長押し保存が動作しないことがあります。<br>
                画面右上の「⋮」や「Share」から<strong>『他のブラウザで開く（Chrome等）』</strong>をお試しください。
              </div>
            `;
          }

          modal.innerHTML = `
            <div class="image-modal-instruction">
              📱 画像が生成されました！<br>
              下の画像を<span style="color: var(--gold-light); font-size: 1.1em;">「長押し」</span>して<br>
              【画像を保存】または【"写真"に追加】してください
              ${lineWarningText}
            </div>
            <img src="${imgData}" class="image-modal-content" alt="注文書画像">
            <button type="button" class="image-modal-close" onclick="this.parentElement.remove()">✕ 閉じる</button>
          `;
          document.body.appendChild(modal);
        } else {
          const link = document.createElement('a');
          link.href = imgData;
          const now = new Date();
          const timeStr = now.getFullYear() + String(now.getMonth()+1).padStart(2, '0') + String(now.getDate()).padStart(2, '0') + "_" + String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0');
          link.download = `注文書_${timeStr}.png`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }
      } catch (e) {
        alert("画像の生成に失敗しました: " + e.message);
      } finally {
        if (btn) {
          btn.textContent = originalText;
          btn.disabled = false;
        }
      }
    }

    async function downloadAllPDF() {
      const cards = document.querySelectorAll('.target-card');
      const { jsPDF } = window.jspdf;
      let pdf = null;

      for (let i = 0; i < cards.length; i++) {
        const card = cards[i];
        const canvas = await html2canvas(card, { scale: 2 });
        const imgData = canvas.toDataURL('image/png');

        if (i === 0) {
          pdf = new jsPDF('p', 'mm', 'a4');
        } else {
          pdf.addPage();
        }

        const imgProps = pdf.getImageProperties(imgData);
        const pdfWidth = pdf.internal.pageSize.getWidth() - 20;
        const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
        
        pdf.addImage(imgData, 'PNG', 10, 10, pdfWidth, pdfHeight);
      }

      if (pdf) {
        pdf.save("注文書_まとめ一括.pdf");
      }
    }

    function clearSavedInfo() {
      if (confirm("端末に保存されている住所等の情報を削除しますか？")) {
        localStorage.removeItem('salonOrderUserInfo');
        alert("削除しました。");
        location.reload();
      }
    }
  </script>
</body>
</html>
