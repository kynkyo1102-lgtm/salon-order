<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>左右バランス分配ツール - Place de Nina</title>
    <style>
        :root {
            --primary-color: #8B7355;
            --primary-hover: #6B5535;
            --bg-color: #FDFBF7;
            --card-bg: #FFFFFF;
            --text-color: #333333;
            --accent-color: #D4AF37;
            --danger-color: #C0392B;
            --border-color: #E8E2D5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 20px;
            letter-spacing: 0.05em;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
            background: #F9F8F6;
            padding: 16px;
            border-radius: 8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #666;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: white;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        .products-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 24px;
        }

        .product-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-bottom: 1px solid #F0ECE1;
        }

        .product-info {
            display: flex;
            flex-direction: column;
        }

        .product-name {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .product-sub {
            font-size: 0.8rem;
            color: #888;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn-qty {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: white;
            color: var(--primary-color);
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .btn-qty:hover {
            background: var(--primary-color);
            color: white;
        }

        .qty-val {
            font-weight: bold;
            width: 20px;
            text-align: center;
        }

        .product-price {
            text-align: right;
            font-size: 0.85rem;
            color: #555;
        }

        .results {
            border-top: 2px solid var(--primary-color);
            padding-top: 20px;
        }

        .summary-card {
            background-color: #F9F8F6;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .split-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .split-column {
            background-color: #FAFAFA;
            border: 1px solid #EAEAEA;
            border-radius: 8px;
            padding: 12px;
        }

        .split-header {
            font-weight: bold;
            text-align: center;
            padding-bottom: 8px;
            margin-bottom: 10px;
            border-bottom: 1px solid #EAEAEA;
            color: var(--primary-color);
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.85rem;
        }

        .item-list li {
            padding: 6px 8px;
            border-radius: 4px;
            background: white;
            margin-bottom: 6px;
            border: 1px solid #F0F0F0;
        }

        .item-list .item-pt {
            color: #777;
            font-size: 0.75rem;
        }

        .column-total {
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px dashed #DDD;
            font-size: 0.85rem;
        }

        .diff-text {
            font-size: 0.8rem;
            color: var(--danger-color);
            margin-top: 4px;
        }

        .suggestion-box {
            margin-top: 10px;
            padding: 8px 10px;
            background-color: #FFFDEE;
            border: 1px dashed var(--accent-color);
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .suggestion-title {
            font-weight: bold;
            color: #8A6D3B;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .grand-total {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            background-color: #F4F0EA;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>左右バランス分配ツール</h1>

    <div class="controls">
        <div class="control-group">
            <label for="monthSelect">対象月</label>
            <select id="monthSelect">
                <option value="3">3月</option>
                <option value="4">4月</option>
                <option value="5">5月</option>
                <option value="6">6月</option>
                <option value="7">7月</option>
                <option value="8">8月</option>
            </select>
        </div>
        <div class="control-group">
            <label for="targetPtSelect">目標PT (片側)</label>
            <select id="targetPtSelect">
                <option value="34000">34,000 PT</option>
                <option value="24000">24,000 PT</option>
            </select>
        </div>
    </div>

    <div class="products-grid" id="productsGrid">
        <!-- 商品リストはJSで動的生成 -->
    </div>

    <div class="results">
        <div class="split-grid">
            <div class="split-column">
                <div class="split-header">左 (L)</div>
                <ul class="item-list" id="leftList"></ul>
                <div class="column-total" id="leftTotal"></div>
                <div class="suggestion-box" id="leftSuggestBox" style="display: none;">
                    <div class="suggestion-title">💡 不足カバーのおすすめ追加:</div>
                    <div id="leftSuggestItem"></div>
                </div>
            </div>

            <div class="split-column">
                <div class="split-header">右 (R)</div>
                <ul class="item-list" id="rightList"></ul>
                <div class="column-total" id="rightTotal"></div>
                <div class="suggestion-box" id="rightSuggestBox" style="display: none;">
                    <div class="suggestion-title">💡 不足カバーのおすすめ追加:</div>
                    <div id="rightSuggestItem"></div>
                </div>
            </div>
        </div>

        <div class="grand-total" id="grandTotal"></div>
    </div>
</div>

<script>
    const configData = {
        products: [
            { name: 'ボアソン', price: 10800, pts: {3:10000, 4:10000, 5:10000, 6:10000, 7:10000, 8:10000} },
            { name: 'ハイプロリーナ', price: 7200, pts: {3:6000, 4:6000, 5:6000, 6:6000, 7:6000, 8:6000} },
            { name: '赤化粧水', price: 3200, pts: {3:3000, 4:3000, 5:3000, 6:3000, 7:3000, 8:3000} },
            { name: '白化粧水', price: 3600, pts: {3:3000, 4:3000, 5:3000, 6:3000, 7:3000, 8:3000} },
            { name: '赤ジェル', price: 4800, pts: {3:4000, 4:4000, 5:4000, 6:4000, 7:4000, 8:4000} },
            { name: '白ジェル', price: 5400, pts: {3:4000, 4:4000, 5:4000, 6:4000, 7:4000, 8:4000} },
            { name: 'OX-288', price: 13800, pts: {3:10000, 4:10000, 5:10000, 6:10000, 7:10000, 8:10000} },
            { name: 'リペアセラム', price: 13200, pts: {3:10000, 4:10000, 5:10000, 6:10000, 7:10000, 8:10000} }
        ]
    };

    const cart = {};
    configData.products.forEach(p => cart[p.name] = 0);

    function initUI() {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';

        configData.products.forEach(p => {
            const row = document.createElement('div');
            row.className = 'product-row';
            row.innerHTML = `
                <div class="product-info">
                    <span class="product-name">${p.name}</span>
                    <span class="product-sub" id="pt-display-${p.name}"></span>
                </div>
                <div class="quantity-control">
                    <button class="btn-qty" onclick="updateQty('${p.name}', -1)">-</button>
                    <span class="qty-val" id="qty-${p.name}">0</span>
                    <button class="btn-qty" onclick="updateQty('${p.name}', 1)">+</button>
                </div>
                <div class="product-price">
                    ${p.price.toLocaleString()}円
                </div>
            `;
            grid.appendChild(row);
        });

        document.getElementById('monthSelect').addEventListener('change', updateAll);
        document.getElementById('targetPtSelect').addEventListener('change', updateAll);

        updateAll();
    }

    function updateQty(name, delta) {
        cart[name] = Math.max(0, (cart[name] || 0) + delta);
        document.getElementById(`qty-${name}`).textContent = cart[name];
        updateAll();
    }

    function updateAll() {
        const month = parseInt(document.getElementById('monthSelect').value);
        
        configData.products.forEach(p => {
            const pt = p.pts[month] || 0;
            const ptElem = document.getElementById(`pt-display-${p.name}`);
            if (ptElem) {
                ptElem.textContent = `${pt.toLocaleString()} PT`;
            }
        });

        calculateBinarySplit();
    }

    // ★ 修正：不足PTに最も近く、かつ金額を抑えられる「複数個買い」のおすすめ検索処理
    function findSuggestedProduct(shortagePt, month) {
        if (shortagePt <= 0) return null;

        let bestSuggestion = null;
        let minDiff = Infinity;
        let minPrice = Infinity;

        configData.products.forEach(p => {
            if (p.name === 'リペアセラム') return;
            const pt = p.pts[month] || 0;
            if (pt <= 0) return;

            // 1個〜5個の組み合わせを判定
            for (let qty = 1; qty <= 5; qty++) {
                const totalPt = pt * qty;
                const totalPrice = p.price * qty;
                const diff = Math.abs(totalPt - shortagePt);

                // 差（PTの近さ）が小さい、または差が同じなら価格が安い方を採用
                if (diff < minDiff || (diff === minDiff && totalPrice < minPrice)) {
                    minDiff = diff;
                    minPrice = totalPrice;
                    bestSuggestion = {
                        name: p.name,
                        qty: qty,
                        pt: totalPt,
                        price: totalPrice
                    };
                }
            }
        });

        return bestSuggestion;
    }

    function calculateBinarySplit() {
        const month = parseInt(document.getElementById('monthSelect').value);
        const targetPt = parseInt(document.getElementById('targetPtSelect').value);

        const items = [];
        configData.products.forEach(p => {
            const count = cart[p.name] || 0;
            const pt = p.pts[month] || 0;
            for (let i = 0; i < count; i++) {
                items.push({ name: p.name, price: p.price, pt: pt });
            }
        });

        items.sort((a, b) => b.pt - a.pt);

        let leftPt = 0;
        let rightPt = 0;
        const leftItems = [];
        const rightItems = [];

        items.forEach(item => {
            if (leftPt <= rightPt) {
                leftItems.push(item);
                leftPt += item.pt;
            } else {
                rightItems.push(item);
                rightPt += item.pt;
            }
        });

        renderColumn('left', leftItems, leftPt, targetPt, month);
        renderColumn('right', rightItems, rightPt, targetPt, month);

        const grandTotalPt = leftPt + rightPt;
        const grandTotalPrice = items.reduce((sum, item) => sum + item.price, 0);
        const ptDiff = Math.abs(leftPt - rightPt);

        document.getElementById('grandTotal').innerHTML = `
            今回PT差: ${ptDiff.toLocaleString()} PT<br>
            総合計金額: ${grandTotalPrice.toLocaleString()} 円
        `;
    }

    function renderColumn(side, items, totalPt, targetPt, month) {
        const listElem = document.getElementById(`${side}List`);
        const totalElem = document.getElementById(`${side}Total`);
        const suggestBox = document.getElementById(`${side}SuggestBox`);
        const suggestItem = document.getElementById(`${side}SuggestItem`);

        const itemCounts = {};
        items.forEach(item => {
            if (!itemCounts[item.name]) {
                itemCounts[item.name] = { count: 0, pt: item.pt, price: item.price };
            }
            itemCounts[item.name].count++;
        });

        listElem.innerHTML = '';
        Object.keys(itemCounts).forEach(name => {
            const data = itemCounts[name];
            const li = document.createElement('li');
            li.innerHTML = `
                <div><strong>${name} × ${data.count}個</strong></div>
                <div class="item-pt">${(data.pt * data.count).toLocaleString()} PT / ${(data.price * data.count).toLocaleString()}円</div>
            `;
            listElem.appendChild(li);
        });

        const diff = totalPt - targetPt;
        const diffText = diff < 0 
            ? `<div class="diff-text">目標差分: ${diff.toLocaleString()} PT</div>`
            : `<div style="color: #27AE60; font-size: 0.8rem;">目標達成 (+${diff.toLocaleString()} PT)</div>`;

        const totalPrice = items.reduce((sum, item) => sum + item.price, 0);

        totalElem.innerHTML = `
            <strong>今回PT: ${totalPt.toLocaleString()} PT</strong><br>
            ${diffText}
            合計金額: <strong>${totalPrice.toLocaleString()} 円</strong>
        `;

        // 不足分がある場合のおすすめ追加処理
        const shortage = targetPt - totalPt;
        if (shortage > 0) {
            const sug = findSuggestedProduct(shortage, month);
            if (sug) {
                // ★ 修正：2個以上の場合は「× 〇個」を追加表示
                const qtyStr = sug.qty > 1 ? ` × ${sug.qty}個` : '';
                suggestItem.innerHTML = `<strong>${sug.name}${qtyStr}</strong><br>${sug.pt.toLocaleString()} PT / ${sug.price.toLocaleString()}円`;
                suggestBox.style.display = 'block';
            } else {
                suggestBox.style.display = 'none';
            }
        } else {
            suggestBox.style.display = 'none';
        }
    }

    window.onload = initUI;
</script>
</body>
</html>
