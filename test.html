<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>南熊本サロン専用商品購入注文書 - Place de Nina</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">

  <!-- ライブラリ群 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://yubinbango.github.io/yubinbango/yubinbango.js" charset="UTF-8"></script>

  <style>
    /* スマホでの入力しやすさと視認性を向上させるためのスタイル調整 */
    input[type="text"], 
    input[type="password"], 
    input[type="number"], 
    input[type="tel"], 
    select {
      font-size: 1rem !important; /* スマホでの自動ズーム防止 & 視認性確保 */
      padding: 12px 14px !important;
      height: auto !important;
      box-sizing: border-box;
      border-radius: 6px;
    }
    .form-group input, .form-group select {
      width: 100%;
    }
    .form-row input, .form-row select {
      width: auto;
    }
    /* 数量セレクトボックス等の操作性向上 */
    .qty-select {
      font-size: 1rem !important;
      padding: 8px !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-logo">Place de Nina</div>
    <h1>南熊本サロン専用商品購入注文書</h1>
  </header>

  <main>
    <div class="form-container">
      
      <!-- 入力フォーム画面 -->
      <div id="formSection">
        
        <div style="text-align: right; margin-bottom: 12px;">
          <a href="https://kynkyo1102-lgtm.github.io/salon-order/guidebulk.html" target="_blank" rel="noopener noreferrer" style="font-size: 13px; color: var(--wood-medium); text-decoration: underline;">
            📖 詳しい操作手順・使い方を見る
          </a>
        </div>
        
        <form id="orderForm" class="h-adr">
          <span class="p-country-name" style="display:none;">Japan</span>
          
          <!-- 基本情報エリア -->
          <div class="info-card">
            <div class="section-title">1. 基本情報</div>
            <div class="form-group" style="margin-bottom: 14px;">
              <label for="month">発注月度 *</label>
              <select id="month" name="month" required>
                <option value="">選択してください</option>
                <option value="7月度">7月度</option>
                <option value="8月度" selected>8月度</option>
              </select>
            </div>

            <div class="form-group" style="margin-bottom: 14px;">
              <label>購入会員番号 *</label>
              <div class="form-row" style="display: flex; gap: 8px; align-items: center;">
                <input type="text" id="memberIdMain" placeholder="例: 12345" style="flex: 1;" required>
                <span>-</span>
                <select id="memberIdSub" style="width: 90px;"></select>
              </div>
            </div>

            <div class="form-group">
              <label for="fullName">氏名 *</label>
              <input type="text" id="fullName" name="fullName" placeholder="例: 山田 太郎" required>
            </div>
          </div>

          <!-- お支払い方法エリア -->
          <div class="info-card">
            <div class="section-title">2. お支払い方法</div>
            
            <div class="form-group" style="margin-bottom: 10px;">
              <label for="paymentMethod">お支払い方法を選択 *</label>
              <select id="paymentMethod" required onchange="togglePaymentFields()">
                <option value="現金">現金</option>
                <option value="ニナファームカード">ニナファームカード</option>
                <option value="クレジットカード">クレジットカード</option>
                <option value="PayPay">PayPay</option>
              </select>
            </div>

            <!-- ニナファームカード / クレジットカード選択時の追加エリア -->
            <div id="paymentExtraFields" style="display: none; background-color: rgba(200, 162, 97, 0.08); padding: 14px; border-radius: 8px; border: 1px solid var(--accent-gold); margin-top: 10px;">
              <!-- E-Service PW -->
              <div class="form-group" id="eservicePwGroup" style="margin-bottom: 12px;">
                <label for="eservicePw">E-Service PW</label>
                <input type="password" id="eservicePw" placeholder="パスワードを入力">
              </div>

              <!-- ニナポイント -->
              <div class="form-group" id="ninaPointGroup" style="display: none;">
                <label for="ninaPoint">ニナポイント利用（※利用する場合のみ）</label>
                <input type="number" id="ninaPoint" placeholder="例: 1000" min="0" oninput="updateCalc()">
                <span class="sub-note" style="display: block; margin-top: 4px;">※1pt ＝ 1円としてお値引きされます</span>
              </div>
            </div>
          </div>

          <!-- お届け先エリア -->
          <div class="info-card">
            <div class="section-title">3. お届け先（配送ご希望の方のみ入力）</div>
            
            <div class="form-group" style="margin-bottom: 12px;">
              <label for="shipName">お届け先お名前</label>
              <input type="text" id="shipName" placeholder="例: 山田 花子（氏名と異なる場合等）">
            </div>

            <div class="form-group" style="margin-bottom: 12px;">
              <label for="zip">郵便番号（ハイフンなし7桁）</label>
              <input type="text" id="zip" class="p-postal-code" maxlength="7" placeholder="例: 8600000">
            </div>

            <div class="form-group" style="margin-bottom: 12px;">
              <label for="address">住所</label>
              <input type="text" id="address" class="p-region p-locality p-street-address p-extended-address" placeholder="自動入力されます">
            </div>

            <div class="form-group">
              <label for="phone">電話番号</label>
              <input type="tel" id="phone" placeholder="例: 09012345678">
            </div>

            <div style="text-align: right; margin-top: 12px;">
              <button type="button" onclick="clearSavedInfo()" style="background: none; border: none; color: var(--wood-medium); text-decoration: underline; font-size: 12px; cursor: pointer; padding: 6px;">
                端末に保存された住所等を削除
              </button>
            </div>
          </div>

          <!-- 商品一覧テーブル -->
          <div class="info-card">
            <div class="section-title">4. 注文商品と数量</div>
            <p class="sub-note">注文商品と数量を選択してください</p>
            <table class="product-table" style="width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem;">
              <thead>
                <tr style="background-color: var(--bg-cream);">
                  <th style="border: 1px solid var(--border-color); padding: 8px 6px; text-align: left;">商品名</th>
                  <th style="border: 1px solid var(--border-color); padding: 8px 6px; width: 75px; text-align: center;">価格(税込)</th>
                  <th style="border: 1px solid var(--border-color); padding: 8px 6px; width: 70px; text-align: center;">獲得Pt</th>
                  <th style="border: 1px solid var(--border-color); padding: 8px 6px; width: 75px; text-align: center;">数量</th>
                </tr>
              </thead>
              <tbody id="productTableBody"></tbody>
            </table>
          </div>

          <!-- 追加済み注文リスト（確認用） -->
          <div id="orderListContainer" class="info-card" style="display: none; border: 2px solid var(--accent-gold); background-color: rgba(200, 162, 97, 0.05);">
            <div class="section-title" style="color: var(--wood-dark); border-color: var(--accent-gold);">
              📋 追加済みの注文（<span id="orderCount">0</span>件）
            </div>
            <div id="addedOrdersList" style="font-size: 0.88rem; margin-bottom: 12px;"></div>
            <button type="button" onclick="generateAllReceipts()" class="btn-secondary" style="width: 100%; padding: 14px; background-color: var(--wood-dark); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 1rem;">
              🏁 注文書の一括作成画面へ
            </button>
          </div>

          <!-- 戻るボタン -->
          <a href="index.html" class="back-btn" style="display: block; text-align: center; margin-top: 20px; color: var(--wood-medium); text-decoration: none; font-size: 0.95rem; padding: 10px;">
            ‹ トップページへ戻る
          </a>

          <!-- 下部固定フッター -->
          <div class="footer-bar" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;">
            <div class="total-preview" style="font-size: 0.88rem;">
              お支払額: <span id="displayPrice" style="font-size: 1.15rem; color: #b22222; font-weight:bold;">¥0</span><br>
              <span style="font-size: 0.78rem; color: var(--wood-medium);">(小計: <span id="displaySubtotal">¥0</span> / 獲得Pt: <span id="displayPt" style="color: #2b5797;">0pt</span>)</span>
            </div>
            <button type="button" onclick="addOrderToList()" class="btn-copy" style="padding: 12px 20px; font-size: 0.92rem; font-weight: bold;">
              ＋ この注文を追加
            </button>
          </div>

        </form>
      </div>

      <!-- 完成画面 -->
      <div id="completeSection" style="display: none;">
        
        <div class="screenshot-notice" style="background-color: rgba(200, 162, 97, 0.1); border: 1px solid var(--accent-gold); color: var(--wood-dark); padding: 14px; border-radius: 8px; font-size: 0.88rem; text-align: center; line-height: 1.6; margin-bottom: 15px;">
          📱 各カード下の緑のボタンをタップすると、注文書画像を保存できます！
        </div>

        <!-- 注文書カードが動的に生成されるコンテナ -->
        <div id="receiptsWrapper"></div>

        <!-- 下部ボタンエリア -->
        <div style="margin-top: 20px;">
          <button onclick="downloadAllPDF()" class="btn-secondary" style="width: 100%; padding: 14px; background-color: #2b5797; color: white; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 12px; cursor: pointer; font-size: 1rem;">📄 全枚数をまとめて1つのPDFで保存</button>
          <button onclick="location.reload()" class="btn-secondary" style="width: 100%; padding: 14px; background-color: #6c757d; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;">🔄 最初の入力に戻る</button>
        </div>

      </div>
    </div>
  </main>

  <script>
    const productMaster = {
      "OX-288": { price: 13800, pt: { "7月度": 10000, "8月度": 10000 } },
      "OX-288(追加購入)": { price: 13800, pt: { "7月度": 10000, "8月度": 10000 } },
      "OX-288 (ゼリータイプ)": { price: 14200, pt: { "7月度": 10000, "8月度": 10000 } },
      "ボアソン": { price: 10800, pt: { "7月度": 10000, "8月度": 10000 } },
      "ハイプロリーナ": { price: 7200, pt: { "7月度": 6000, "8月度": 6000 } },
      "ゼウス 2026": { price: 17800, pt: { "7月度": 13000, "8月度": 13000 } },
      "アルピニスト スラージュ": { price: 4000, pt: { "7月度": 1400, "8月度": 2800 } },
      "O・M・C プロテイン": { price: 6000, pt: { "7月度": 2000, "8月度": 5000 } },
      "オヴェルデ エクストラバージンオリーブオイル": { price: 4000, pt: { "7月度": 1400, "8月度": 3300 } },
      "サヴォン アンベリール (120g)": { price: 5200, pt: { "7月度": 1800, "8月度": 4300 } },
      "サヴォン アンベリール (70g)": { price: 3500, pt: { "7月度": 1200, "8月度": 2900 } },
      "ブランシュール (150g)": { price: 12200, pt: { "7月度": 10500, "8月度": 10500 } },
      "ブランシュール (80g)": { price: 6800, pt: { "7月度": 5800, "8月度": 5800 } },
      "デマキヤン": { price: 4100, pt: { "7月度": 1500, "8月度": 3400 } },
      "赤化粧水": { price: 3600, pt: { "7月度": 1300, "8月度": 3000 } },
      "赤美容液": { price: 6400, pt: { "7月度": 2300, "8月度": 5400 } },
      "赤ジェル": { price: 4800, pt: { "7月度": 1700, "8月度": 4000 } },
      "白化粧水": { price: 3600, pt: { "7月度": 3000, "8月度": 3000 } },
      "白美容液": { price: 6400, pt: { "7月度": 5400, "8月度": 5400 } },
      "白ジェル": { price: 4800, pt: { "7月度": 4000, "8月度": 4000 } },
      "グルナードゥ": { price: 32000, pt: { "7月度": 26000, "8月度": 26000 } },
      "リペアセラム": { price: 14800, pt: { "7月度": 15000, "8月度": 15000 } },
      "リペアクリーム": { price: 18700, pt: { "7月度": 6600, "8月度": 15000 } },
      "レボリューション": { price: 17200, pt: { "7月度": 9000, "8月度": 14500 } },
      "グロウジェルクリーム": { price: 9800, pt: { "7月度": 3600, "8月度": 8000 } },
      "ハンドモイスチャー": { price: 2200, pt: { "7月度": 700, "8月度": 1800 } },
      "リップセラム": { price: 2000, pt: { "7月度": 600, "8月度": 1600 } },
      "ボディミルク": { price: 3200, pt: { "7月度": 1000, "8月度": 2500 } },
      "ミュー ヴィサージュ": { price: 3300, pt: { "7月度": 1200, "8月度": 2600 } },
      "ミューコール": { price: 3300, pt: { "7月度": 2600, "8月度": 2600 } },
      "バイオミスト": { price: 3700, pt: { "7月度": 3000, "8月度": 3000 } },
      "ボディソープ": { price: 3200, pt: { "7月度": 2500, "8月度": 2500 } },
      "シャンプー": { price: 3200, pt: { "7月度": 1000, "8月度": 2500 } },
      "トリートメント": { price: 3200, pt: { "7月度": 1000, "8月度": 2500 } },
      "ヘアマスク": { price: 3200, pt: { "7月度": 1000, "8月度": 2500 } },
      "スカルプトナー": { price: 9200, pt: { "7月度": 7500, "8月度": 7500 } },
      "クレオ デンタルクリーン": { price: 2200, pt: { "7月度": 700, "8月度": 1800 } },
      "クレオ マウスウォッシュ": { price: 3200, pt: { "7月度": 1000, "8月度": 2500 } },
      "アロマオイル ローズ": { price: 8700, pt: { "7月度": 3000, "8月度": 7300 } },
      "ゼウス オードゥ パルファン 2026": { price: 21000, pt: { "7月度": 16000, "8月度": 18000 } },
      "モン コパン": { price: 3500, pt: { "7月度": 2800, "8月度": 2800 } },
      "モン コパン ジュレ": { price: 3500, pt: { "7月度": 2800, "8月度": 2800 } }
    };
    let allOrders = [];
    let currentSubtotal = 0;
    let currentGrandTotal = 0;
    let currentGrandPt = 0;
    let currentItemsData = [];

    window.addEventListener('DOMContentLoaded', () => {
      const memberIdSub = document.getElementById('memberIdSub');
      memberIdSub.innerHTML = '';

      for (let i = 0; i <= 20; i++) {
        const opt = document.createElement('option');
        const val = String(i).padStart(2, '0');
        opt.value = val;
        opt.textContent = val;
        memberIdSub.appendChild(opt);
      }

      const tbody = document.getElementById('productTableBody');
      let prodIndex = 0;
      for (let prod in productMaster) {
        prodIndex++;
        const tr = document.createElement('tr');
        let qtyOptions = '<option value="0">0</option>';
        for (let i = 1; i <= 20; i++) {
          qtyOptions += `<option value="${i}">${i}</option>`;
        }

        tr.innerHTML = `
          <td style="border: 1px solid var(--border-color); padding: 8px 6px;"><strong>${prod}</strong></td>
          <td style="border: 1px solid var(--border-color); padding: 8px 6px; color: var(--wood-medium); text-align: right;">¥${productMaster[prod].price.toLocaleString()}</td>
          <td style="border: 1px solid var(--border-color); padding: 8px 6px; text-align: right; color: #2b5797; font-weight: bold;" id="pt-cell-${prodIndex}">-</td>
          <td style="border: 1px solid var(--border-color); padding: 8px 6px; text-align: center;">
            <select class="qty-select" data-product="${prod}">
              ${qtyOptions}
            </select>
          </td>
        `;
        tbody.appendChild(tr);
      }

      document.querySelectorAll('.qty-select').forEach(sel => sel.addEventListener('change', updateCalc));
      document.getElementById('month').addEventListener('change', updateCalc);

      const savedData = localStorage.getItem('salonOrderUserInfo');
      if (savedData) {
        try {
          const user = JSON.parse(savedData);
          if (user.month) document.getElementById('month').value = user.month;
          if (user.memberIdMain) document.getElementById('memberIdMain').value = user.memberIdMain;
          if (user.memberIdSub) document.getElementById('memberIdSub').value = user.memberIdSub;
          if (user.fullName) document.getElementById('fullName').value = user.fullName;
          if (user.paymentMethod) {
            document.getElementById('paymentMethod').value = user.paymentMethod;
            togglePaymentFields();
          }
          if (user.shipName) document.getElementById('shipName').value = user.shipName;
          if (user.zip) document.getElementById('zip').value = user.zip;
          if (user.address) document.getElementById('address').value = user.address;
          if (user.phone) document.getElementById('phone').value = user.phone;
          updateCalc();
        } catch (e) {}
      }
    });

    function togglePaymentFields() {
      const method = document.getElementById('paymentMethod').value;
      const extraContainer = document.getElementById('paymentExtraFields');
      const pwGroup = document.getElementById('eservicePwGroup');
      const ptGroup = document.getElementById('ninaPointGroup');

      if (method === 'ニナファームカード') {
        extraContainer.style.display = 'block';
        pwGroup.style.display = 'block';
        ptGroup.style.display = 'block';
      } else if (method === 'クレジットカード') {
        extraContainer.style.display = 'block';
        pwGroup.style.display = 'block';
        ptGroup.style.display = 'none';
        document.getElementById('ninaPoint').value = '';
      } else {
        extraContainer.style.display = 'none';
        pwGroup.style.display = 'none';
        ptGroup.style.display = 'none';
        document.getElementById('eservicePw').value = '';
        document.getElementById('ninaPoint').value = '';
      }
      updateCalc();
    }

    function updateCalc() {
      const month = document.getElementById('month').value;
      const selects = document.querySelectorAll('.qty-select');
      
      currentSubtotal = 0;
      currentGrandPt = 0;
      currentItemsData = [];

      let idx = 0;
      for (let prod in productMaster) {
        idx++;
        const cell = document.getElementById(`pt-cell-${idx}`);
        if (cell) {
          if (month && productMaster[prod].pt && productMaster[prod].pt[month] !== undefined) {
            cell.textContent = productMaster[prod].pt[month].toLocaleString() + "pt";
          } else {
            cell.textContent = "-";
          }
        }
      }

      selects.forEach(sel => {
        const qty = parseInt(sel.value) || 0;
        if (qty > 0) {
          const prod = sel.getAttribute('data-product');
          const itemPrice = productMaster[prod].price * qty;
          let itemPt = (month && productMaster[prod].pt && productMaster[prod].pt[month]) ? productMaster[prod].pt[month] * qty : 0;

          currentSubtotal += itemPrice;
          currentGrandPt += itemPt;

          currentItemsData.push({
            product: prod,
            quantity: qty,
            price: itemPrice,
            pt: itemPt
          });
        }
      });

      const method = document.getElementById('paymentMethod').value;
      let usedPt = 0;
      if (method === 'ニナファームカード') {
        usedPt = parseInt(document.getElementById('ninaPoint').value) || 0;
      }

      currentGrandTotal = Math.max(0, currentSubtotal - usedPt);

      document.getElementById('displaySubtotal').textContent = "¥" + currentSubtotal.toLocaleString();
      document.getElementById('displayPrice').textContent = "¥" + currentGrandTotal.toLocaleString();
      document.getElementById('displayPt').textContent = currentGrandPt.toLocaleString() + "pt";
    }

    function addOrderToList() {
      if (currentItemsData.length === 0) {
        alert("数量が選択されている商品がありません。1点以上選択してください。");
        return;
      }

      const month = document.getElementById('month').value;
      const memberIdMain = document.getElementById('memberIdMain').value.trim();
      const memberIdSub = document.getElementById('memberIdSub').value;
      const fullName = document.getElementById('fullName').value.trim();

      if (!month || !memberIdMain || !fullName) {
        alert("発注月度、会員番号、氏名は必須項目です。");
        return;
      }

      const paymentMethod = document.getElementById('paymentMethod').value;
      const eservicePw = document.getElementById('eservicePw').value.trim();
      const ninaPoint = parseInt(document.getElementById('ninaPoint').value) || 0;

      const shipName = document.getElementById('shipName').value.trim();
      const zip = document.getElementById('zip').value.trim();
      const address = document.getElementById('address').value.trim();
      const phone = document.getElementById('phone').value.trim();

      localStorage.setItem('salonOrderUserInfo', JSON.stringify({
        month, memberIdMain, memberIdSub, fullName, paymentMethod, shipName, zip, address, phone
      }));

      const today = new Date();
      const yy = String(today.getFullYear()).slice(-2);
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const randomStr = Math.random().toString(36).substring(2, 6).toUpperCase();
      const generatedOrderId = `${yy}${mm}${dd}-${randomStr}`;

      allOrders.push({
        orderId: generatedOrderId,
        month,
        memberId: memberIdMain + "-" + memberIdSub,
        fullName,
        paymentMethod,
        eservicePw: (paymentMethod === 'ニナファームカード' || paymentMethod === 'クレジットカード') ? eservicePw : '',
        ninaPoint: paymentMethod === 'ニナファームカード' ? ninaPoint : 0,
        shipName, zip, address, phone,
        items: [...currentItemsData],
        subtotalPrice: currentSubtotal,
        totalPrice: currentGrandTotal,
        totalPt: currentGrandPt
      });

      document.querySelectorAll('.qty-select').forEach(sel => sel.value = "0");
      document.getElementById('memberIdMain').value = "";
      document.getElementById('fullName').value = "";
      document.getElementById('eservicePw').value = "";
      document.getElementById('ninaPoint').value = "";
      updateCalc();

      renderOrderList();
      alert(`「${fullName}」様の注文を追加しました！（現在 ${allOrders.length} 件）`);
    }

    function renderOrderList() {
      const container = document.getElementById('orderListContainer');
      const listDiv = document.getElementById('addedOrdersList');
      
      if (allOrders.length === 0) {
        container.style.display = "none";
        return;
      }

      container.style.display = "block";
      document.getElementById('orderCount').textContent = allOrders.length;

      let html = "";
      allOrders.forEach((ord, i) => {
        let ptNote = ord.ninaPoint > 0 ? ` (ポイント利用 -¥${ord.ninaPoint.toLocaleString()})` : '';
        html += `
          <div style="border-bottom: 1px dashed var(--border-color); padding: 8px 0; display: flex; justify-content: space-between; align-items: center;">
            <div>
              <strong>${i + 1}. ${ord.fullName}</strong> (${ord.memberId}) <small style="color:var(--wood-medium);">[ID: ${ord.orderId}]</small> - <span style="color:var(--wood-dark);">${ord.paymentMethod}</span><br>
              <small style="color: var(--wood-medium);">支払額: ¥${ord.totalPrice.toLocaleString()}${ptNote} / ${ord.totalPt.toLocaleString()}pt</small>
            </div>
            <button type="button" onclick="removeOrder(${i})" style="color: #b22222; border: none; background: none; cursor: pointer; font-size: 0.85rem; padding: 6px;">削除</button>
          </div>
        `;
      });
      listDiv.innerHTML = html;
    }

    function removeOrder(index) {
      allOrders.splice(index, 1);
      renderOrderList();
    }

    function generateAllReceipts() {
      if (allOrders.length === 0) return;

      const wrapper = document.getElementById('receiptsWrapper');
      wrapper.innerHTML = "";

      const now = new Date();
      const dateStr = "作成日時: " + now.getFullYear() + "/" + (now.getMonth()+1) + "/" + now.getDate() + " " + now.getHours() + ":" + String(now.getMinutes()).padStart(2, '0');

      allOrders.forEach((ord, index) => {
        const orderId = ord.orderId;
        
        let totalQty = 0;
        let itemRows = "";
        ord.items.forEach(item => {
          totalQty += item.quantity;
          itemRows += `
            <tr>
              <td style="border: 1px solid var(--border-color); padding: 6px;"><strong>${item.product}</strong></td>
              <td style="border: 1px solid var(--border-color); padding: 6px; text-align: center;">${item.quantity}</td>
              <td style="border: 1px solid var(--border-color); padding: 6px; text-align: right;">¥${item.price.toLocaleString()}</td>
              <td style="border: 1px solid var(--border-color); padding: 6px; text-align: right; color: #2b5797;">${item.pt ? item.pt.toLocaleString() + 'pt' : '-'}</td>
            </tr>
          `;
        });

        let paymentInfoBlock = `<div>お支払い方法: <strong>${ord.paymentMethod}</strong></div>`;
        if (ord.paymentMethod === 'ニナファームカード' || ord.paymentMethod === 'クレジットカード') {
          if (ord.eservicePw) {
            paymentInfoBlock += `<div>E-Service PW: <strong>${ord.eservicePw}</strong></div>`;
          }
        }
        if (ord.paymentMethod === 'ニナファームカード' && ord.ninaPoint > 0) {
          paymentInfoBlock += `<div>ニナポイント利用: <strong>${ord.ninaPoint.toLocaleString()} pt (-¥${ord.ninaPoint.toLocaleString()})</strong></div>`;
        }

        let addressBlock = "";
        if (ord.shipName || ord.address || ord.zip || ord.phone) {
          addressBlock = `
            <div style="margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-color);">
              <div style="font-weight: bold; color: var(--wood-dark); margin-bottom: 2px;">【お届け先情報】</div>
              <div>${ord.shipName ? "お名前: " + ord.shipName : "お名前: " + ord.fullName}</div>
              <div>${ord.zip ? "〒" + ord.zip : ""}</div>
              <div>${ord.address ? "住所: " + ord.address : ""}</div>
              <div>${ord.phone ? "TEL: " + ord.phone : ""}</div>
            </div>
          `;
        }

        let totalBlock = "";
        if (ord.ninaPoint > 0) {
          totalBlock = `
            <div style="display: flex; justify-content: space-between; color: var(--wood-medium); font-size: 0.85rem;">
              <span>小計金額:</span>
              <span>¥${ord.subtotalPrice.toLocaleString()}</span>
            </div>
            <div style="display: flex; justify-content: space-between; color: #b22222; font-size: 0.85rem;">
              <span>ニナポイント値引き:</span>
              <span>-¥${ord.ninaPoint.toLocaleString()}</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-weight: bold; margin-top: 4px;">
              <span>お支払い合計金額:</span>
              <span style="color: #b22222; font-size: 1rem;">¥${ord.totalPrice.toLocaleString()}</span>
            </div>
          `;
        } else {
          totalBlock = `
            <div style="display: flex; justify-content: space-between; font-weight: bold;">
              <span>合計金額:</span>
              <span style="color: #b22222;">¥${ord.totalPrice.toLocaleString()}</span>
            </div>
          `;
        }

        const cardWrapper = document.createElement('div');
        cardWrapper.className = "card-wrapper";
        cardWrapper.style.marginBottom = "25px";
        cardWrapper.style.backgroundColor = "#fff";
        cardWrapper.style.borderRadius = "8px";
        cardWrapper.style.boxShadow = "0 1px 4px rgba(0,0,0,0.1)";
        cardWrapper.style.overflow = "hidden";

        cardWrapper.innerHTML = `
          <div id="card-target-${index}" class="receipt-box target-card" style="background-color: #fff; border: 2px solid var(--wood-dark); padding: 15px; border-radius: 8px 8px 0 0; text-align: left;">
            <div class="receipt-header" style="text-align: center; border-bottom: 2px solid var(--wood-dark); padding-bottom: 8px; margin-bottom: 12px;">
              <h3 style="margin: 0; font-size: 1rem; color: var(--wood-dark);">南熊本サロン専用商品購入注文書</h3>
              <div class="order-id-badge" style="display: inline-block; background-color: var(--wood-dark); color: #fff; font-size: 0.75rem; font-weight: bold; padding: 2px 8px; border-radius: 12px; margin-top: 4px;">発注ID: ${orderId}</div>
              <p style="margin: 5px 0 0 0; font-size: 0.75rem; color: var(--wood-medium);">${dateStr}</p>
            </div>
            <div class="receipt-info" style="margin-bottom: 12px; font-size: 0.88rem; line-height: 1.6;">
              <div>発注月度: <strong>${ord.month}</strong></div>
              <div>購入会員番号: <strong>${ord.memberId}</strong></div>
              <div>氏名: <strong>${ord.fullName}</strong></div>
              ${paymentInfoBlock}
              ${addressBlock}
            </div>
            <table class="product-table" style="width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 0.82rem;">
              <thead>
                <tr style="background-color: var(--bg-cream);">
                  <th style="border: 1px solid var(--border-color); padding: 6px;">商品名</th>
                  <th style="border: 1px solid var(--border-color); padding: 6px; width: 35px; text-align: center;">数量</th>
                  <th style="border: 1px solid var(--border-color); padding: 6px; width: 70px; text-align: right;">小計(税込)</th>
                  <th style="border: 1px solid var(--border-color); padding: 6px; width: 55px; text-align: right;">ポイント</th>
                </tr>
              </thead>
              <tbody>${itemRows}</tbody>
            </table>
            <div style="border-top: 2px dashed var(--wood-dark); padding-top: 10px; font-size: 0.9rem;">
              <div style="display: flex; justify-content: space-between; font-weight: bold; color: var(--wood-dark); margin-bottom: 4px;">
                <span>合計数量:</span>
                <span>${totalQty} 点</span>
              </div>
              ${totalBlock}
              <div style="display: flex; justify-content: space-between; font-weight: bold; margin-top: 4px;">
                <span>獲得ポイント:</span>
                <span style="color: #2b5797;">${ord.totalPt.toLocaleString()}pt</span>
              </div>
            </div>
          </div>
          <button type="button" class="btn-card-download" style="width: 100%; padding: 14px; background-color: #2e7d32; color: white; border: none; border-radius: 0 0 8px 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer;" onclick="downloadSingleCard('card-target-${index}')">
            📷 この注文書（${ord.fullName}様分）を画像保存
          </button>
        `;
        wrapper.appendChild(cardWrapper);
      });

      const summaryItems = {};
      let totalAllSubtotal = 0;
      let totalAllNinaPoint = 0;
      let totalAllPayPrice = 0;
      let totalAllPt = 0;
      let grandTotalQty = 0;

      allOrders.forEach(ord => {
        totalAllSubtotal += ord.subtotalPrice;
        totalAllNinaPoint += ord.ninaPoint;
        totalAllPayPrice += ord.totalPrice;
        totalAllPt += ord.totalPt;

        ord.items.forEach(item => {
          grandTotalQty += item.quantity;
          if (!summaryItems[item.product]) {
            summaryItems[item.product] = { quantity: 0, price: 0, pt: 0 };
          }
          summaryItems[item.product].quantity += item.quantity;
          summaryItems[item.product].price += item.price;
          summaryItems[item.product].pt += (item.pt || 0);
        });
      });

      let summaryRows = "";
      for (let prod in summaryItems) {
        summaryRows += `
          <tr>
            <td style="border: 1px solid var(--border-color); padding: 6px;"><strong>${prod}</strong></td>
            <td style="border: 1px solid var(--border-color); padding: 6px; text-align: center;">${summaryItems[prod].quantity}</td>
            <td style="border: 1px solid var(--border-color); padding: 6px; text-align: right;">¥${summaryItems[prod].price.toLocaleString()}</td>
            <td style="border: 1px solid var(--border-color); padding: 6px; text-align: right; color: #2b5797;">${summaryItems[prod].pt ? summaryItems[prod].pt.toLocaleString() + 'pt' : '-'}</td>
          </tr>
        `;
      }

      let summaryTotalBlock = "";
      if (totalAllNinaPoint > 0) {
        summaryTotalBlock = `
          <div style="display: flex; justify-content: space-between; color: var(--wood-medium); font-size: 0.85rem;">
            <span>全商品 定価総額:</span>
            <span>¥${totalAllSubtotal.toLocaleString()}</span>
          </div>
          <div style="display: flex; justify-content: space-between; color: #b22222; font-size: 0.85rem;">
            <span>ニナポイント利用総額:</span>
            <span>-¥${totalAllNinaPoint.toLocaleString()}</span>
          </div>
          <div style="display: flex; justify-content: space-between; font-weight: bold; margin-top: 4px;">
            <span>全合算 実際の支払総合計:</span>
            <span style="color: #b22222; font-size: 1.1rem;">¥${totalAllPayPrice.toLocaleString()}</span>
          </div>
        `;
      } else {
        summaryTotalBlock = `
          <div style="display: flex; justify-content: space-between; font-weight: bold;">
            <span>全合算 総合計金額:</span>
            <span style="color: #b22222; font-size: 1.1rem;">¥${totalAllPayPrice.toLocaleString()}</span>
          </div>
        `;
      }

      const summaryWrapper = document.createElement('div');
      summaryWrapper.className = "card-wrapper";
      summaryWrapper.style.marginBottom = "25px";
      summaryWrapper.style.backgroundColor = "#fff";
      summaryWrapper.style.borderRadius = "8px";
      summaryWrapper.style.boxShadow = "0 1px 4px rgba(0,0,0,0.1)";
      summaryWrapper.style.overflow = "hidden";

      summaryWrapper.innerHTML = `
        <div id="card-target-summary" class="receipt-box target-card" style="background-color: #fff; border: 2px solid var(--wood-dark); padding: 15px; border-radius: 8px 8px 0 0; text-align: left;">
          <div class="receipt-header" style="text-align: center; border-bottom: 2px solid var(--wood-dark); padding-bottom: 8px; margin-bottom: 12px;">
            <h3 style="margin: 0; font-size: 1rem; color: var(--wood-dark);">【全体合算】注文集計まとめ</h3>
            <p style="margin: 5px 0 0 0; font-size: 0.75rem; color: var(--wood-medium);">対象注文数: ${allOrders.length} 件 | ${dateStr}</p>
          </div>
          <div style="font-size: 0.8rem; margin-bottom: 10px; background-color: rgba(200, 162, 97, 0.08); padding: 8px; border-radius: 4px;">
            <strong>対象会員一覧:</strong><br>
            ${allOrders.map(o => `${o.fullName} 様 (${o.memberId}) [ID: ${o.orderId}]`).join('<br>')}
          </div>
          <table class="product-table" style="width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 0.82rem;">
            <thead>
              <tr style="background-color: var(--bg-cream);">
                <th style="border: 1px solid var(--border-color); padding: 6px;">商品名（全体合計）</th>
                <th style="border: 1px solid var(--border-color); padding: 6px; width: 45px; text-align: center;">総数量</th>
                <th style="border: 1px solid var(--border-color); padding: 6px; width: 75px; text-align: right;">総合計(税込)</th>
                <th style="border: 1px solid var(--border-color); padding: 6px; width: 60px; text-align: right;">総ポイント</th>
              </tr>
            </thead>
            <tbody>${summaryRows}</tbody>
          </table>
          <div style="border-top: 2px solid var(--wood-dark); padding-top: 10px; font-size: 0.95rem;">
            <div style="display: flex; justify-content: space-between; font-weight: bold; color: var(--wood-dark); margin-bottom: 4px;">
              <span>全合算 総数量:</span>
              <span>${grandTotalQty} 点</span>
            </div>
            ${summaryTotalBlock}
            <div style="display: flex; justify-content: space-between; font-weight: bold; margin-top: 4px;">
              <span>全合算 総獲得ポイント:</span>
              <span style="color: #2b5797;">${totalAllPt.toLocaleString()}pt</span>
            </div>
          </div>
        </div>
        <button type="button" class="btn-card-download" style="width: 100%; padding: 14px; background-color: var(--wood-dark); color: white; border: none; border-radius: 0 0 8px 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer;" onclick="downloadSingleCard('card-target-summary')">
          📊 「全体まとめ」を画像保存
        </button>
      `;
      wrapper.appendChild(summaryWrapper);

      document.getElementById('formSection').style.display = "none";
      const footerBar = document.querySelector('.footer-bar');
      if (footerBar) footerBar.style.display = "none";
      document.getElementById('completeSection').style.display = "block";
      window.scrollTo(0, 0);
    }

    async function downloadSingleCard(elementId) {
      const targetElement = document.getElementById(elementId);
      if (!targetElement) return;

      const btn = (typeof event !== 'undefined' && event) ? event.currentTarget : null;
      const originalText = btn ? btn.textContent : '';
      if (btn) {
        btn.textContent = "⌛ 画像を生成中...";
        btn.disabled = true;
      }

      try {
        const canvas = await html2canvas(targetElement, { scale: 2 });
        const imgData = canvas.toDataURL('image/png');

        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        const now = new Date();
        const timeStr = now.getFullYear() + String(now.getMonth()+1).padStart(2, '0') + String(now.getDate()).padStart(2, '0') + "_" + String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0');
        const filename = `注文書_${timeStr}.png`;

        if (isIOS) {
          // iPhoneの場合は従来どおり長押し保存用モーダルを表示
          const modal = document.createElement('div');
          modal.className = 'image-modal-overlay';
          modal.style.position = 'fixed';
          modal.style.top = '0';
          modal.style.left = '0';
          modal.style.width = '100%';
          modal.style.height = '100%';
          modal.style.background = 'rgba(0, 0, 0, 0.85)';
          modal.style.display = 'flex';
          modal.style.flexDirection = 'column';
          modal.style.justifyContent = 'center';
          modal.style.alignItems = 'center';
          modal.style.zIndex = '9999';
          modal.style.padding = '20px';
          modal.style.boxSizing = 'border-box';

          modal.innerHTML = `
            <div style="color: #fff; font-size: 0.95rem; margin-bottom: 12px; text-align: center; font-weight: bold; line-height: 1.5;">
              📱 画像が生成されました！<br>
              下の画像を<span style="color: #ffeb3b; font-size: 1.1em;">「長押し」</span>して<br>
              【画像を保存】または【"写真"に追加】してください
            </div>
            <img src="${imgData}" style="max-width: 90%; max-height: 65vh; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); background: #fff; object-fit: contain;" alt="注文書画像">
            <button type="button" style="margin-top: 15px; padding: 10px 25px; background: #6c757d; color: white; border: none; border-radius: 20px; font-size: 0.95rem; cursor: pointer; font-weight: bold;" onclick="this.parentElement.remove()">✕ 閉じる</button>
          `;
          document.body.appendChild(modal);
        } else {
          // AndroidおよびPCの場合はBlobを経由して直接ファイルとしてダウンロード
          const byteString = atob(imgData.split(',')[1]);
          const mimeString = imgData.split(',')[0].split(':')[1].split(';')[0];
          const ab = new ArrayBuffer(byteString.length);
          const ia = new Uint8Array(ab);
          for (let i = 0; i < byteString.length; i++) {
            ia[i] = byteString.charCodeAt(i);
          }
          const blob = new Blob([ab], {type: mimeString});
          const blobUrl = URL.createObjectURL(blob);

          const link = document.createElement('a');
          link.href = blobUrl;
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
        }
      } catch (e) {
        alert("画像の生成に失敗しました: " + e.message);
      } finally {
        if (btn) {
          btn.textContent = originalText;
          btn.disabled = false;
        }
      }
    }

    async function downloadAllPDF() {
      const cards = document.querySelectorAll('.target-card');
      const { jsPDF } = window.jspdf;
      let pdf = null;

      for (let i = 0; i < cards.length; i++) {
        const card = cards[i];
        const canvas = await html2canvas(card, { scale: 2 });
        const imgData = canvas.toDataURL('image/png');

        if (i === 0) {
          pdf = new jsPDF('p', 'mm', 'a4');
        } else {
          pdf.addPage();
        }

        const imgProps = pdf.getImageProperties(imgData);
        const pdfWidth = pdf.internal.pageSize.getWidth() - 20;
        const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
        
        pdf.addImage(imgData, 'PNG', 10, 10, pdfWidth, pdfHeight);
      }

      if (pdf) {
        pdf.save("注文書_まとめ一括.pdf");
      }
    }

    function clearSavedInfo() {
      if (confirm("端末に保存されている住所等の情報を削除しますか？")) {
        localStorage.removeItem('salonOrderUserInfo');
        alert("削除しました。");
        location.reload();
      }
    }
  </script>
