<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サロンインフォメーション＆注文 portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px 15px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 20px;
            margin: 0 0 5px 0;
            color: #1d1d1f;
        }
        .header p {
            font-size: 13px;
            color: #86868b;
            margin: 0;
        }
        .card {
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .card-title {
            font-size: 15px;
            font-weight: bold;
            color: #007aff;
            margin-top: 0;
            margin-bottom: 12px;
            border-bottom: 2px solid #f0f0f2;
            padding-bottom: 8px;
        }
        .notice-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 14px;
            line-height: 1.6;
        }
        .notice-item {
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f2;
        }
        .notice-item:last-child {
            border-bottom: none;
        }
        .badge-soldout {
            background-color: #ff3b30;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 6px;
        }
        .badge-info {
            background-color: #34c759;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 6px;
        }
        .hours-info {
            font-size: 14px;
            line-height: 1.8;
        }
        .btn-order {
            display: block;
            background-color: #007aff;
            color: white;
            text-align: center;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(0,122,255,0.25);
            margin-top: 20px;
        }
        .btn-order:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- ヘッダー -->
    <div class="header">
        <h1>サロン注文＆インフォメーション</h1>
        <p>最新のお知らせ・完売情報</p>
    </div>

    <!-- 1. お知らせ・完売情報 -->
    <div class="card">
        <div class="card-title">📢 最新のお知らせ・在庫状況</div>
        <ul class="notice-list">
            <li class="notice-item">
                <span class="badge-soldout">完売</span>
                OX-288 (ゼリータイプ) は本日分完売しました
            </li>
            <li class="notice-item">
                <span class="badge-info">入荷</span>
                ゼウス 2026 再入荷いたしました
            </li>
            <li class="notice-item">
                <span class="badge-info">案内</span>
                8月度の注文受付を開始しております
            </li>
        </ul>
    </div>

    <!-- 2. 営業時間案内 -->
    <div class="card">
        <div class="card-title">⏰ 営業時間・受付時間</div>
        <div class="hours-info">
            <div><strong>【注文受付時間】</strong> 10:00 〜 19:00</div>
            <div><strong>【定休日】</strong> 日曜日・祝日</div>
            <div style="font-size: 12px; color: #86868b; margin-top: 6px;">
                ※時間外の送信分は翌営業日の処理となります。
            </div>
        </div>
    </div>

    <!-- 3. 注文ツールへのリンクボタン（※現在は仮でindex.htmlに繋いでいます） -->
    <a href="index.html" class="btn-order">🛍️ 注文書を作成する</a>

</div>

</body>
</html>
