<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ミトコンドリアちゃんと進める郵送登録｜メンバーズガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./guide-shared-chrome.css?v=20261026-1">
<link rel="stylesheet" href="./guide-design-system.css?v=20261028-2">
<link rel="stylesheet" href="./guide-registration-flow.css?v=20261028-1">
</head><body class="registration-guide">
<main class="registration-flow guide-common-page">
<h1 class="guide-common-title">郵送登録ガイド</h1>
<div class="guide-progress guide-common-progress" aria-label="ガイドの進行状況"><div class="progress-top"><span id="stage">概要書面の確認</span><span class="progress-count" id="count" aria-live="polite">1 / 8</span></div><div class="progress-track"><div id="fill" class="progress-fill" style="width:12.5%"></div></div></div>
<div class="guide-scene guide-common-mascot-row"><div class="mascot guide-common-mascot" aria-hidden="true"><img id="guideMascotImage" src="./assets/mitochondria-chan.svg" width="85" height="128" alt=""><small>ミトコンドリアちゃん</small></div><div class="speech guide-common-speech" id="speech" aria-live="polite"></div></div>
<section class="guide-content" id="content" aria-live="polite"></section>
<div class="guide-choices guide-common-choices" id="choices"></div>
<div class="guide-controls"><button type="button" id="prev">← 前の手順に戻る</button><button type="button" id="reset">最初から見る</button></div>
<footer class="guide-foot guide-common-footer"><p>このガイドはご提供いただいた公式会員マニュアル「会員登録の流れ（郵送での登録の場合）」に基づきます。実際のお手続きでは、概要書面・申請書の最新条件を優先してください。</p></footer>
</main>
<script>
(()=>{
const steps=[["概要書面の確認","まずは紹介者から必要書類を受け取り、説明を受けましょう。","<ul class=\"checklist\"><li>会員登録申請書</li><li>初回商品注文書 兼 定期購入申込書</li><li>概要書面（添付のお客さま控え5枚）</li></ul><div class=\"guide-note\">紹介者から概要書面の説明を受け、内容を確認してください。登録前に書面をよく読みましょう。</div>"],["初回注文の記入","申請書と初回注文書に必要事項を記入しましょう。","<ul class=\"checklist\"><li>会員登録申請書に必要事項を記入する</li><li>初回商品注文書 兼 定期購入申込書に注文内容を記入する</li><li>記入漏れや記載内容を確認する</li></ul><div class=\"guide-note\">書類に不備があると再提出が必要となり、登録処理が遅れる場合があります。</div>"],["商品代金の振込","書類を郵送する前に、初回商品代金を指定口座へ振り込みましょう。","<div class=\"guide-note\"><strong>商品代金</strong><p>サンテージュ OX-288の1点登録の場合、商品代金は<strong>17,800円（税込）</strong>です。<p class=\"guide-inline-link\"><a href=\"./guide-a-cost.html\">初回商品代金を確認する ↗</a></p>商品代金・配送手数料などの合計額は注文内容によって異なるため、必ず注文書で確認してください。</p><p>振込手数料はお客さま負担です。</p></div><div class=\"guide-note\"><strong>振込先① 三井住友銀行</strong><p>銀座支店／普通預金<br>口座番号：7608513</p><strong>振込先② ゆうちょ銀行</strong><p>口座番号：00190-9-261488（電信のみ）</p><p>口座名義：株式会社ニナファームジャポン</p></div><div class=\"guide-note\">振込後の<strong>振込明細書のコピー</strong>を、申請時に添付します。なくさないよう保管してください。</div>"],["申請書類の郵送","必要書類をそろえ、指定の封筒に入れて郵送しましょう。","<ul class=\"checklist\"><li>記入・捺印済みの会員登録申請書</li><li>記入済みの初回商品注文書 兼 定期購入申込書</li><li>振込明細書のコピー</li><li>25歳未満の方：本人確認書類のコピー</li><li>外国籍の方：在留カードまたは特別永住者証明書のコピー</li></ul><div class=\"guide-note\"><strong>郵送するときの確認</strong><p>書類は指定の封筒に入れて郵送してください。送付前に、書類の入れ忘れや記入漏れがないか確認しましょう。</p></div>"],["審査・登録","書類が到着すると、会社で審査と登録処理が行われます。","<div class=\"guide-note\">審査の結果、登録が承認されない場合があります。登録が承認されなかった場合は、振込金額が返金されます。</div>"],["商品・契約書面の受領","登録処理が完了すると、商品と契約書面が届きます。","<ul class=\"checklist\"><li>登録住所に商品が届いたか確認する</li><li>契約書面（契約内容を明らかにする書面）を確認する</li></ul><div class=\"guide-note\">登録完了後、<strong>1週間以内</strong>に商品と契約書面が届きます。</div>"],["クーリングオフ","契約書面を受け取ったら、クーリングオフの説明も確認しましょう。","<div class=\"guide-note\"><strong>20日間のクーリングオフ</strong><p>商品と契約書面を受け取ってから20日間は、使用の有無にかかわらず無条件で契約を解除できます。</p><p>手続きの詳細は、概要書面・契約書面に記載された条件を確認してください。</p></div>"],["登録後の確認・会員証","登録後の書類と、会員証の到着を確認しましょう。","<div class=\"guide-note\"><strong>会員証について</strong><p>会員証は商品とは別に郵送されます。届いたら内容を確認し、大切に保管してください。</p></div><div class=\"guide-note\">登録後の活動はご自身の目的に合わせて進められます。ビジネス活動を行う場合は、概要書面の注意事項を確認し、会員証を携帯してください。</div>"]];
const $=id=>document.getElementById(id),checked={};let index=0;
function scrollToProgress(){const el=document.querySelector(".guide-progress");window.scrollTo({top:Math.max(0,window.scrollY+el.getBoundingClientRect().top-24),behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth"})}
function render(){const [stage,say,html]=steps[index];$("stage").textContent=stage;$("count").textContent=(index+1)+" / "+steps.length;$("fill").style.width=((index+1)/steps.length*100)+"%";$("speech").textContent=say;$("guideMascotImage").src=index===steps.length-1?"./assets/mitochondria/05_happy.svg":"./assets/mitochondria-chan.svg";$("content").innerHTML=html;document.querySelectorAll("#content .checklist li").forEach((li,i)=>{const label=document.createElement("label");label.className="check-item";const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!checked[index+":"+i];cb.addEventListener("change",()=>{checked[index+":"+i]=cb.checked;li.classList.toggle("is-checked",cb.checked)});while(li.firstChild)label.append(li.firstChild);label.prepend(cb);li.append(label);li.classList.toggle("is-checked",cb.checked)});$("choices").replaceChildren();const b=document.createElement("button");b.className="guide-common-choice";b.type="button";b.textContent=index===steps.length-1?"最初から確認する":"次へ進む";b.addEventListener("click",()=>{index=index===steps.length-1?0:index+1;render();scrollToProgress()});$("choices").append(b);$("prev").disabled=index===0}
$("prev").addEventListener("click",()=>{if(index>0){index--;render();scrollToProgress()}});$("reset").addEventListener("click",()=>{index=0;Object.keys(checked).forEach(k=>delete checked[k]);render();scrollToProgress()});render();
})();
</script><script src="./guide-shared-chrome.js?v=20261026-1" defer></script>
</body></html>
