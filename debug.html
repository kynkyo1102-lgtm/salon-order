<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プラッス ドゥ ニナ 南熊本店 - デバッグ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #fdfbf7; }
    .card { background: #fff; border: 1px solid #ddd; padding: 20px; max-width: 400px; margin: 40px auto; border-radius: 8px; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; margin-top: 5px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
    <h3>動作テスト用画面</h3>
    <input type="email" id="mail" placeholder="メールアドレス" value="kyn.kyo1102@gmail.com">
    <input type="password" id="pass" placeholder="パスワード（6文字以上）">
    
    <!-- JavaScriptの関数を直接叩く最も確実な方法 -->
    <button type="button" onclick="testSignUp()" style="background: #5a4a42; color: #fff;">新規登録テスト</button>
  </div>

  <script>
    // Supabase初期化
    const SUPABASE_URL = 'https://foeyyrbftaiscxijgvjv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7IVQaL-0ptbvQ_DSmK9BTQ_fEajO01E';
    
    let sb = null;
    try {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      console.log("Supabaseクライアント生成OK");
    } catch (e) {
      alert("初期化エラー: " + e.message);
    }

    async function testSignUp() {
      // 1. ボタンが押されたら絶対に一番最初にここを通る
      alert('「新規登録テスト」ボタンがクリックされました！');

      const email = document.getElementById('mail').value.trim();
      const password = document.getElementById('pass').value.trim();

      if (!email || !password) {
        alert('メールまたはパスワードが空です');
        return;
      }

      if (!sb) {
        alert('Supabaseが準備できていません');
        return;
      }

      alert('Supabaseへ通信を開始します...');

      try {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) {
          alert('Supabaseエラー: ' + error.message);
        } else {
          alert('通信成功！登録データが返されました');
          console.log(data);
        }
      } catch (err) {
        alert('JavaScript例外エラー: ' + err.message);
      }
    }
  </script>

</body>
</html>
