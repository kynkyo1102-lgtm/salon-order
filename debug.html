<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プラッス ドゥ ニナ 南熊本店 - デバッグ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Supabase JSライブラリの読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: 'Noto Sans JP', sans-serif; background: #fdfbf7; padding: 20px; color: #333; }
    .auth-card { background: #ffffff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; max-width: 400px; margin: 40px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .auth-title { font-weight: bold; font-size: 1rem; color: #5a4a42; margin-bottom: 10px; }
    .auth-input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .auth-btn-group { display: flex; gap: 10px; }
    button { flex: 1; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #loginBtn { background-color: #5a4a42; color: #fff; border: none; }
    #signupBtn { background-color: #fff; color: #5a4a42; border: 1px solid #5a4a42; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div id="authLoggedOut">
      <div class="auth-title">🔐 メンバーログイン / 会員登録 (デバッグ版)</div>
      <div class="auth-form">
        <input type="email" id="authEmail" class="auth-input" placeholder="メールアドレス">
        <input type="password" id="authPassword" class="auth-input" placeholder="パスワード（6文字以上）">
        <div class="auth-btn-group">
          <button type="button" id="loginBtn">ログイン</button>
          <button type="button" id="signupBtn">新規登録</button>
        </div>
      </div>
    </div>
    <div id="authLoggedIn" style="display: none;">
      <div class="auth-title">👤 ログイン中</div>
      <div id="userEmailDisplay" style="margin-bottom: 10px;"></div>
      <button type="button" id="logoutBtn" style="width: 100%;">ログアウト</button>
    </div>
  </div>

  <script>
    // 即時実行でSupabaseが正しく読み込めているかチェック
    let supabase = null;
    try {
      const SUPABASE_URL = 'https://foeyyrbftaiscxijgvjv.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_7IVQaL-0ptbvQ_DSmK9BTQ_fEajO01E';
      
      if (window.supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        console.log("Supabase 正常初期化");
      } else {
        alert("エラー: Supabaseライブラリが読み込まれていません。");
      }
    } catch (e) {
      alert("初期化エラー: " + e.message);
    }

    // DOMの読み込みが完了してからイベントを登録する
    document.addEventListener('DOMContentLoaded', () => {
      const loginBtn = document.getElementById('loginBtn');
      const signupBtn = document.getElementById('signupBtn');
      const logoutBtn = document.getElementById('logoutBtn');

      // 新規登録ボタンのクリックイベント
      if (signupBtn) {
        signupBtn.addEventListener('click', async () => {
          const email = document.getElementById('authEmail').value.trim();
          const password = document.getElementById('authPassword').value.trim();

          if (!email || !password) {
            alert('メールアドレスとパスワードを入力してください。');
            return;
          }
          if (password.length < 6) {
            alert('パスワードは6文字以上で入力してください。');
            return;
          }

          if (!supabase) {
            alert('Supabaseが初期化されていません。');
            return;
          }

          try {
            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) {
              alert('登録エラー: ' + error.message);
            } else {
              alert('新規登録リクエストを送信しました！メールをご確認ください。');
            }
          } catch (err) {
            alert('通信エラー: ' + err.message);
          }
        });
      }

      // ログインボタンのクリックイベント
      if (loginBtn) {
        loginBtn.addEventListener('click', async () => {
          const email = document.getElementById('authEmail').value.trim();
          const password = document.getElementById('authPassword').value.trim();

          if (!email || !password) {
            alert('メールアドレスとパスワードを入力してください。');
            return;
          }

          if (!supabase) {
            alert('Supabaseが初期化されていません。');
            return;
          }

          try {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
              alert('ログインエラー: ' + error.message);
            } else {
              alert('ログインしました！');
              location.reload();
            }
          } catch (err) {
            alert('通信エラー: ' + err.message);
          }
        });
      }

      if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
          if (supabase) {
            await supabase.auth.signOut();
            alert('ログアウトしました。');
            location.reload();
          }
        });
      }
    });
  </script>
</body>
</html>
