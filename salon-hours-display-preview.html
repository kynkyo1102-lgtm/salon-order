<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>営業状況 表示プレビュー｜Place de Nina</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6f9;color:#29465b;font-family:system-ui,"Noto Sans JP",sans-serif}.wrap{max-width:620px;margin:auto;padding:24px 16px}h1{font-size:22px;margin:5px 0}p{line-height:1.7;color:#617b8c}.card{background:white;border:1px solid #dce7ef;border-radius:20px;padding:20px;margin:18px 0;box-shadow:0 6px 24px #294d6610}.eyebrow{font-size:11px;letter-spacing:.15em;color:#7891a2;font-weight:700}label{display:block;font-size:12px;font-weight:700;margin:12px 0 6px}select,input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid #cad9e3;background:white;color:#29465b}.status{background:linear-gradient(150deg,#f7fbfe,#eaf3f9);border:1px solid #d8e7f1;border-radius:17px;padding:22px;margin-top:18px}.status h2{font-size:20px;margin:9px 0}.status p{margin:5px 0;font-size:13px}.notice{border-top:1px solid #d2e2ed;margin-top:14px;padding-top:12px;font-size:13px;font-weight:600}.note{font-size:12px}a{color:#296e9d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:390px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="eyebrow">PLACE DE NINA · PREVIEW</div><h1>営業状況の表示プレビュー</h1><p>年末年始・GW・お盆・特別営業の表示例です。ここでの操作は本番に反映されません。</p><div class="card"><label for="case">表示シーン</label><select id="case"><option value="advance">年末年始休業の事前案内</option><option value="holiday">年末年始休業の当日</option><option value="gw">GW休業の当日</option><option value="obon">お盆休業の当日</option><option value="regular">通常の定休日</option><option value="special">土曜日の特別営業</option><option value="short">短縮営業</option></select><div class="grid"><div><label for="clock">確認時刻</label><input type="time" id="clock" value="12:00"></div><div><label for="advanceDays">事前案内の開始</label><select id="advanceDays"><option value="7">7日前から</option><option value="3">3日前から</option><option value="14">14日前から</option></select></div></div><div class="status" aria-live="polite"><div class="eyebrow">PLACE DE NINA · 営業状況</div><h2 id="title"></h2><p id="detail"></p><div class="notice" id="notice"></div><p style="font-size:11px;margin-top:12px">LINEのお問い合わせはいつでも受付中</p></div></div><p class="note">※日付と営業時間は表示確認用の例です。実際の設定は管理画面から登録します。次回営業日は曜日・祝日・例外設定を考慮して計算する想定です。</p><p><a href="salon-hours-editor.html">営業設定ツールを開く</a>　·　<a href="index.html">本番トップを見る</a></p></div><script>(()=>{const $=id=>document.getElementById(id);function render(){const mode=$('case').value,t=$('clock').value;let title='',detail='',notice='';if(mode==='advance'){title=t>='11:00'&&t<'17:00'?'ただいま営業中（予定）':t<'11:00'?'ただいま営業時間外':'本日のサロン営業は終了しました';detail='営業時間 11:00〜17:00';notice='📅 年末年始休業のお知らせ：12月30日〜1月3日はお休みします（'+$('advanceDays').value+'日前から表示）'}else if(mode==='holiday'){title='本日は年末年始休業です';detail='12月30日〜1月3日までお休みします';notice='次回営業日：1月4日 11:00〜（表示例）'}else if(mode==='gw'){title='本日はGW休業です';detail='5月3日〜5月6日までお休みします';notice='次回営業日：5月7日 11:00〜（表示例）'}else if(mode==='obon'){title='本日はお盆休業です';detail='8月13日〜8月16日までお休みします';notice='次回営業日：8月17日 11:00〜（表示例）'}else if(mode==='regular'){title='本日は定休日です';detail='水・土・日は基本お休み';notice='次回営業日：月曜日 11:00〜（表示例）'}else{const start='11:00',end=mode==='short'?'15:00':'17:00';title=t>=start&&t<end?'ただいま営業中（予定）':t<start?'ただいま営業時間外':'本日のサロン営業は終了しました';detail='営業時間 '+start+'〜'+end;notice=mode==='special'?'本日は特別営業日です':'本日は短縮営業です'}$('title').textContent=title;$('detail').textContent=detail;$('notice').textContent=notice}['case','clock','advanceDays'].forEach(id=>$(id).addEventListener('change',render));render()})();</script></body></html>
