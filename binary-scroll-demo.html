<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バイナリー組織図・スクロール体験デモ</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f3;font-family:system-ui,sans-serif;color:#253b36}.intro,.outro{min-height:75vh;display:grid;place-content:center;text-align:center;padding:28px}.intro h1{font-size:clamp(28px,6vw,52px);margin:0 0 16px}.intro p,.outro p{line-height:1.9}.track{height:440vh;position:relative}.sticky{position:sticky;top:0;height:100dvh;overflow:hidden;background:linear-gradient(155deg,#e4f2e8,#f5f8ef 58%,#e7f1fc)}.stage{position:absolute;inset:0;overflow:hidden}.world{position:absolute;left:50%;top:49%;width:1000px;height:800px;transform-origin:500px 260px;will-change:transform}.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.edges path{stroke:#76a89a;stroke-width:4;fill:none;stroke-linecap:round}.node{position:absolute;width:88px;height:88px;border-radius:50%;display:grid;place-content:center;text-align:center;background:white;border:4px solid #7db4aa;box-shadow:0 12px 30px #234a3b20;transform:translate(-50%,-50%);opacity:0;transition:opacity .35s}.node.direct{border-color:#ec9b59}.node b{font-size:25px}.node small{font-size:10px}.node.active{opacity:1}.hud{position:absolute;top:24px;left:22px;right:22px;display:flex;justify-content:space-between;gap:12px}.tag{background:#ffffffd9;border:1px solid white;border-radius:30px;padding:9px 15px;font-weight:700;font-size:13px}.caption{position:absolute;bottom:32px;left:20px;right:20px;margin:auto;max-width:570px;background:#fffffff0;border-radius:18px;padding:20px 24px;box-shadow:0 12px 35px #2a574520}.caption h2{font-size:22px;margin:0 0 7px}.caption p{font-size:14px;line-height:1.7;margin:0}.progress{position:absolute;left:0;top:0;height:5px;background:#66a996;width:0}.hint{position:absolute;top:70px;left:24px;font-size:12px;color:#50685f}</style><section class="intro"><h1>組織が育つ様子を、たどる。</h1><p>下へスクロールすると、組織図が左右へ広がります。<br>画面は自動的に動き、最後に全体像が見えます。</p><div>↓ スクロールして体験</div></section><section class="track" id="track"><div class="sticky"><div class="stage"><div class="world" id="world"><svg class="edges" viewBox="0 0 1000 800"><path id="e1" d="M500 140 L290 330"/><path id="e2" d="M500 140 L710 330"/><path id="e3" d="M290 330 L140 540"/><path id="e4" d="M290 330 L410 540"/><path id="e5" d="M710 330 L590 540"/><path id="e6" d="M710 330 L860 540"/></svg><div class="node active" id="n0" style="left:500px;top:140px"><b>00</b><small>あなた</small></div><div class="node direct" id="n1" style="left:290px;top:330px"><b>01</b><small>直紹介</small></div><div class="node direct" id="n2" style="left:710px;top:330px"><b>02</b><small>直紹介</small></div><div class="node" id="n3" style="left:140px;top:540px"><b>03</b><small>左組織</small></div><div class="node" id="n4" style="left:410px;top:540px"><b>04</b><small>左組織</small></div><div class="node" id="n5" style="left:590px;top:540px"><b>05</b><small>右組織</small></div><div class="node" id="n6" style="left:860px;top:540px"><b>06</b><small>右組織</small></div></div></div><div class="progress" id="progress"></div><div class="hud"><div class="tag">バイナリー組織の成長</div><div class="tag" id="step">01 / 04</div></div><div class="hint">↓ スクロールで進む・戻る</div><div class="caption"><h2 id="heading">まずは、自分から。</h2><p id="desc">画面中央の00がスタート地点です。</p></div></div></section><section class="outro"><h2>これが体験型の組織図。</h2><p>横方向に視点が動くけれど、操作はいつもの縦スクロールだけ。<br>これは動きの確認用デモで、ポイントや報酬の計算は含みません。</p><a href="#track">もう一度見る ↑</a></section><script>const track=document.querySelector('#track'),world=document.querySelector('#world'),progress=document.querySelector('#progress'),step=document.querySelector('#step'),heading=document.querySelector('#heading'),desc=document.querySelector('#desc');const scenes=[{at:0,x:0,y:90,s:.85,h:'まずは、自分から。',d:'画面中央の00がスタート地点です。'},{at:.28,x:145,y:-40,s:.9,h:'左の組織が広がる。',d:'01から下のメンバーへ。視点が左側に移動します。'},{at:.56,x:-145,y:-40,s:.9,h:'右の組織も広がる。',d:'今度は右側へ。上下だけでなく、左右にも視点が移動します。'},{at:.85,x:0,y:-40,s:.54,h:'最後に全体を見渡す。',d:'視点が引いて、左右の組織がひとつの図になります。'}];function lerp(a,b,t){return a+(b-a)*t}function render(){const r=track.getBoundingClientRect(),range=track.offsetHeight-innerHeight,p=Math.max(0,Math.min(1,-r.top/Math.max(1,range)));let i=0;while(i<scenes.length-2&&p>scenes[i+1].at)i++;const a=scenes[i],b=scenes[Math.min(i+1,3)],t=Math.max(0,Math.min(1,(p-a.at)/(b.at-a.at||1))),ease=t*t*(3-2*t);world.style.transform='translate(calc(-50% + '+lerp(a.x,b.x,ease)+'px),calc(-30% + '+lerp(a.y,b.y,ease)+'px)) scale('+lerp(a.s,b.s,ease)+')';let visible=p<.13?1:p<.36?3:p<.65?5:7;for(let n=0;n<7;n++)document.querySelector('#n'+n).classList.toggle('active',n<visible);for(let n=1;n<=6;n++)document.querySelector('#e'+n).style.opacity=n<visible?'1':'0';let k=p<.2?0:p<.48?1:p<.75?2:3;step.textContent='0'+(k+1)+' / 04';heading.textContent=scenes[k].h;desc.textContent=scenes[k].d;progress.style.width=p*100+'%'}addEventListener('scroll',render,{passive:true});addEventListener('resize',render);render();</script></html>
