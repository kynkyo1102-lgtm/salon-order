<main class="guide-common-page deadline-page">
<h1 class="guide-common-title">締め日について</h1>
<p class="page-intro">定期購入の内容変更や停止をする場合は、各月の締め日までに手続きを完了する必要があります。</p>
<section class="deadline-section" aria-labelledby="deadline-title">
<h2 id="deadline-title">変更・停止の締切</h2>
<div class="deadline-highlight">
<span class="deadline-eyebrow">毎月の締め日</span>
<p class="deadline-date">10日<span>必着</span></p>
<p class="deadline-subtext">E-Serviceまたは書面にて手続きを行ってください。</p>
</div>
</section>
<section class="deadline-section" aria-labelledby="reflect-title">
<h2 id="reflect-title">変更が反映されるタイミング</h2>
<p>10日までに手続きが完了した場合は、<strong>翌月発送分から反映</strong>されます。</p>
<details class="deadline-alert"><summary>10日を過ぎた場合</summary><div class="deadline-alert-body">10日を経過した後は、翌月分の発送・引き落としを止めることは一切できません。<p>10日を過ぎての申請は、<strong>翌々月からの反映</strong>となりますので十分ご注意ください。</p></div></details>
</section>
<p class="manual-ref">メンバーズマニュアル1P参照</p>
