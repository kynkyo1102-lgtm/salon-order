<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プラッス ドゥ ニナ 南熊本店</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --wood-dark: #231610;
      --wood-medium: #4a3222;
      --accent-gold: #c8a261;
      --gold-light: #e6cb96;
      --bg-color: #f7f4ee;
      --card-bg: #ffffff;
      --text-main: #2b2019;
      --text-sub: #78695f;
      --border-color: #e5dac9;
      --font-serif: 'Noto Serif JP', "Yu Mincho", serif;
      --font-script: 'Great Vibes', cursive;
      
      /* SNS Brand Colors */
      --line-green: #06c755;
      --insta-pink: #e1306c;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-serif);
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ヘッダー */
    header {
      background: linear-gradient(180deg, #1b100a 0%, var(--wood-dark) 100%);
      color: #ffffff;
      padding: 32px 20px 24px;
      text-align: center;
      border-bottom: 3px solid var(--accent-gold);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      position: relative;
    }

    header::after {
      content: "";
      position: absolute;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 1px solid rgba(200, 162, 97, 0.3);
      border-radius: 4px;
      pointer-events: none;
    }

    .header-logo {
      font-family: var(--font-script);
      font-size: 2.2rem;
      color: var(--gold-light);
      line-height: 1;
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: 0.12em;
    }

    main {
      flex: 1;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px;
      box-sizing: border-box;
    }

    /* 8/7●● 日付形式のお知らせ */
    .news-box {
      background-color: #fffdf9;
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-gold);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 24px;
      font-size: 0.85rem;
      line-height: 1.5;
      box-shadow: 0 2px 8px rgba(35, 22, 16, 0.04);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .news-date {
      font-weight: 600;
      color: var(--wood-medium);
      white-space: nowrap;
    }

    .news-text {
      color: var(--text-main);
      margin: 0;
    }

    /* ツールセクションの見出し */
    .section-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--wood-medium);
      margin: 20px 0 12px 4px;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border-color), transparent);
    }

    /* LINE送信用注釈ガイド */
    .usage-guide {
      font-size: 0.78rem;
      color: var(--text-sub);
      background-color: rgba(200, 162, 97, 0.1);
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    /* メニューカード */
    .menu-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(35, 22, 16, 0.06);
      border: 1px solid var(--border-color);
      transition: all 0.25s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .menu-card:active {
      transform: translateY(2px);
      box-shadow: 0 2px 6px rgba(35, 22, 16, 0.04);
    }

    .card-icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #fbf7ef, #ebd8ba);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--wood-dark);
      border: 1px solid var(--accent-gold);
      box-shadow: inset 0 1px 3px rgba(255,255,255,0.8);
    }

    .card-content {
      flex: 1;
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-main);
      letter-spacing: 0.04em;
    }

    .card-title::after {
      content: "›";
      font-size: 1.3rem;
      color: var(--accent-gold);
    }

    .card-desc {
      font-size: 0.78rem;
      color: var(--text-sub);
      line-height: 1.45;
      margin: 0;
    }

    /* 店舗情報・SNS（最下部エリア） */
    .sub-info-area {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px dashed var(--border-color);
    }

    .sub-info-title {
      font-size: 0.78rem;
      color: var(--text-sub);
      text-align: center;
      margin-bottom: 14px;
    }

    /* SNSボタンエリア */
    .sns-links {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .sns-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: opacity 0.2s;
    }

    .sns-btn:active {
      opacity: 0.8;
    }

    .sns-btn.line {
      background-color: var(--line-green);
      color: #ffffff;
    }

    .sns-btn.insta {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #ffffff;
    }

    /* 店舗・振込先リンク */
    .sub-info-links {
      display: flex;
      gap: 10px;
    }

    .sub-link-btn {
      flex: 1;
      background-color: rgba(255,255,255,0.7);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 8px;
      text-align: center;
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    footer {
      text-align: center;
      padding: 24px 15px;
      font-size: 0.7rem;
      color: var(--text-sub);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-logo">Place de Nina</div>
    <h1>プラッス ドゥ ニナ 南熊本店</h1>
  </header>

  <main>

    <!-- 8/7●● 日付形式のお知らせ -->
    <div class="news-box">

    </div>

    <!-- 注文ツールセクション -->
    <div class="section-title">LINEご注文作成ツール</div>

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>

        <div class="card-title">注文書作成 画像保存用</div>
        <p class="card-desc">注文書を発行し、画像で控えを保存できます。</p>

    <!-- 店舗情報・SNSリンク（最下部） -->
    <div class="sub-info-area">
      <div class="sub-info-title">公式SNS・インフォメーション</div>
      
      <!-- SNSボタン -->
      <div class="sns-links">
        <a href="https://line.me/ti/p/7iG8fg4ykI" target="_blank" rel="noopener noreferrer" class="sns-btn line">

          公式LINE
        </a>
        <a href="https://www.instagram.com/kumamoto5527?igsh=MXBwZ3ljeHFnb29oNg==" target="_blank" rel="noopener noreferrer" class="sns-btn insta">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
          Instagram
        </a>
      </div>

      <!-- 店舗案内・振込先 -->
      <div class="sub-info-links">
        <a href="info.html" class="sub-link-btn">
          <span>📍</span> 店舗案内・営業時間
        </a>
        <a href="bank.html" class="sub-link-btn">
          <span>💳</span> お振込先のご案内
        </a>
      </div>
    </div>

  </main>

  <footer>
    &copy; PLACE DE NINA MINAMIKUMAMOTO
  </footer>

</body>
</html>
