<h1 class="guide-common-title">組織の配置について</h1><p class="page-intro">紹介した人が、どこに配置されるか。2つの方法を図で見てみましょう。</p><nav class="guide-section-nav" aria-label="このページの目次"><a href="#automatic-placement">自動による配置</a><a href="#specified-placement">上位者指定による配置</a></nav>
<section class="placement-section guide-section" id="automatic-placement"><h2>自動による配置</h2><p><strong>左右の人数が少ない側へ自動で配置。</strong><br>同じ人数なら左側が優先されます。</p>
