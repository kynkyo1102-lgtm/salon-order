<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>章の切り替え｜独立プレビュー</title><style>
:root{--blue:#0055a4;--green:#16815b;--ink:#253d4f;--line:#8eb4c6}*{box-sizing:border-box}html{overflow-x:clip}body{margin:0;background:#fff;color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;overflow-x:clip}.demo{max-width:860px;padding:32px 17px 100px;margin:auto}.preview-note{font-size:12px;color:#657b88;border-bottom:1px solid #e4edf1;padding:0 0 18px;margin-bottom:38px}.transition{position:relative;isolation:isolate}.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1;pointer-events:none}.path path{fill:none;stroke:var(--line);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.content{position:relative;z-index:2}.previous{min-height:280px;display:flex;gap:16px;align-items:flex-start;padding:15px 14px}.marker{width:54px;height:54px;flex:none;display:grid;place-items:center;border:3px solid var(--green);border-radius:17px;background:#fff;color:var(--green);font-size:21px;font-weight:800;transform:rotate(-5deg)}.previous h3,.next h3{margin:4px 0 10px;font-size:clamp(21px,5vw,27px);color:var(--green)}.previous p,.next p{font-size:14px;line-height:1.9;margin:0}.chapter{position:relative;margin:0 12px;min-height:235px;display:grid;place-items:center;text-align:center;padding:38px 36px}.chapter-content{position:relative;z-index:2}.chapter-icon{width:68px;height:55px;margin:0 auto 12px;color:var(--green)}.chapter-icon svg{width:100%;height:100%}.chapter h2{font-size:clamp(24px,5.7vw,34px);color:var(--blue);line-height:1.5;margin:0 0 8px;word-break:keep-all}.chapter p{font-size:13px;color:#607586;line-height:1.8;margin:0;word-break:keep-all}.next{margin-top:95px;min-height:360px;padding:0 14px;display:flex;gap:16px;align-items:flex-start}.next .copy{padding-top:6px}.next .marker{border-color:var(--green)}.explain{margin-top:45px;padding:22px;border-radius:14px;background:#f5f8fa;font-size:13px;line-height:1.9;color:#536d7e}.explain strong{color:var(--blue)}@media(max-width:440px){.previous{min-height:250px}.chapter{margin:0 4px;padding:30px 25px;min-height:215px}.chapter h2{font-size:25px}.next{margin-top:75px}.demo{padding-left:17px;padding-right:17px}}@media(prefers-reduced-motion:reduce){.path path{transition:none!important}}
</style></head><body><main class="demo"><div class="preview-note">章の切り替え専用プレビュー｜本番のページには未反映</div><section class="transition" id="transition"><svg class="path" id="draw-layer" aria-hidden="true"><path id="route"></path></svg><div class="content previous"><div class="marker" id="from">05</div><div><h3>勧誘できない相手を確認</h3><p>相手の状況や判断力にも配慮してください。</p></div></div><div class="content chapter" id="chapter"><div class="chapter-content"><div class="chapter-icon" aria-hidden="true"><svg viewBox="0 0 100 70" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 23h45q9 0 9 9v17q0 9-9 9H38L25 68V58H12q-9 0-9-9V32q0-9 9-9Z"/><path d="M52 8h35q9 0 9 9v20q0 9-9 9h-9M15 38h36M15 47h24M63 22h22"/></svg></div><h2>伝え方を考える</h2><p>言葉・時間・SNSで気をつけること</p></div></div><div class="content next"><div class="marker" id="to">06</div><div class="copy"><h3>収入を誇張しない</h3><p>「必ず稼げる」といった説明はしません。</p></div></div></section><div class="explain"><strong>今回の設計</strong>：05の番号から伸びる一本の線が、章タイトルの領域を囲って、06の番号まで続きます。タイトルと線は同じ親要素を基準に位置を計算するため、画面幅が変わってもずれにくい構造です。章タイトルが画面に入ると、短いスクロール距離で線が一気につながります。</div></main><script>
(()=>{const host=document.querySelector('#transition'),svg=document.querySelector('#draw-layer'),path=document.querySelector('#route'),from=document.querySelector('#from'),to=document.querySelector('#to'),chapter=document.querySelector('#chapter');let length=1;
function measure(){const base=host.getBoundingClientRect(),a=from.getBoundingClientRect(),b=chapter.getBoundingClientRect(),c=to.getBoundingClientRect(),x=c.left+c.width/2-base.left,entry=a.bottom-base.top,top=b.top-base.top+12,right=b.right-base.left-12,bottom=b.bottom-base.top-12,exit=c.top-base.top+2,r=24;svg.setAttribute('viewBox',`0 0 ${base.width} ${base.height}`);svg.setAttribute('preserveAspectRatio','none');const d=[`M ${x} ${entry}`,`V ${top+r}`,`Q ${x} ${top} ${x+r} ${top}`,`H ${right-r}`,`Q ${right} ${top} ${right} ${top+r}`,`V ${bottom-r}`,`Q ${right} ${bottom} ${right-r} ${bottom}`,`H ${x+r}`,`Q ${x} ${bottom} ${x} ${bottom+r}`,`V ${exit}`].join(' ');path.setAttribute('d',d);length=path.getTotalLength();path.style.strokeDasharray=length;render()}
function render(){if(matchMedia('(prefers-reduced-motion: reduce)').matches){path.style.strokeDashoffset=0;return}const r=chapter.getBoundingClientRect(),start=innerHeight*.94,end=innerHeight*.57,progress=Math.max(0,Math.min(1,(start-r.top)/(start-end)));path.style.strokeDashoffset=length*(1-progress)}
let ticking=false;addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(()=>{render();ticking=false})}},{passive:true});addEventListener('resize',measure);document.fonts?.ready.then(measure);measure()})();
</script></body></html>
