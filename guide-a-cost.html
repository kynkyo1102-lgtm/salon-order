<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A. 初回費用 - メンバーズWebガイド</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./guide-shared-chrome.css?v=20261026-1">
  <link rel="stylesheet" href="./guide-design-system.css?v=20261028-2">
  <link rel="stylesheet" href="./guide-a-cost.css?v=20261028-3">
<link rel="stylesheet" href="./guide-section-layout.css?v=20261029-1"></head>

<body class="registration-guide cost-guide">

  


  <main class="cost-page guide-common-page">

    <h1 class="guide-common-title">初回費用</h1>
<nav class="guide-section-nav" aria-label="このページの目次"><a href="#registration-products">登録時の商品</a><a href="#registration-fees">かかる費用</a></nav>

    <!-- 登録時の商品 -->
    <div class="cost-section guide-section" id="registration-products">

      <h2 class="cost-section-title">
        登録時の商品
      </h2>

      <p class="section-desc">
        初回登録時の商品はOX-288です。
      </p>


      <div class="product-list">

        <div class="product-item">

          <div class="product-info">
            <div class="product-type">1点登録</div>
            <div class="product-detail">OX-288を1個</div>
          </div>

        </div>


        <div class="product-item">

          <div class="product-info">
            <div class="product-type">3点登録</div>
            <div class="product-detail">OX-288を3個</div>
          </div>

        </div>

      </div>

    </div>


    <!-- かかる費用 -->
    <div class="cost-section guide-section" id="registration-fees">

      <h2 class="cost-section-title">
        かかる費用
      </h2>

      <p class="section-desc">
        会員登録料は無料ですが、登録時には商品代金と配送手数料が必要です。
      </p>


      <div class="cost-list">

        <!-- 会員登録料 -->
        <div class="cost-item">

          <div class="cost-item-title">
            会員登録料
          </div>

          <div class="cost-detail">
            <span class="free-price">
              0円（無料）
            </span>
          </div>

        </div>


        <!-- 1点登録 -->
        <div class="cost-item">

          <div class="cost-item-title">
            1点登録
          </div>

          <div class="cost-detail">

            <div class="cost-row">
              <span>商品代金</span>
              <span class="cost-price">￥16,800</span>
            </div>

            <div class="cost-row">
              <span>配送手数料</span>
              <span class="cost-price">￥1,000</span>
            </div>

            <div class="cost-total">
              <span class="cost-total-label">合計</span>
              <span class="cost-total-price">￥17,800</span>
            </div>

          </div>

        </div>


        <!-- 3点登録 -->
        <div class="cost-item">

          <div class="cost-item-title">
            3点登録
          </div>

          <div class="cost-detail">

            <div class="cost-row">
              <span>商品代金</span>
              <span class="cost-price">￥50,400</span>
            </div>

            <div class="cost-row">
              <span>配送手数料</span>
              <span class="cost-price">￥1,000</span>
            </div>

            <div class="cost-total">
              <span class="cost-total-label">合計</span>
              <span class="cost-total-price">￥51,400</span>
            </div>

          </div>

        </div>


        <!-- 2ヶ月目以降 -->
        <div class="cost-item">

          <div class="cost-item-title">
            2ヶ月目以降（追加・定期）
          </div>

          <div class="cost-detail">

            <div class="cost-total">
              <span class="cost-total-label">
                OX-288 1個あたり
              </span>

              <span class="cost-total-price">
                ￥13,800
              </span>
            </div>

            <span class="cost-subtext">
              会員価格・送料別
            </span>

          </div>

        </div>

      </div>

    </div>


    <div class="manual-ref">
      費用については、最新の公式資料・概要書面もあわせてご確認ください。
    </div>

  </main>

<script src="./guide-shared-chrome.js?v=20261026-1" defer></script></body>
</html>
