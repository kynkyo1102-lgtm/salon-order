<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ミトコンドリアちゃんと進めるWEB登録｜メンバーズガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./guide-shared-chrome.css?v=20261026-1">
<link rel="stylesheet" href="./guide-design-system.css?v=20261027-1">
<link rel="stylesheet" href="./guide-a-web-flow.css?v=20261027-1">
</head><body class="registration-guide">
<main class="web-guide">
<h1>WEB登録ガイド</h1>
<p class="intro">ミトコンドリアちゃんと一緒に、WEB登録の手続きを順番に確認しましょう。</p>
<div class="guide-progress" aria-label="ガイドの進行状況"><div class="progress-top"><span id="stage">登録前の準備</span><span class="progress-count" id="count" aria-live="polite">1 / 9</span></div><div class="progress-track"><div id="fill" class="progress-fill" style="width:11.11%"></div></div></div>
<div class="guide-scene"><div class="mascot" aria-hidden="true"><img src="./assets/mitochondria-chan.svg" width="85" height="128" alt=""><small>ミトコンドリアちゃん</small></div><div class="speech" id="speech" aria-live="polite"></div></div>
<section class="guide-content" id="content" aria-live="polite"></section>
<div class="guide-choices" id="choices"></div>
<div class="guide-controls"><button type="button" id="prev">← 前の手順に戻る</button><button type="button" id="reset">最初から見る</button></div>
<footer class="guide-foot"><a href="./guide-a-registration-steps.html#web">WEB登録の手順を一覧で確認する ↗</a><p>実際のお手続きでは、お手元の概要書面・公式の最新条件をご確認ください。</p></footer>
</main>
<script>
(()=>{
const steps=[
{stage:"登録前の準備",say:"まずは、登録前の準備から始めましょう。紹介者の方から概要書面を受け取って、内容の説明を受けてくださいね。",title:"概要書面と必要なものを準備",html:`<p>WEB登録を始める前に、次のものを用意しましょう。</p><ul><li>会員登録申請書に添付されている概要書面</li><li>決済用のクレジットカード</li><li>銀行またはゆうちょ銀行の口座情報</li><li>メールを受信できるスマートフォンやパソコン</li></ul><div class="guide-note"><strong>メールの受信設定</strong><p><code>signup@santeage.com</code> からのメールを受信できるようにしてください。</p></div><div class="guide-note"><strong>該当する方のみ</strong><ul><li>25歳未満の方：本人確認書類の写真データ</li><li>外国籍の方：在留カードまたは特別永住者証明書の写真データ</li></ul><p>WEB登録は個人の方が対象です。法人の方は郵送登録をご確認ください。</p></div>`},
{stage:"WEB登録の開始",say:"準備ができたら、公式のWEB登録受付ページを開きましょう。別の画面が開くので、こちらのガイドに戻りながら進められますよ。",title:"WEB登録受付ページを開く",html:`<p>下のボタンから登録受付ページにアクセスしてください。</p><a class="guide-action" href="https://sslgw.jns-asp.jp/685/" target="_blank" rel="noopener noreferrer">公式WEB登録受付ページを開く ↗</a><div class="guide-note">登録受付ページでは「オンラインで会員登録される方はこちら」を選択してください。</div>`},
{stage:"メール認証",say:"次はメールアドレスの確認です。普段確認できるメールアドレスを入力してくださいね。",title:"メールアドレスを送信する",html:`<p>受付ページにご自身のメールアドレスを入力して、「送信する」を押してください。</p><div class="guide-note">届かない場合は、迷惑メールフォルダや <code>signup@santeage.com</code> の受信設定を確認してください。</div>`},
{stage:"メール認証",say:"メールが届いたら、本文にあるURLを開いてください。そこから登録情報の入力へ進みます。",title:"メールに届いたURLを開く",html:`<p>受信した案内メールに記載されたURLから、登録画面へ進んでください。</p><div class="guide-note">メール本文のURLは、ご自身に届いたものを使用してください。</div>`},
{stage:"登録情報の入力",say:"ここから必要事項を入力します。概要書面や紹介者の情報を手元に置いて、画面の順番に進めてくださいね。",title:"規約・番号・個人情報を入力",html:`<p>登録画面の案内に沿って、以下の項目を確認・入力してください。</p><ol><li>規約等への同意</li><li>概要書面番号・会員番号</li><li>紹介者・上位者の情報</li><li>氏名などの個人情報</li></ol><div class="guide-note">番号や氏名は、手元の書面と照らし合わせて確認しましょう。</div>`},
{stage:"商品・決済",say:"次は初回の登録内容とお支払いです。選んだ内容を確認してから決済に進みましょう。",title:"初回登録内容を選んで決済する",html:`<ol><li>初回登録ポジションを選択</li><li>必要に応じて追加商品を選択</li><li>定期購入の内容を確認</li><li>クレジットカード決済を行う</li></ol><div class="guide-note">決済前に、商品・金額・定期購入の内容をよく確認してください。</div>`},
{stage:"受付完了",say:"ここまでで申請の受付です。受付完了メールが届いているか確認してくださいね。",title:"受付完了メールを確認する",html:`<p>受付完了メールが届いたら、内容を確認してください。</p><div class="guide-note"><strong>必要書類の提出がある方</strong><p>25歳未満の方、外国籍の方は、案内に従って本人確認書類などの写真データを添付して送信してください。</p></div>`},
{stage:"登録審査",say:"申請後はニナファームジャポンで審査と登録処理が行われます。結果を待ちましょう。",title:"審査・登録処理",html:`<p>ニナファームジャポンが会員登録申請を審査し、登録処理を行います。</p><div class="guide-note">審査の結果、登録をお断りする場合があります。</div>`},
{stage:"登録後の流れ",say:"登録処理が完了すると、商品と契約書面が届きます。最後に契約内容を確認してくださいね。",title:"商品・契約書面の到着",html:`<p>登録処理完了後、1週間以内に登録住所へ商品と契約書面が届く案内になっています。</p><div class="guide-note"><strong>クーリングオフについて</strong><p>商品および契約書面を受け取ってからの20日間については、概要書面・契約書面に記載された条件を必ずご確認ください。</p></div><p>これでWEB登録の流れの確認は終了です。</p><a class="guide-action" href="./guide-a-registration-steps.html#web">手順一覧を確認する →</a>`}
];
let index=0;const $=id=>document.getElementById(id);
function render(){const s=steps[index];$("stage").textContent=s.stage;$("count").textContent=(index+1)+" / "+steps.length;$("fill").style.width=((index+1)/steps.length*100)+"%";$("speech").textContent=s.say;$("content").innerHTML="<h2>"+s.title+"</h2>"+s.html;$("choices").replaceChildren();const b=document.createElement("button");b.type="button";b.textContent=index===steps.length-1?"最初から確認する":"確認したら、次へ進む";b.addEventListener("click",()=>{index=index===steps.length-1?0:index+1;render();window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth"})});$("choices").append(b);$("prev").disabled=index===0}
$("prev").addEventListener("click",()=>{if(index>0){index--;render()}});$("reset").addEventListener("click",()=>{index=0;render()});render();
})();
</script>
<script src="./guide-shared-chrome.js?v=20261026-1" defer></script>
</body></html>
