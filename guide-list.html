<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123b78">
  <title>記事を探す - ニナファームジャポン メンバーズWebガイド</title>
  <link rel="stylesheet" href="./common.css?v=20261023-nav3">
  <style>
    .guide-list-page { background:#fff; }
    .guide-list-wrap { max-width:1000px; margin:0 auto; padding:28px 20px 48px; }
    .guide-list-head { padding:24px; border-radius:18px; background:#f4f8fd; margin-bottom:24px; }
    .guide-list-head h1 { margin:0 0 8px; color:#123778; font-size:1.8rem; }
    .guide-list-head p { margin:0; color:#46556b; line-height:1.7; }
    .guide-list-tools { margin:20px 0 24px; }
    .guide-list-tools label { display:block; margin-bottom:8px; font-weight:800; color:#123778; }
    .guide-list-tools input { width:100%; min-height:50px; padding:10px 14px; border:2px solid #b9cfe9; border-radius:12px; font:inherit; }
    .guide-list-keywords { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 22px; }
    .guide-tag { display:inline-flex; align-items:center; padding:7px 12px; border:1px solid #cdddf0; border-radius:999px; background:#f5f9ff; color:#1557c0; text-decoration:none; font-size:.9rem; font-weight:700; cursor:pointer; }
    .guide-tag:hover,.guide-tag[aria-pressed="true"] { background:#1557c0; border-color:#1557c0; color:#fff; }
    .guide-list-status { margin:14px 0; color:#596579; font-size:.95rem; }
    .guide-list-cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .guide-list-card { display:flex; flex-direction:column; align-items:flex-start; gap:10px; min-width:0; padding:18px; border:1px solid #d9e7f8; border-radius:14px; color:inherit; text-decoration:none; background:#fff; box-shadow:0 3px 12px rgba(40,80,130,.04); }
    .guide-list-card:hover { border-color:#9dbfe9; background:#f8fbff; }
    .guide-list-card-title { color:#123778; font-size:1.08rem; font-weight:900; line-height:1.5; }
    .guide-list-card-desc { color:#46556b; font-size:.95rem; line-height:1.7; }
    .guide-list-card-category { color:#557500; background:#f1f8dc; border-radius:6px; padding:4px 8px; font-size:.78rem; font-weight:800; }
    .guide-list-card-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; padding-top:4px; }
    .guide-list-card-tags .guide-tag { padding:4px 8px; font-size:.78rem; cursor:default; }
    .guide-list-empty { padding:22px 4px; color:#596579; }
    .guide-list-back { display:inline-block; margin-bottom:16px; color:#1557c0; font-weight:800; text-decoration:none; }
    @media(max-width:650px) {
      .guide-list-wrap { padding:16px 13px 32px; }
      .guide-list-head { padding:20px 16px; }
      .guide-list-head h1 { font-size:1.5rem; }
      .guide-list-cards { grid-template-columns:1fr; }
      .guide-list-card { padding:16px; }
    }
  </style>
</head>
<body class="guide-list-page">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="home-button" href="./ninaguide.html" aria-label="ガイドトップへ" title="ガイドトップへ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7"></path><path d="M5 9v12h14V9"></path><path d="M9 21v-7h6v7"></path></svg>
      </a>
      <div class="header-spacer"></div>
      <a href="https://www.ninapharm.co.jp/e-service/" target="_blank" rel="noopener noreferrer" class="btn-login">E-Service</a>
    </div>
  </header>

  <main class="guide-list-wrap">
    <a class="guide-list-back" href="./ninaguide.html">← メンバーズガイドへ戻る</a>

    <section class="guide-list-head">
      <h1 id="listTitle">記事を探す</h1>
      <p id="listIntro">キーワード・カテゴリから、知りたい内容を探せます。</p>
    </section>

    <div class="guide-list-tools">
      <label for="listSearch">記事タイトル・タグで検索</label>
      <input id="listSearch" type="search" placeholder="例：WEB登録、支払い、停止" autocomplete="off">
    </div>

    <h2 id="keywordHeading">キーワードから探す</h2>
    <div class="guide-list-keywords" id="keywordList" aria-label="キーワード一覧"></div>

    <h2 id="categoryHeading">カテゴリから探す</h2>
    <div class="guide-list-keywords" id="categoryList" aria-label="カテゴリ一覧"></div>

    <p class="guide-list-status" id="resultStatus" aria-live="polite"></p>
    <div class="guide-list-cards" id="articleCards"></div>
    <p class="guide-list-empty" id="emptyMessage" hidden>該当する記事がありません。別のキーワードで検索してください。</p>
  </main>

  <footer class="top-footer">
    <p class="disclaimer">※当サイトは会員向けの各種お手続き・規約の要点を分かりやすく解説したサポートガイドです。<br>正式な契約内容・規約はニナファームジャポン発行の「概要書面」「メンバーズマニュアル」をご確認ください。</p>
    <div class="copyright">Copyright (C) NINAPHARM JAPON CO.,Ltd. All Rights Reserved.</div>
  </footer>

  <script src="./guide-data.js"></script>
  <script>
  (() => {
    const articles = window.NINA_GUIDE_ARTICLES || [];
    const keywords = window.NINA_GUIDE_KEYWORDS || [];
    const categories = window.NINA_GUIDE_CATEGORIES || [];
    const params = new URLSearchParams(location.search);

    const input = document.getElementById('listSearch');
    const cards = document.getElementById('articleCards');
    const status = document.getElementById('resultStatus');
    const empty = document.getElementById('emptyMessage');
    const title = document.getElementById('listTitle');
    const intro = document.getElementById('listIntro');

    const keywordHeading = document.getElementById('keywordHeading');
    const keywordList = document.getElementById('keywordList');
    const categoryHeading = document.getElementById('categoryHeading');
    const categoryList = document.getElementById('categoryList');

    const selectedTag = params.get('tag') || '';
    const selectedCategory = params.get('category') || '';

    input.value = params.get('q') || '';

    function makeTag(label, type, selected) {
      const a = document.createElement('a');
      a.className = 'guide-tag';

      a.href = type === 'category'
        ? '?category=' + encodeURIComponent(label)
        : '?tag=' + encodeURIComponent(label);

      a.textContent = label;

      if (selected) {
        a.setAttribute('aria-pressed', 'true');
      }

      return a;
    }

    keywords.forEach(tag => {
      keywordList.appendChild(
        makeTag(tag, 'tag', selectedTag === tag)
      );
    });

    categories.forEach(cat => {
      categoryList.appendChild(
        makeTag(cat, 'category', selectedCategory === cat)
      );
    });

    function render() {
      const rawQuery = input.value.trim();
      const q = rawQuery.toLocaleLowerCase('ja');

      // キーワード・カテゴリ・検索語が指定されている場合は、
      // 探し方の一覧を隠し、記事の検索結果に集中できるようにする。
      const showBrowseLists =
        !selectedTag && !selectedCategory && !rawQuery;

      keywordHeading.hidden = !showBrowseLists;
      keywordList.hidden = !showBrowseLists;
      categoryHeading.hidden = !showBrowseLists;
      categoryList.hidden = !showBrowseLists;

      if (selectedTag) {
        title.textContent = 'キーワード：「' + selectedTag + '」';
        intro.textContent = '「' + selectedTag + '」に関連する記事です。';
      } else if (selectedCategory) {
        title.textContent = 'カテゴリ：' + selectedCategory;
        intro.textContent = selectedCategory + 'に分類された記事です。';
      } else if (rawQuery) {
        title.textContent = '検索結果';
        intro.textContent = '記事タイトルとタグから検索しています。';
      } else {
        title.textContent = '記事を探す';
        intro.textContent = 'キーワード・カテゴリから、知りたい内容を探せます。';
      }

      const found = articles.filter(item => {
        const tags = item.tags || [];

        const matchesTag =
          !selectedTag || tags.includes(selectedTag);

        const matchesCategory =
          !selectedCategory || item.category === selectedCategory;

        const searchText = [
          item.title,
          item.category,
          item.description,
          ...tags
        ].join(' ').toLocaleLowerCase('ja');

        return matchesTag &&
          matchesCategory &&
          (!q || searchText.includes(q));
      });

      cards.innerHTML = '';

      found.forEach(item => {
        const a = document.createElement('a');
        a.className = 'guide-list-card';
        a.href = item.href;

        const category = document.createElement('span');
        category.className = 'guide-list-card-category';
        category.textContent = item.category;

        const h = document.createElement('span');
        h.className = 'guide-list-card-title';
        h.textContent = item.title;

        const desc = document.createElement('span');
        desc.className = 'guide-list-card-desc';
        desc.textContent = item.description;

        const tags = document.createElement('span');
        tags.className = 'guide-list-card-tags';

        (item.tags || []).forEach(tag => {
          const chip = document.createElement('span');
          chip.className = 'guide-tag';
          chip.textContent = tag;
          tags.appendChild(chip);
        });

        a.append(category, h, desc, tags);
        cards.appendChild(a);
      });

      status.textContent = found.length + '件の記事';
      empty.hidden = found.length !== 0;
    }

    input.addEventListener('input', render);
    render();
  })();
  </script>
