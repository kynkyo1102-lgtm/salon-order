<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>その他の手続き - メンバーズWebガイド</title><link rel="stylesheet" href="./common.css?v=20261023-nav3"><style>.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{font:inherit;text-align:left;border:1px solid var(--border-color);border-radius:12px;padding:18px;background:#fff;color:var(--primary-dark);cursor:pointer;box-shadow:var(--shadow)}.choice:hover{background:var(--blue-pale)}.choice small{display:block;color:var(--muted-text);margin-top:5px}.back{background:none;border:0;color:var(--primary);font:inherit;font-weight:800;cursor:pointer;margin-bottom:16px}.detail{border:1px solid var(--border-color);border-radius:12px;padding:18px;background:var(--sub-bg)}.official{display:inline-block;background:var(--primary);color:white;text-decoration:none;padding:12px 18px;border-radius:9px;margin-top:16px;font-weight:800}.detail p{margin-top:12px}@media(max-width:700px){.choices{grid-template-columns:1fr}.section-card{padding:22px 17px}}</style></head><body><header><div class="header-container"><a href="./ninaguide.html" class="back-link">← トップガイドへ戻る</a><a class="btn-login" href="https://sslgw.jns-asp.jp/685/pc.html?new" target="_blank" rel="noopener noreferrer">🔐 E-Serviceログイン</a></div></header><main class="container"><div class="page-header"><div class="page-category">各種手続き</div><h1 class="page-title">その他の手続き</h1></div><section class="section-card"><p class="section-desc">何をしたいかを選んで、必要な申請書を確認できます。</p><div id="app"></div></section></main><footer><p>※非公式の案内ページです。正式な提出方法・申請条件・最新の書式は公式ページをご確認ください。</p></footer><script>const groups=[["登録情報を変更したい",["住所・連絡先を変更したい|登録事項変更届","氏名などを変更したい|登録事項変更届","本人確認書類を提出したい|本人確認書類貼付用紙"]],["お支払い・振込について",["カード情報を届け出たい|クレジット決済番号届出書","口座振替・自動振込を申し込みたい|アプラス預金口座振替依頼書・自動振込利用申込書","振込明細を提出したい|振込明細書貼付用紙"]],["定期購入について",["定期購入の内容を変更したい|定期購入変更届","家族の定期購入をまとめたい|ご家族限定・定期購入おまとめ配送申請書"]],["会員資格・組織について",["会員資格を復活したい|会員資格復活申請書","譲渡・相続・法人個人変更をしたい|譲渡・相続・法人・個人変更申請書","ブランチを申請したい|ブランチ申請書"]],["商品やツールを注文したい",["商品を注文したい|商品購入注文書","ツールや商品を注文したい|ビジネスツール兼商品購入注文書","組織図を注文したい|組織図注文書","名刺を注文したい|会員用名刺注文書"]],["その他の申請",["解約・クーリングオフをしたい|クーリングオフ・解約申請書","インボイス登録番号を届け出たい|適格請求書発行事業者登録番号届出書","マイナンバーを届け出たい|マイナンバー届出書"]]];const app=document.getElementById('app');const official='https://faq.santeage.com/26/ninapharm_downloadA-2';function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt)n.textContent=txt;return n}function btn(text,action,small){const b=node('button','choice');b.type='button';b.append(node('strong','',text));if(small)b.append(node('small','',small));b.onclick=action;return b}function back(text,fn){const b=node('button','back','← '+text);b.onclick=fn;app.append(b)}function home(){app.replaceChildren();const grid=node('div','choices');groups.forEach((g,i)=>grid.append(btn(g[0],()=>category(i),'手続きの一覧を見る')));app.append(grid)}function category(i){app.replaceChildren();back('カテゴリーに戻る',home);app.append(node('h2','section-card-title',groups[i][0]));groups[i][1].forEach((v,j)=>app.append(btn(v.split('|')[0],()=>detail(i,j))))}function detail(i,j){const v=groups[i][1][j].split('|');app.replaceChildren();back('手続き一覧に戻る',()=>category(i));const d=node('div','detail');d.append(node('h2','section-card-title',v[0]),node('p','','必要な書類：'+v[1]),node('p','','提出方法・提出先は公式案内をご確認ください。'));const a=node('a','official','公式の申請書一覧を確認する ↗');a.href=official;a.target='_blank';a.rel='noopener noreferrer';d.append(a);app.append(d)}home();</script></body></html>
