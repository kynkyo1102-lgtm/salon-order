const pins={};let active=-1;const pref=document.getElementById('pref');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prefectures=['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];for(const p of prefectures){if(salons.some(x=>x.address.startsWith(p)||p==='大阪府'&&x.address.startsWith('大阪市'))){let o=document.createElement('option');o.value=p;o.textContent=p;pref.append(o)}}
function render(){const q=document.getElementById('q').value.toLowerCase().replace(/\s/g,'');const p=pref.value;const arr=salons.map((x,i)=>({...x,i})).filter(x=>(!p||x.address.startsWith(p)||p==='大阪府'&&x.address.startsWith('大阪市'))&&(x.name+x.address).toLowerCase().replace(/\s/g,'').includes(q));document.getElementById('count').textContent=arr.length+'件 / 全'+salons.length+'件';document.getElementById('list').innerHTML=arr.map(x=>`<button class="store ${x.i===active?'active':''}" data-i="${x.i}"><b>${esc(x.name)}</b><small>${esc(x.address)}</small></button>`).join('');document.querySelectorAll('.store').forEach(el=>el.onclick=()=>selectStore(Number(el.dataset.i)))}
document.getElementById('q').addEventListener('input',render);pref.addEventListener('change',render);
async function selectStore(i){active=i;render();const x=salons[i],d=document.getElementById('detail');const link='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.address);d.innerHTML=`<h2>${esc(x.name)}</h2><div class="meta"><span>住所</span><span>${esc(x.address)}</span><span>営業時間</span><span>${esc(x.hours||'要確認')}</span><span>定休日</span><span>${esc(x.closed||'要確認')}</span>${x.owner?`<span>オーナー</span><span>${esc(x.owner)}</span>`:''}${x.notes?`<span>補足</span><span>${esc(x.notes)}</span>`:''}</div><div class="actions"><a href="${link}" target="_blank" rel="noopener noreferrer">Googleマップで確認</a></div><p class="loading" id="status">地図で住所を検索しています…</p>`;if(!map){document.getElementById('status').textContent='地図はこの環境で表示できません。Googleマップで確認できます。';return}if(pins[i]){map.setView(pins[i].getLatLng(),15);pins[i].openPopup();document.getElementById('status').textContent='地図に位置を表示しました。';return}try{const key='ninaguide-geocode-'+x.address;let loc=JSON.parse(((()=>{try{return localStorage.getItem(key)}catch(e){return null}})())||'null');if(!loc){const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q='+encodeURIComponent(x.address);const res=await fetch(url,{headers:{'Accept':'application/json'}});if(!res.ok)throw Error('search failed');const data=await res.json();if(!data.length)throw Error('not found');loc={lat:Number(data[0].lat),lon:Number(data[0].lon)};try{localStorage.setItem(key,JSON.stringify(loc))}catch(e){}}pins[i]=L.marker([loc.lat,loc.lon]).addTo(map).bindPopup(esc(x.name));if(active===i){map.setView([loc.lat,loc.lon],15);pins[i].openPopup();document.getElementById('status').textContent='地図に推定位置を表示しました。'}}catch(e){if(active===i)document.getElementById('status').textContent='地図上で住所を特定できませんでした。「Googleマップで確認」をご利用ください。'}}render()}

// Restore previously resolved locations without making bulk requests.
if(map){
  salons.forEach((x,i)=>{
    try{
      const loc=JSON.parse(localStorage.getItem('ninaguide-geocode-'+x.address)||'null');
      if(loc && Number.isFinite(loc.lat) && Number.isFinite(loc.lon)){
        pins[i]=L.marker([loc.lat,loc.lon]).addTo(map).bindPopup(esc(x.name));
        pins[i].on('click',()=>selectStore(i));
      }
    }catch(e){}
  });
}
