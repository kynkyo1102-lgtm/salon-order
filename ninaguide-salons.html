const prefectures=['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];
const positions={"北海道":[1080,180],"宮城県":[941,535],"秋田県":[910,442],"岐阜県":[689,745],"三重県":[697,839],"滋賀県":[651,785],"京都府":[615,800],"大阪府":[590,837],"兵庫県":[536,804],"奈良県":[641,850],"岡山県":[460,804],"広島県":[387,795],"山口県":[294,824],"福岡県":[188,880],"佐賀県":[153,903],"長崎県":[113,942],"熊本県":[183,962],"大分県":[236,922],"宮崎県":[214,1006],"鹿児島県":[174,1046]};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pref=s=>prefectures.find(p=>s.address.startsWith(p))||(s.address.startsWith('大阪市')?'大阪府':'');
const groups={};for(const s of salons){const p=pref(s);if(p)(groups[p]??=[]).push(s)}
let active='';
const root=document.getElementById('pins');
for(const [p,stores] of Object.entries(groups)){const xy=positions[p];if(!xy)continue;const r=Math.min(42,21+7*Math.sqrt(stores.length));const ns='http://www.w3.org/2000/svg';const g=document.createElementNS(ns,'g');g.setAttribute('class','pin');g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',p+' '+stores.length+'施設');g.setAttribute('data-pref',p);g.setAttribute('transform','translate('+xy[0]+' '+xy[1]+')');const circle=document.createElementNS(ns,'circle');circle.setAttribute('r',r);g.appendChild(circle);const text=document.createElementNS(ns,'text');text.setAttribute('text-anchor','middle');text.setAttribute('dy','4');text.textContent=stores.length;g.appendChild(text);g.addEventListener('click',()=>selectPref(p));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectPref(p)}});root.appendChild(g)}

const hokkaidoStores=groups['北海道']||[];
const hokkaidoPoints={
 '札幌店':[1091,202],
 '札幌中央店':[1082,218],
 '旭山記念公園店':[1063,222],
 '札幌月寒店':[1107,233],

};
function storePoint(s,i){
 if(s.name.includes('旭川'))return hokkaidoPoints['旭川春光店'];
 if(s.name.includes('旭山記念公園'))return hokkaidoPoints['旭山記念公園店'];

function renderHokkaido(){
 const svg=document.getElementById('japan'),box=document.getElementById('mapbox');
 box.classList.add('detail-mode');
 // Zoom using SVG viewBox: no change to the underlying supplied map.
 svg.setAttribute('viewBox','920 5 360 365');
 const root=document.getElementById('citypins');root.replaceChildren();
 const ns='http://www.w3.org/2000/svg';
 hokkaidoStores.forEach((s,i)=>{
  const [x,y]=storePoint(s,i),g=document.createElementNS(ns,'g');

 document.querySelectorAll('[data-store]').forEach(b=>b.onclick=()=>showStore(hokkaidoStores[Number(b.dataset.store)],Number(b.dataset.store)));
}
function showStore(s,i){
 document.getElementById('selected').textContent=s.name;
 document.getElementById('list').innerHTML='<button type="button" id="backStores" style="background:#e8f1e9;border:0;padding:9px 12px;border-radius:8px;cursor:pointer;margin-bottom:12px">← 北海道の施設一覧</button><article class="store"><div class="meta"><b>住所：</b>'+esc(s.address)+'<br><b>営業時間：</b>'+esc(s.hours||'要確認')+'<br><b>定休日：</b>'+esc(s.closed||'要確認')+(s.owner?'<br><b>オーナー：</b>'+esc(s.owner):'')+(s.notes?'<br><b>備考：</b>'+esc(s.notes):'')+'</div><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.address)+'">Googleマップで場所を確認 ↗</a></article>';

 if(window.innerWidth<751)document.getElementById('selected').scrollIntoView({behavior:'smooth',block:'start'});
}

document.getElementById('mapback').onclick=resetMap;
function selectPref(p){
 active=p;
 if(p==='北海道'){renderHokkaido();return}
 resetMap();
 document.getElementById('selected').textContent=p+'（'+groups[p].length+'施設）';
 document.getElementById('list').innerHTML=groups[p].map(s=>'<article class="store"><h3>'+esc(s.name)+'</h3><div class="meta"><b>住所：</b>'+esc(s.address)+'<br><b>営業時間：</b>'+esc(s.hours||'要確認')+'<br><b>定休日：</b>'+esc(s.closed||'要確認')+(s.owner?'<br><b>オーナー：</b>'+esc(s.owner):'')+(s.notes?'<br><b>備考：</b>'+esc(s.notes):'')+'</div><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.address)+'">Googleマップで場所を確認 ↗</a></article>').join('');
 document.querySelectorAll('[data-pref]').forEach(el=>el.classList.toggle('active',el.dataset.pref===p));
 if(window.innerWidth<751)document.getElementById('selected').scrollIntoView({behavior:'smooth',block:'start'});
}
</script></body></html>
