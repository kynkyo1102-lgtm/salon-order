<body class="registration-guide salon-guide">
<main class="guide-common-page salon-guide-page">
<h1 class="guide-common-title">全国のサロンを探す</h1>
<div class="salon-intro-row"><p class="salon-intro">都道府県を選ぶと、その地域のサロンを探せます。</p><img class="salon-intro-mito" src="./assets/mitochondria/13_magnifying-glass.svg" alt="虫眼鏡を持ったミトコンドリアちゃん" width="96" height="88"></div>
<section class="salon-map-section" aria-label="全国のサロン分布"><h2>全国のサロン分布</h2><div class="salon-stats" aria-label="掲載サロン数"><div class="salon-stat"><strong id="salon-total-count">—</strong><span>全国の掲載店舗</span></div><div class="salon-stat"><strong id="salon-pref-count">—</strong><span>サロンのある都道府県</span></div></div><p class="salon-map-help">青い都道府県にサロンがあります。タップすると店舗一覧が表示されます。</p><div id="salon-map" class="salon-map" aria-label="都道府県別サロン分布図"></div><div id="salon-map-selection" class="salon-map-selection" aria-live="polite">地図の青い都道府県を選んでみてください。</div><p class="salon-map-legend"><span class="salon-legend-off"></span>なし <span class="salon-legend-one"></span>1店舗 <span class="salon-legend-two"></span>2〜3店舗 <span class="salon-legend-many"></span>4店舗以上</p></section><section class="salon-finder" aria-label="サロン検索"><label class="salon-select-label" for="salon-pref-select">都道府県を選択</label>
<select id="salon-pref-select" class="salon-select"><option value="">都道府県を選んでください</option></select>
<div class="salon-results"><h2 id="selected" class="title">都道府県を選択してください</h2><div id="list" class="empty">都道府県を選ぶとサロン一覧が表示されます。</div></div>
</section>
</main>
