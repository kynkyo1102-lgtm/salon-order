function setView(v){
 const w=Math.max(145,Math.min(full.w,v.w)),h=w*full.h/full.w;

function updateMarkerScale(){
 // Keep markers and their numbers readable at a fixed on-screen size.
 // The SVG viewBox zoom changes the map scale; compensate both circles and text.
 const scale=view.w/full.w;
 const zoom=full.w/view.w;
 const markerBoost=1+0.24*Math.min(1,Math.max(0,(zoom-1)/2));
 document.querySelectorAll('#pins .pin').forEach(g=>{

 });
}
function zoomAt(factor,cx,cy){
 const w=Math.max(145,Math.min(full.w,view.w/factor)),h=w*full.h/full.w;
 const k=w/view.w;
 setView({x:cx-(cx-view.x)*k,y:cy-(cy-view.y)*k,w,h});
}
function svgPoint(clientX,clientY){
 const pt=svg.createSVGPoint();pt.x=clientX;pt.y=clientY;
 const matrix=svg.getScreenCTM();return matrix?pt.matrixTransform(matrix.inverse()):{x:view.x+view.w/2,y:view.y+view.h/2};
}
svg.addEventListener('wheel',e=>{e.preventDefault();const p=svgPoint(e.clientX,e.clientY);zoomAt(e.deltaY<0?1.22:1/1.22,p.x,p.y)},{passive:false});
svg.addEventListener('dblclick',e=>{e.preventDefault();const p=svgPoint(e.clientX,e.clientY);zoomAt(1.7,p.x,p.y)});
const touches=new Map();let gesture=null,moved=false,suppressClickUntil=0;
function gestureState(){
 const pts=[...touches.values()];
 if(pts.length===0)return null;
 const mid={x:pts.reduce((a,p)=>a+p.x,0)/pts.length,y:pts.reduce((a,p)=>a+p.y,0)/pts.length};
 const dist=pts.length>1?Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y):0;
 return {mid,dist,base:{...view},world:svgPoint(mid.x,mid.y)};
}
svg.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 touches.set(e.pointerId,{x:e.clientX,y:e.clientY});svg.setPointerCapture(e.pointerId);
 gesture=gestureState();moved=false;
});
svg.addEventListener('pointermove',e=>{
 if(!touches.has(e.pointerId))return;
 touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
 const pts=[...touches.values()],mid={x:pts.reduce((a,p)=>a+p.x,0)/pts.length,y:pts.reduce((a,p)=>a+p.y,0)/pts.length};
 const rect=svg.getBoundingClientRect();
 const dx=(mid.x-gesture.mid.x)/rect.width*gesture.base.w,dy=(mid.y-gesture.mid.y)/rect.height*gesture.base.h;
 const dist=pts.length>1?Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y):0;
 const scale=dist&&gesture.dist?gesture.dist/dist:1;
 if(Math.abs(mid.x-gesture.mid.x)>5||Math.abs(mid.y-gesture.mid.y)>5||Math.abs(dist-gesture.dist)>5)moved=true;
 const w=gesture.base.w*scale,h=gesture.base.h*scale;
 const rx=(gesture.world.x-gesture.base.x)/gesture.base.w,ry=(gesture.world.y-gesture.base.y)/gesture.base.h;
 setView({x:gesture.world.x-rx*w-dx*scale,y:gesture.world.y-ry*h-dy*scale,w,h});
});
function pointerEnd(e){
 if(!touches.has(e.pointerId))return;
 touches.delete(e.pointerId);
 if(moved)suppressClickUntil=performance.now()+250;
 gesture=gestureState();
}
svg.addEventListener('pointerup',pointerEnd);svg.addEventListener('pointercancel',pointerEnd);
svg.addEventListener('click',e=>{if(performance.now()<suppressClickUntil){e.stopPropagation();e.preventDefault()}},true);
function approximatePoints(p,stores){
 if(p==='北海道')return [[1091,202],[1082,218],[1063,222],[1107,233],[1120,144]];
 const [cx,cy]=positions[p]||[650,700];
 return stores.map((s,i)=>{
  const angle=i*2.39996+.5,rad=stores.length===1?0:Math.min(58,26+12*Math.sqrt(i));
  return [cx+Math.cos(angle)*rad,cy+Math.sin(angle)*rad];
 });
}
function selectPref(p){
 selectedPref=p;mapbox.classList.add('detail-mode');
 const stores=groups[p]||[],root=document.getElementById('citypins');root.replaceChildren();
 const coords=approximatePoints(p,stores);
 const [cx,cy]=positions[p]||[650,700];
 const width=p==='北海道'?380:Math.max(190,stores.length>3?300:230);
 setView({x:cx-width/2,y:cy-width*1155/1362/2,w:width,h:width*1155/1362});
 stores.forEach((s,i)=>{
  const [x,y]=coords[i],ns='http://www.w3.org/2000/svg',g=document.createElementNS(ns,'g');
  g.setAttribute('class','city-pin');g.setAttribute('transform','translate('+x+' '+y+')');
  g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',s.name);
  const hit=document.createElementNS(ns,'circle');hit.setAttribute('r','26');hit.setAttribute('fill','transparent');g.appendChild(hit);
  const c=document.createElementNS(ns,'circle');c.setAttribute('r','17');g.appendChild(c);
  g.addEventListener('click',()=>showStore(s));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showStore(s)}});
  root.appendChild(g);
 });
 updateMarkerScale();
 showList();
}
function showList(){
 const stores=groups[selectedPref]||[];
 document.getElementById('selected').textContent=selectedPref+'（'+stores.length+'施設）';
 document.getElementById('list').innerHTML='<p class="citycaption">個別ピンはおおよその位置です。タップすると詳細を表示します。</p>'+stores.map((s,i)=>'<button type="button" class="store" data-store="'+i+'" style="display:block;width:100%;text-align:left;background:white;border:0;border-top:1px solid #e5ece7;cursor:pointer"><h3>❀ '+esc(s.name)+'</h3><div class="meta">'+esc(s.address)+'</div></button>').join('');
 document.querySelectorAll('[data-store]').forEach(b=>b.onclick=()=>showStore(stores[Number(b.dataset.store)]));
}
function showStore(s){
 document.getElementById('selected').textContent=s.name;
 document.getElementById('list').innerHTML='<button type="button" id="backStores" style="background:var(--blue-pale);border:0;padding:10px 14px;border-radius:8px;cursor:pointer;margin-bottom:12px">← '+esc(selectedPref)+'の施設一覧</button><article class="store"><div class="meta"><b>住所：</b>'+esc(s.address)+'<br><b>営業時間：</b>'+esc(s.hours||'要確認')+'<br><b>定休日：</b>'+esc(s.closed||'要確認')+(s.owner?'<br><b>オーナー：</b>'+esc(s.owner):'')+(s.notes?'<br><b>備考：</b>'+esc(s.notes):'')+'</div><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.address)+'">Googleマップで場所を確認 ↗</a></article>';
 document.getElementById('backStores').onclick=showList;
 if(window.innerWidth<751)document.getElementById('selected').scrollIntoView({behavior:'smooth',block:'start'});
}
function resetMap(){
 selectedPref=null;mapbox.classList.remove('detail-mode');document.getElementById('citypins').replaceChildren();
 // Keep the user's zoom level when returning to prefecture markers.
 document.getElementById('selected').textContent='都道府県を選択してください';
 document.getElementById('list').innerHTML='<p class="empty">数字付きのピンをタップすると、その都道府県の施設を表示します。</p>';
}
document.getElementById('mapback').onclick=resetMap;
</script></body></html>
