11：00～18：00","closed":"第3月曜日、土、日、祝日","owner":"川原　英樹さん","notes":""},{"name":"プラッスドゥニナ福岡平尾店","address":"福岡県福岡市中央区平尾2-17-15","hours":"11：00～19：00","closed":"水、木、金","owner":"酒瀬川　恭子さん","notes":""},{"name":"プラッスドゥニナ福岡糸島店","address":"福岡県糸島市前原西4丁目14-26","hours":"10：00～16：00","closed":"木、日、祝日","owner":"平尾　愛美さん","notes":""},{"name":"プラッスドゥニナ佐賀三日月店","address":"佐賀県小城市三日月町長神田2335-5","hours":"11：00～18：00","closed":"土、日、祝日","owner":"古賀　雄二さん","notes":""},{"name":"プラッスドゥニナ鳥栖店","address":"佐賀県鳥栖市元町1247-5　吉竹第2ビル5F","hours":"11：00～18：00","closed":"水、土、日、祝日","owner":"幸若　直樹さん","notes":""},{"name":"プラッスドゥニナ大分日田インター前店","address":"大分県日田市清岸寺町1137‐1","hours":"11：00～17：00","closed":"土、日、祝日","owner":"安心院　惇さん","notes":""},{"name":"プラッスドゥニナ長崎大村店","address":"長崎県大村市古賀島町1441-2-C","hours":"11：00～17：00","closed":"日、祝日、第2、4土曜日","owner":"岩本　進利さん","notes":""},{"name":"プラッスドゥニナ南熊本店","address":"熊本県熊本市南区田迎4丁目9-36　KSビル1F","hours":"11：00～17：00","closed":"水、土、日、祝日","owner":"幸若　直樹さん","notes":""},{"name":"プラッスドゥニナ熊本菊陽店","address":"熊本県菊池郡菊陽町津久礼157-6","hours":"13：00～18：00","closed":"月、水、金、日","owner":"中別府　裕子さん","notes":""},{"name":"プラッスドゥニナ宮崎都城店","address":"宮崎県都城市北原町1103-2　北原ビル1F","hours":"11：00～17：00","closed":"金、土、日、祝日","owner":"田坂　千秋さん","notes":""},{"name":"プラッスドゥニナ宮崎神宮外苑店","address":"宮崎県宮崎市南方町大迫254-3","hours":"11：00～17：00","closed":"火、木、土、日、祝日","owner":"堀切健二さん","notes":""},{"name":"プラッスドゥニナ鹿児島中央店","address":"鹿児島県鹿児島市下荒田3-3-10","hours":"11：00～17：00","closed":"月、火、日、祝日","owner":"豊村　和代さん","notes":""}];
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prefectures=['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];
const pref=document.getElementById('pref');prefectures.filter(p=>salons.some(x=>x.address.startsWith(p))).forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;pref.append(o)});
const kyushu=['福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県'];
const kyushuOption=document.createElement('option');kyushuOption.value='九州';kyushuOption.textContent='九州（13施設）';pref.insertBefore(kyushuOption,pref.options[1]);pref.value='九州';
let active=-1;function render(){const q=document.getElementById('q').value.toLowerCase().replace(/\s/g,'');const p=pref.value;const arr=salons.map((x,i)=>({...x,i})).filter(x=>(!p||(p==='九州'?kyushu.some(k=>x.address.startsWith(k)):x.address.startsWith(p)))&&(x.name+x.address).toLowerCase().replace(/\s/g,'').includes(q));document.getElementById('count').textContent=arr.length+'件 / 全'+salons.length+'件';document.getElementById('list').innerHTML=arr.map(x=>'<button class="store '+(x.i===active?'active':'')+'" data-i="'+x.i+'"><b>'+esc(x.name)+'</b><small>'+esc(x.address)+'</small></button>').join('');document.querySelectorAll('.store').forEach(el=>el.onclick=()=>selectStore(Number(el.dataset.i)))}
async function selectStore(i){
 active=i;render();
 const x=salons[i],link='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.address);
 document.getElementById('detail').innerHTML='<h2>'+esc(x.name)+'</h2><div class="meta"><span>住所</span><span>'+esc(x.address)+'</span><span>営業時間</span><span>'+esc(x.hours||'要確認')+'</span><span>定休日</span><span>'+esc(x.closed||'要確認')+'</span>'+(x.owner?'<span>オーナー</span><span>'+esc(x.owner)+'</span>':'')+(x.notes?'<span>補足</span><span>'+esc(x.notes)+'</span>':'')+'</div><a class="action" href="'+link+'" target="_blank" rel="noopener noreferrer">Googleマップで所在地を確認 ↗</a><p class="note" id="mapStatus">地図上の位置を検索しています…</p>';
 const status=document.getElementById('mapStatus');
 if(!kyushu.some(p=>x.address.startsWith(p))){status.textContent='九州以外の店舗のピンは今後対応します。';return;}
 try{
  const key='ninaguide-kyushu-v2-'+x.address;
  let loc=null;try{loc=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}
  if(!loc){
   const address=x.address.split('　')[0];
   const response=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q='+encodeURIComponent(address),{headers:{Accept:'application/json'}});
   if(!response.ok)throw Error('geocode failed');
   const results=await response.json();
   if(!results.length)throw Error('not found');
   loc={lat:Number(results[0].lat),lon:Number(results[0].lon)};
   if(!Number.isFinite(loc.lat)||!Number.isFinite(loc.lon))throw Error('invalid');
   try{localStorage.setItem(key,JSON.stringify(loc))}catch(e){}
  }
  if(active!==i)return;
  const d=0.012,bbox=[loc.lon-d,loc.lat-d,loc.lon+d,loc.lat+d].join(',');
  document.getElementById('map').src='https://www.openstreetmap.org/export/embed.html?bbox='+encodeURIComponent(bbox)+'&layer=mapnik&marker='+encodeURIComponent(loc.lat+','+loc.lon);
  status.textContent='住所検索で見つかった推定位置にピンを表示しました。正確な位置はGoogleマップでもご確認ください。';
 }catch(e){if(active===i)status.textContent='この住所の位置を自動特定できませんでした。Googleマップでご確認ください。';}
}
document.getElementById('q').addEventListener('input',render);pref.addEventListener('change',render);render();</script></body></html>
