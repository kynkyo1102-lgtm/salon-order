<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ミトコンドリアちゃんの登録案内｜メンバーズガイド</title><link rel="stylesheet" href="./common.css?v=20261019-noto2">
<style>
body{background:#fff!important;color:#27394b}.reg-chat{max-width:720px;margin:0 auto;padding:24px 18px 115px}.reg-chat h1{font-size:clamp(1.4rem,4vw,1.85rem);font-weight:600;line-height:1.5;margin:8px 0}.reg-chat .lead{font-size:.94rem;color:#657386;line-height:1.8;margin:0 0 22px}.reg-chat .eyebrow{font-size:.76rem;letter-spacing:.09em;color:#4c9478;font-weight:600}.chat-panel{border:1px solid #e0e9e8;border-radius:19px;padding:22px 17px;background:#fff;box-shadow:0 6px 25px rgba(41,77,78,.04)}.chat-progress{display:flex;justify-content:space-between;align-items:center;font-size:.79rem;color:#70818a;margin-bottom:14px}.chat-progress-bar{height:5px;background:#edf2f0;border-radius:9px;overflow:hidden;margin-bottom:24px}.chat-progress-fill{height:100%;background:#79b69d;border-radius:9px;transition:width .2s}.chat-message{display:flex;align-items:flex-start;gap:12px;margin-bottom:23px}.chat-avatar{width:85px;flex:0 0 85px;align-self:flex-end}.chat-avatar svg{width:100%;height:auto;display:block}.chat-bubble{position:relative;flex:1;border:1px solid #dce8eb;background:#f7fbfc;border-radius:17px;padding:17px 16px;min-height:105px;line-height:1.9;font-size:1rem;white-space:pre-line}.chat-bubble:before{content:"";position:absolute;left:-7px;bottom:28px;width:12px;height:12px;background:#f7fbfc;border-left:1px solid #dce8eb;border-bottom:1px solid #dce8eb;transform:rotate(45deg)}.chat-speaker{font-size:.78rem;color:#548b74;font-weight:600;margin-bottom:5px}.chat-choices{display:grid;gap:10px}.chat-choice{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid #cbdde5;border-radius:12px;padding:15px 16px;font:inherit;font-size:.95rem;color:#27394b;cursor:pointer;min-height:55px}.chat-choice:after{content:"›";color:#4885b5;font-size:1.4rem}.chat-choice:hover,.chat-choice:focus-visible{border-color:#579dc1;background:#f2f9fc;outline:0}.chat-controls{display:flex;justify-content:space-between;gap:12px;margin-top:21px}.chat-controls button{background:transparent;border:0;color:#577487;text-decoration:underline;font:inherit;font-size:.85rem;padding:8px;cursor:pointer}.chat-controls button:disabled{opacity:.3;cursor:default}.chat-result{background:#f2f8f4;border:1px solid #d6e9dc;border-radius:14px;padding:17px;margin-bottom:12px;line-height:1.85}.chat-result strong{display:block;color:#2e7155;font-size:1.1rem;margin-bottom:5px}.chat-result p{margin:0;font-size:.92rem}.chat-action{display:block;background:#438d72;color:#fff!important;text-decoration:none;border-radius:12px;padding:16px;text-align:center;font-weight:600;margin-top:12px}.chat-secondary{display:block;text-align:center;padding:12px;color:#376a89;text-decoration:underline;font-size:.9rem}.chat-footnote{font-size:.8rem;color:#71808c;line-height:1.8;margin-top:18px}.reg-chat .guide-links{margin-top:25px;border-top:1px solid #e6edf0;padding-top:19px}.reg-chat .guide-links a{color:#356e91;text-decoration:underline}.chat-answers{font-size:.82rem;color:#71808c;margin-bottom:12px;line-height:1.7}.chat-answers span{display:inline-block;background:#f1f5f4;border-radius:30px;padding:5px 10px;margin:3px}.reg-chat a:focus-visible{outline:3px solid #efc35d;outline-offset:3px}@media(max-width:480px){.reg-chat{padding:20px 14px 110px}.chat-panel{padding:17px 12px}.chat-avatar{width:65px;flex-basis:65px}.chat-message{gap:8px}.chat-bubble{padding:14px 12px;font-size:.94rem;min-height:110px}}
.mascot-name{display:block;text-align:center;font-size:10px;line-height:1.5;color:#647b71;white-space:nowrap;letter-spacing:-.04em;margin-top:3px}.chat-avatar{align-self:flex-end}.chat-bubble{min-height:80px}@media(max-width:480px){.mascot-name{font-size:8px;letter-spacing:-.06em}}
</style></head><body><header><div class="header-container"><a class="back-link" href="./guide-a.html">← 新規登録の流れへ戻る</a></div></header>
<main class="reg-chat"><div class="eyebrow">GUIDE A / 新規登録</div><h1>登録方法を一緒に選ぼう</h1><p class="lead">ミトコンドリアちゃんの質問に答えるだけ。あなたに合いそうな登録方法をご案内します。</p>
<section class="chat-panel" aria-label="会話形式の登録案内"><div class="chat-progress"><span id="stepLabel">ごあいさつ</span></div><div class="chat-progress-bar"><div id="progressFill" class="chat-progress-fill" style="width:0"></div></div>
<div class="chat-message"><div class="chat-avatar" aria-hidden="true"><img src="./assets/mitochondria-chan.svg" alt="" width="85" height="128" style="display:block;width:100%;height:auto" loading="eager"><span class="mascot-name">ミトコンドリアちゃん</span></div><div class="chat-bubble"><div id="message" aria-live="polite">こんにちは！登録方法を一緒に確認しましょう。</div></div></div>
<div id="answerHistory" class="chat-answers" hidden></div><div id="choices" class="chat-choices"></div><div id="result" hidden></div><div class="chat-controls"><button id="backBtn" type="button">← ひとつ戻る</button><button id="restartBtn" type="button">最初からやり直す</button></div></section>
<p class="chat-footnote">※この案内は現在のガイドの登録条件をもとにした簡易ナビゲーションです。実際のお手続きでは公式の概要書面・最新の条件をご確認ください。</p><div class="guide-links">自分で確認したい方は <a href="./guide-a-compare-table.html">WEB登録と郵送登録の比較表を見る →</a></div></main>
<nav class="guide-floating-actions" aria-label="便利なリンク"><a class="guide-float-eservice" href="https://www.ninapharm.co.jp/e-service/" target="_blank" rel="noopener noreferrer">↗ E-Service</a><a class="diagnosis-float" href="./check.html"><span aria-hidden="true">✦</span> ボーナス診断</a></nav>
<script src="./guide-menu.js" defer></script><script>
(()=>{const $=id=>document.getElementById(id),history=[];const scenes={start:{label:"はじめに",text:"こんにちは！\nミトコンドリアちゃんです。\n新規登録の方法を一緒に確認していきましょう！",options:[["案内をはじめる","company"]]},company:{label:"質問 1 / 3",text:"まず、登録するのは個人ですか？ それとも法人ですか？",options:[["個人で登録したい","payment"],["法人で登録したい","corporate"],["まだ決まっていない","unsure"]]},payment:{label:"質問 2 / 3",text:"初回のお支払いについて教えてください。",options:[["クレジットカードで支払いたい","device"],["銀行振込で支払いたい","paper"],["まだ決めていない・わからない","unsure"]]},device:{label:"質問 3 / 3",text:"スマートフォンやパソコンで、メールを確認しながら入力することはできそうですか？",options:[["できそう！","web"],["少し不安がある","support"],["書面で確認しながら進めたい","paper"]]},corporate:{label:"ご案内",text:"法人登録は、現在のガイドでは郵送での登録となっています。",result:"paper",reason:"法人登録はWEB登録の対象外と案内されています。"},paper:{label:"ご案内",text:"お話を聞くと、郵送登録の手順が合いそうです！",result:"paper",reason:"郵送登録では、初回商品代金を事前に振り込み、申請書と振込明細のコピーを郵送します。"},web:{label:"ご案内",text:"お話を聞くと、WEB登録が合いそうです！",result:"web",reason:"WEB登録では、メールから入力を進め、初回のお支払いにクレジットカードを使います。"},support:{label:"ご案内",text:"操作が不安なら、無理せず紹介者などに確認しながら進めるのがおすすめです。",result:"both",reason:"WEB登録と郵送登録の手順を比べて、進めやすい方法を選びましょう。"},unsure:{label:"ご案内",text:"まだ決められなくても大丈夫！ まずは登録方法の違いを確認してみましょう。",result:"both",reason:"法人か個人か、初回のお支払い方法などを確認してから決めると安心です。"}};let current="start";function render(){const s=scenes[current],isResult=!!s.result;$("stepLabel").textContent=s.label;$("progressFill").style.width=isResult?"100%":current==="start"?"0%":current==="company"?"33%":current==="payment"?"66%":"90%";$("message").textContent=s.text;$("choices").replaceChildren();$("result").replaceChildren();$("result").hidden=!isResult;$("backBtn").disabled=!history.length;$("answerHistory").hidden=!history.length;$("answerHistory").replaceChildren();history.forEach(h=>{if(h.choice==="案内をはじめる")return;const span=document.createElement("span");span.textContent=h.choice;$("answerHistory").append(span)});if(!isResult){s.options.forEach(([label,next])=>{const b=document.createElement("button");b.className="chat-choice";b.type="button";b.textContent=label;b.addEventListener("click",()=>{history.push({from:current,choice:label});current=next;render()});$("choices").append(b)})}else{const div=document.createElement("div");div.className="chat-result";const title=document.createElement("strong");title.textContent=s.result==="web"?"WEB登録をご案内します":s.result==="paper"?"郵送登録をご案内します":"まずは比較してみましょう";const p=document.createElement("p");p.textContent=s.reason;div.append(title,p);$("result").append(div);const links=s.result==="web"?[["WEB登録の流れを見る","./guide-a-web.html"]]:s.result==="paper"?[["郵送登録の流れを見る","./guide-a-paper.html"]]:[["登録方法を比較する","./guide-a-compare-table.html"]];links.forEach(([label,href])=>{const a=document.createElement("a");a.href=href;a.className="chat-action";a.textContent=label+" →";$("result").append(a)});const compare=document.createElement("a");compare.className="chat-secondary";compare.href="./guide-a-compare-table.html";compare.textContent="比較表も確認する";$("result").append(compare)}}$("backBtn").addEventListener("click",()=>{const h=history.pop();if(h){current=h.from;render()}});$("restartBtn").addEventListener("click",()=>{history.length=0;current="start";render()});render()})();
</script></body></html>
