<h1>マイプラン検索</h1><p class="lead">目標金額から、組織とボーナスの例を見てみましょう。</p>
<section class="panel"><h2>目標金額を選ぶ</h2><label for="goal">月間ボーナス</label><select id="goal"><option value="10000">1万円台（1万〜2万円未満）</option><option value="40000" selected>4万円台（4万〜5万円未満）</option><option value="50000">5万円台（5万〜6万円未満）</option><option value="300000">30万円台（30万〜31万円未満）</option><option value="600000">60万円台（60万〜61万円未満）</option></select></section>
<section class="panel"><h2>組織の例</h2>

<div class="myplan-diagram"><div id="binary-diagram" class="binary-diagram" role="img" aria-label="本人からAさん・Bさんにつながる組織図"></div></div>

<h3 class="breakdown-heading">ボーナス内訳</h3><div id="breakdown" class="breakdown-cards"></div><div class="breakdown-total"><strong>ボーナス合計</strong><strong id="sum"></strong></div></section>
<aside class="caution"><strong>この計算例について</strong><p>本人は1点登録、会員は1人10,000PTとして計算しています。実際の取得条件・上限は現行資料をご確認ください。</p><p>表示額は振込額ではありません。振込手数料やキャップ調整により、支給額が変わる場合があります。</p><a class="link" href="./guide-cap-adjustment.html">キャップ調整について詳しく見る ›</a></aside>
<p class="myplan-bottom-link"><a class="link" href="./guide-c-bonus.html">ボーナスプラン一覧で仕組みを確認する ›</a></p>
</main><script>
const yen=n=>n.toLocaleString("ja-JP")+"円",pts=n=>(n/10000).toLocaleString("ja-JP",{maximumFractionDigits:1})+"万PT";
const ranges=[10000,40000,50000,300000,600000];
let selected=0, candidates=[];
function generate(goal){
 if(goal===40000){const ax=100000,ar=100000,bl=100000,br=100000,left=210000,right=210000,abasic=10000,bbasic=10000,own=21000,mega=20000,doubleMega=0;return [{ax,ar,bl,br,left,right,abasic,bbasic,own,mega,doubleMega,total:own+mega}];}

 const found=[],seen=new Set();
 // A/B each have their own two group totals; the parent's side also includes A/B's own 00 position.
 // Each scenario assumes 2 active direct referrals and a 10% basic rate.
 const modes=goal===10000?["Aさん・Bさんが同じくらい育つ","片方のグループが少し大きい","紹介した2人もボーナスを受け取る"]:["Aさん・Bさんが同じくらい育つ","片方のグループが少し大きい","紹介した2人もボーナスを受け取る","Aさん・Bさんの実績を伸ばす"];
 for(const mode of modes){
  let best=null,dist=Infinity;
  const step=goal>=300000?10000:5000;
  const max=goal>=600000?6500000:goal>=300000?3500000:650000;
  for(let a=30000;a<=max;a+=step){
   // A and B each have at least 30,000 PT on the smaller side.
   for(const fraction of [0.8,0.9,1,1.1,1.2]){
    const b=Math.max(30000,Math.round(a*fraction/step)*step);
    if(b>max)continue;
    // A/B own basic uses their respective smaller group PT.
    const abasic=Math.round(a*.1),bbasic=Math.round(b*.1);
    for(const extra of [0,0.1,0.2,0.3,0.4]){
     const ax=a,ar=a+Math.round(a*extra/step)*step;
     const bl=b,br=b+Math.round(b*(mode==="片方のグループが少し大きい"?Math.min(0.5,extra+0.1):extra)/step)*step;
     const left=10000+ax+ar,right=10000+bl+br;
     const own=Math.round(Math.min(left,right)*.1);
     // Mega Match applies only for Crystal+; its eligibility is assumed in 5万円+ scenarios.
     const mega=goal===10000?0:abasic+bbasic;
     const total=own+mega;
     if(total<goal||total>=goal+(goal===10000?10000:10000))continue;
     const ratio=mega/(total||1),balance=Math.min(left,right)/Math.max(left,right);
     const objective=mode==="Aさん・Bさんが同じくらい育つ"?Math.abs(balance-1)+Math.abs(fraction-1)*.05:mode==="緩やかな左右差型"?Math.abs(balance-.78)+Math.abs(fraction-.9)*.02:mode==="紹介した2人もボーナスを受け取る"?Math.abs(ratio-.38)+Math.abs(balance-.9)*.1:Math.abs(ratio-.48)+Math.abs(balance-.88)*.1;
     if(Math.max(ax,ar)/Math.min(ax,ar)>1.5||Math.max(bl,br)/Math.min(bl,br)>1.5)continue;const key=[ax,ar,bl,br].join("/");
     if(!seen.has(key)&&objective<dist){dist=objective;best={mode,ax,ar,bl,br,left,right,abasic,bbasic,own,mega,total,key}}
    }
   }
  }
  if(best){seen.add(best.key);found.push(best)}
 }
 return found;
}
function diagram(m){
 const root=document.getElementById("binary-diagram");
 const node=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
 const top=node("div","plan-top");const img=node("img");img.src="./assets/avatar_01.svg";img.alt="";top.append(img,node("strong","", "あなた"));
 const branches=node("div","plan-branches");
 const links=document.createElementNS("http://www.w3.org/2000/svg","svg");links.setAttribute("viewBox","0 0 600 100");links.setAttribute("preserveAspectRatio","none");links.setAttribute("class","plan-links");links.setAttribute("aria-hidden","true");for(const x of [150,450]){const line=document.createElementNS("http://www.w3.org/2000/svg","line");line.setAttribute("x1","300");line.setAttribute("y1","0");line.setAttribute("x2",String(x));line.setAttribute("y2","100");line.setAttribute("stroke","#94b5c9");line.setAttribute("stroke-width","3");line.setAttribute("vector-effect","non-scaling-stroke");links.append(line)}
 for(const [name,num,l,r] of [["Aさん",2,m.ax,m.ar],["Bさん",3,m.bl,m.br]]){
  const block=node("div","plan-branch");const person=node("div","plan-person");const avatar=node("img");avatar.src="./assets/avatar_"+String(num).padStart(2,"0")+".svg";avatar.alt="";person.append(avatar,node("strong","",name),node("small","plan-direct-label","あなたが直接紹介"));block.append(person);
  const ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox","0 0 300 260");svg.setAttribute("class","plan-triangles");
  svg.setAttribute("role","img");svg.setAttribute("aria-label",name+" 左"+pts(l)+"、右"+pts(r));
  const make=(tag,attrs,text)=>{const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;svg.append(e)};
  make("polygon",{points:"150,4 8,208 150,208",fill:"#73b6e5"});
  make("polygon",{points:"150,4 292,208 150,208",fill:"#0055a4"});
  make("text",{x:"76",y:"242","text-anchor":"middle",fill:"#174b78","font-size":"21","font-weight":"800"},pts(l));
  make("text",{x:"224",y:"242","text-anchor":"middle",fill:"#174b78","font-size":"21","font-weight":"800"},pts(r));
  
  
  block.append(svg);
  if(m.doubleMega){const children=node("div","plan-children");for(const [j,child] of (name==="Aさん"?[["Cさん",4],["Dさん",5]]:[["Eさん",6],["Fさん",7]]).entries()){const [label,id]=child;const item=node("div","plan-child");const pic=node("img");pic.src="./assets/avatar_"+String(id).padStart(2,"0")+".svg";pic.alt="";item.append(pic,node("strong","",label),node("small","","左右 各4万PT"));children.append(item)}block.append(children)}branches.append(block)
 }
 root.replaceChildren(top,links,branches)
}
function render(){
 const goal=Number(document.getElementById("goal").value),m=generate(goal)[0];
 if(!m)return;
 diagram(m);
 const body=document.getElementById("breakdown");body.replaceChildren();
 const add=(name,value,lines)=>{const card=document.createElement("div");card.className="breakdown-card";const head=document.createElement("div");head.className="breakdown-card-head";const title=document.createElement("strong");title.textContent=name;const amount=document.createElement("strong");amount.textContent=yen(value);head.append(title,amount);card.append(head);if(lines.length){const details=document.createElement("div");details.className="breakdown-calcs";for(const [label,formula] of lines){const line=document.createElement("div");line.className="breakdown-calc";const l=document.createElement("span");l.textContent=label;const f=document.createElement("span");f.textContent=formula;line.append(l,f);details.append(line)}card.append(details)}body.append(card)};
 add("ベーシックコミッション",m.own,[["左右の少ない側",pts(Math.min(m.left,m.right))+" × 10％ ＝ "+yen(m.own)]]);
 if(m.mega)add("メガマッチ",m.mega,[["Aさん",pts(Math.min(m.ax,m.ar))+" × 10％ ＝ "+yen(m.abasic)],["Bさん",pts(Math.min(m.bl,m.br))+" × 10％ ＝ "+yen(m.bbasic)]]);
 if(m.doubleMega)add("ダブルメガマッチ",m.doubleMega,[]);

 document.getElementById("sum").textContent=yen(m.total);
}

document.getElementById("goal").addEventListener("change",()=>{selected=0;render()});render();
