<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ニナガイドの図書室｜紙と付箋の試作</title><style>
:root{--ink:#302a25;--wall:#f4f0e7;--wood:#aa7653;--dark:#71472f}*{box-sizing:border-box}body{margin:0;background:var(--wall);font-family:system-ui,"Noto Sans JP",sans-serif;color:var(--ink);line-height:1.6}header{max-width:900px;margin:auto;padding:18px 22px;display:flex;justify-content:space-between;gap:10px;font-size:13px}a{color:inherit}main{max-width:900px;margin:auto;padding:12px 18px 70px}.intro{text-align:center;padding:20px 0 28px}.intro small{letter-spacing:.22em;font-weight:700;color:#8a6852}.intro h1{font-size:clamp(30px,7vw,52px);margin:8px 0}.intro p{margin:0;color:#6e655c}.search{display:flex;max-width:480px;margin:24px auto 0;gap:8px}.search input{min-width:0;flex:1;padding:12px;border:1px solid #b8aa99;border-radius:7px;font:inherit}.search button,.back{border:0;background:#493c32;color:white;padding:10px 16px;border-radius:7px;font:inherit;cursor:pointer}.case{position:relative;background:#b98a63;border:14px solid var(--dark);border-bottom-width:20px;border-radius:12px 12px 5px 5px;box-shadow:0 14px 0 #d6c4b1,0 20px 25px #0002;padding:0 17px 15px}.top-shelf{min-height:154px;display:flex;align-items:end;justify-content:space-between;gap:10px;padding:12px 10px 0;background:#d9b38c;border-bottom:13px solid #815438}.plush{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;position:relative;transform:translateY(5px);padding:0 8px}.plush-face{width:84px;height:76px;background:#e6b4ac;border:3px solid #9d6a6b;border-radius:48% 50% 44% 46%;display:flex;align-items:center;justify-content:center;font-size:27px;box-shadow:inset 5px -6px #c98c87}.plush-face:before,.plush-face:after{content:"";position:absolute;top:24px;width:20px;height:25px;background:#e6b4ac;border:3px solid #9d6a6b;border-radius:50%;z-index:-1}.plush-face:before{left:0}.plush-face:after{right:0}.plush-body{width:57px;height:42px;border-radius:20px 20px 12px 12px;background:#e6b4ac;border:3px solid #9d6a6b;transform:translateY(-3px)}.plush-label{font-size:11px;font-weight:700;background:#fff8e6;padding:3px 9px;border-radius:20px;margin-bottom:5px}.top-note{max-width:210px;font-size:13px;background:#fff8df;padding:12px 15px;border:1px solid #ba9d77;transform:rotate(3deg);box-shadow:3px 4px 0 #0001}.shelf{min-height:210px;display:flex;align-items:end;justify-content:space-evenly;gap:9px;padding:22px 9px 0;background:linear-gradient(90deg,#9e704e,#c99d74 12%,#c99d74 88%,#986744);border-bottom:17px solid #6c422b;box-shadow:inset 0 10px 15px #0002}.book{flex:1;max-width:135px;min-width:0;height:174px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:15px 5px 12px;background:var(--book);border:0;border-left:8px solid #0002;border-radius:4px 8px 3px 3px;box-shadow:4px 0 0 #0002;color:#fff;cursor:pointer;text-shadow:0 1px 2px #0005;transition:transform .2s}.book:nth-child(2){height:190px}.book:nth-child(3){height:165px}.book:nth-child(4){height:185px}.book:nth-child(5){height:176px}.book:hover,.book:focus-visible{transform:translateY(-9px)}.book small{font-size:10px;letter-spacing:.1em}.book strong{font-size:clamp(12px,2.5vw,17px);writing-mode:vertical-rl;letter-spacing:.08em}.case-bottom{height:65px;background:#b98a63;display:flex;justify-content:center;align-items:center;color:#f9e8d1;letter-spacing:.2em;font-size:12px}.overlay{position:fixed;inset:0;background:#241c17b9;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.overlay.open{display:flex}.opened{background:#fffdf5;max-width:700px;width:100%;max-height:88vh;overflow:auto;border:9px solid #dfd2b9;box-shadow:12px 12px 0 #1d130c44;padding:25px;position:relative;animation:openbook .3s ease-out}.opened h2{font-size:clamp(24px,5vw,36px);margin:5px 0 8px}.opened .chapter{font-size:12px;letter-spacing:.2em;color:#8a6a56}.opened ul{padding-left:22px}.opened li{padding:8px 0;border-bottom:1px dashed #ccc}.opened li a{text-decoration:none}.close{position:absolute;right:12px;top:10px;border:0;background:#e9e1d4;border-radius:50%;width:38px;height:38px;font-size:23px;cursor:pointer}.opened .hint{font-size:12px;color:#786f64}.guide-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.guide-links a{padding:10px;background:#eee8dc;border-radius:5px;font-size:13px}@keyframes openbook{from{opacity:.4;transform:perspective(700px) rotateY(-13deg) scale(.9)}to{opacity:1;transform:none}}@media(max-width:550px){.case{border-width:9px;border-bottom-width:15px;padding:0 6px 9px}.top-shelf{min-height:143px}.top-note{font-size:11px;max-width:145px;padding:8px}.plush-face{width:68px;height:64px}.plush-body{width:48px;height:34px}.shelf{gap:5px;min-height:190px;padding:18px 4px 0}.book{height:150px;padding:10px 1px}.book:nth-child(2){height:164px}.book:nth-child(3){height:144px}.book:nth-child(4){height:160px}.book:nth-child(5){height:152px}.book strong{font-size:12px}.book small{font-size:8px}.opened{padding:18px 13px}.intro{padding-top:8px}}
.sticky-notes{display:flex;flex-wrap:wrap;gap:9px;align-items:center;justify-content:center;padding:15px 6px 18px;background:#d9b38c;border-bottom:12px solid #815438}.sticky{position:relative;flex:1 1 135px;max-width:185px;min-height:86px;border:0;border-radius:1px;background:var(--paper);padding:12px 9px 10px;box-shadow:3px 5px 6px #573b2740;cursor:pointer;text-align:left;transform:rotate(var(--tilt));transition:transform .18s}.sticky:before{content:"";position:absolute;top:0;left:0;right:0;height:13px;background:#ffffff50}.sticky:hover,.sticky:focus-visible{transform:rotate(0deg) translateY(-5px)}.sticky small{display:block;color:#705d49;font-size:10px;margin-bottom:5px}.sticky strong{display:block;color:#352e27;font-size:13px;line-height:1.4}.note-heading{font-size:11px;font-weight:700;color:#fff9e8;letter-spacing:.1em;background:#815438;padding:7px 10px}.note-intro{text-align:center;font-size:12px;color:#fff9e8;background:#815438;padding:7px}.top-note{display:none}@media(max-width:550px){.sticky-notes{gap:9px;padding:12px 5px}.sticky{flex-basis:42%;min-height:78px;padding:10px 8px}.sticky strong{font-size:12px}}.library-board{background:#b98a63;border:11px solid #71472f;border-radius:12px;margin:5px 0 22px;padding:18px 15px 12px;box-shadow:0 10px 0 #d5c0a9,inset 0 8px 15px #0002}.search-paper{position:relative;max-width:650px;margin:auto;background:repeating-linear-gradient(to bottom,#fffaf0 0,#fffaf0 31px,#d9e2dc 32px);border:1px solid #d2bc98;padding:24px 22px 19px;box-shadow:6px 7px 0 #0002;transform:rotate(-.7deg)}.search-paper:before{content:"";position:absolute;top:-10px;left:45%;width:58px;height:22px;background:#e5d7acb9;transform:rotate(3deg)}.search-paper h2{font-size:clamp(20px,4vw,29px);margin:7px 0 4px}.search-paper p{margin:0;color:#796b5c;font-size:13px}.search-paper .search{max-width:none;margin:15px 0 0}.search-paper .search input{background:#fffef8;border:0;border-bottom:2px solid #b2a189;border-radius:0}.search-paper .search button{background:#69503c}.paper-meta{font-size:10px;letter-spacing:.12em;color:#917c63;display:flex;justify-content:space-between}.paper-foot{text-align:right;font-size:10px;color:#917c63;margin-top:12px}.board-ledge{height:11px;background:#6c422b;margin:12px -15px -12px}.library-caption{font-size:12px;text-align:center;color:#69594b;margin:0 0 14px}.sticky{clip-path:polygon(0 0,100% 0,100% 86%,88% 100%,0 100%);box-shadow:none!important;filter:drop-shadow(4px 5px 2px #0003);background:linear-gradient(155deg,var(--paper) 0%,var(--paper) 82%,#ffffff99 100%)}.sticky:after{content:"";position:absolute;bottom:0;right:0;width:13%;height:14%;background:#00000016;clip-path:polygon(0 0,0 100%,100% 0)}.sticky-notes{background:repeating-linear-gradient(90deg,#d5aa81,#d5aa81 14px,#d1a47a 15px)}@media(max-width:550px){.library-board{padding:14px 10px 10px;border-width:8px}.search-paper{padding:19px 12px 13px}.search-paper .search input{font-size:14px;padding:10px 5px}.board-ledge{margin:12px -10px -10px}}</style></head><body><header><a href="./index.html">サロンページへ</a><a href="./ninaguide-blank.html">文字だけのプレビュー</a></header><main><div class="intro"><small>NINA GUIDE LIBRARY</small><h1>ニナガイドの本棚</h1><p>知りたいことを、一冊ずつ。</p></div><div class="library-board"><div class="search-paper"><div class="paper-meta"><span>✎ 調べものメモ</span><span>NINA GUIDE / 001</span></div><h2>何をお探しですか？</h2><p>知りたいことを、この紙に書いてみてね。</p><form class="search" id="search"><input id="q" type="search" placeholder="知りたいキーワードを入力"><button>探す</button></form><div class="paper-foot">SEARCH THE LIBRARY</div></div><div class="board-ledge"></div></div><p class="library-caption">↓ スクロールすると、本や付箋が並んでいます</p><div class="case"><div class="top-shelf"><button class="plush" id="plush" aria-label="ミトコンドリアちゃんの案内を開く"><span class="plush-label">タップして相談</span><span class="plush-face">•ᴗ•</span><span class="plush-body"></span></button><div class="top-note">どの本を読めばいいか迷ったら、ぬいぐるみをタップしてね。</div></div><div class="note-heading">✎ こんなことが気になったら、付箋をタップ</div><div class="sticky-notes"><button class="sticky" style="--paper:#f7df97;--tilt:-3deg" data-note="register"><small>はじめての方</small><strong>登録ってどうするの？</strong></button><button class="sticky" style="--paper:#d7eddb;--tilt:2deg" data-note="delivery"><small>毎月のお買い物</small><strong>商品はいつ届く？</strong></button><button class="sticky" style="--paper:#f5cad1;--tilt:-2deg" data-note="bonus"><small>気になるお金</small><strong>ボーナスってもらえる？</strong></button><button class="sticky" style="--paper:#d9d9f1;--tilt:3deg" data-note="change"><small>困ったとき</small><strong>手続きを変更したい！</strong></button></div><div class="shelf" id="shelf"><button class="book" style="--book:#ba655b" data-id="a"><small>BOOK 01</small><strong>新規登録</strong><small>はじめての方</small></button><button class="book" style="--book:#648a86" data-id="b"><small>BOOK 02</small><strong>定期購入</strong><small>毎月のこと</small></button><button class="book" style="--book:#a88043" data-id="c"><small>BOOK 03</small><strong>ボーナス</strong><small>仕組みと条件</small></button><button class="book" style="--book:#74799a" data-id="d"><small>BOOK 04</small><strong>手続き・申請</strong><small>各種お手続き</small></button><button class="book" style="--book:#aa7e89" data-id="e"><small>BOOK 05</small><strong>困ったとき</strong><small>よくある質問</small></button></div><div class="case-bottom">NINA GUIDE　・　MINAMI KUMAMOTO</div></div><p style="text-align:center;font-size:12px;color:#776d61;margin-top:30px">これは本棚の操作感を試すための別プレビューです。既存ページは変更していません。</p></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="本の内容"><div class="opened"><button class="close" id="close" aria-label="閉じる">×</button><div id="content"></div></div></div><script>
const books={a:{n:"01",title:"新規登録",lead:"はじめてのニナファーム。登録方法から順番に。",items:[["登録方法を比較","guide-a-compare.html"],["WEB登録の流れ","guide-a-web.html"],["郵送登録の流れ","guide-a-paper.html"],["初回費用","guide-a-cost.html"]]},b:{n:"02",title:"定期購入",lead:"毎月の商品購入について、気になることを調べよう。",items:[["毎月の商品購入","guide-b-cost.html"],["お届けスケジュール","guide-b-schedule.html"],["お支払い方法","guide-b-payment.html"],["締め日について","guide-b-deadline.html"],["定期購入の停止","guide-b-stop.html"]]},c:{n:"03",title:"ボーナス",lead:"ボーナスの仕組みやタイトルの条件を知ろう。",items:[["基本条件","guide-c-basic.html"],["ボーナスプラン","guide-c-bonus.html"],["タイトル昇格条件","guide-c-title.html"],["ボーナス診断","check.html"]]},d:{n:"04",title:"手続き・申請",lead:"必要な手続きへの入口。",items:[["各種手続き","guide-d.html"]]},e:{n:"05",title:"困ったとき",lead:"わからないことがあったら、ここから。",items:[["よくある困りごと","guide-e.html"]]}};
const overlay=document.getElementById("overlay"),content=document.getElementById("content");function show(html){content.innerHTML=html;overlay.classList.add("open");document.getElementById("close").focus()}function openBook(id){const b=books[id];show('<div class="chapter">BOOK '+b.n+' / NINA GUIDE</div><h2>'+b.title+'の本</h2><p>'+b.lead+'</p><hr><h3>もくじ</h3><ul>'+b.items.map(x=>'<li><a href="./'+x[1]+'">'+x[0]+'　→</a></li>').join("")+'</ul><p class="hint">項目をタップすると現在のガイドページへ進みます。</p>')}document.querySelectorAll(".book").forEach(b=>b.addEventListener("click",()=>openBook(b.dataset.id)));const notes={register:{title:"登録ってどうするの？",book:"a",link:"guide-a-compare.html",label:"WEBと郵送を比べる"},delivery:{title:"商品はいつ届く？",book:"b",link:"guide-b-schedule.html",label:"お届けスケジュールを見る"},bonus:{title:"ボーナスってもらえる？",book:"c",link:"guide-c-basic.html",label:"ボーナスの基本条件を見る"},change:{title:"手続きを変更したい！",book:"d",link:"guide-d.html",label:"手続き・申請を見る"}};document.querySelectorAll("[data-note]").forEach(el=>el.addEventListener("click",()=>{const n=notes[el.dataset.note];show('<div class="chapter">STICKY NOTE / 知りたいこと</div><h2>'+n.title+'</h2><p>この疑問は「'+books[n.book].title+'」の本にあります。</p><div class="guide-links"><a href="./'+n.link+'">'+n.label+' →</a><button class="back" onclick="openBook(\''+n.book+'\')">本の目次を開く</button></div><p class="hint">※仮のリンク先です。今後、実際のガイド内容に合わせて調整します。</p>')}));document.getElementById("plush").addEventListener("click",()=>show('<div class="chapter">GUIDE / 相談コーナー</div><h2>ミトコンドリアちゃんの案内</h2><p>どこから調べたらいいか迷ったら、質問に答えながら進めます。</p><p>※ぬいぐるみは仮デザインです。</p><div class="guide-links"><a href="./guide-a-compare.html">登録方法を一緒に選ぶ →</a><a href="./check.html">ボーナス診断へ →</a></div>'));document.getElementById("close").addEventListener("click",()=>overlay.classList.remove("open"));overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.classList.remove("open")});document.addEventListener("keydown",e=>{if(e.key==="Escape")overlay.classList.remove("open")});document.getElementById("search").addEventListener("submit",e=>{e.preventDefault();const q=document.getElementById("q").value.trim();if(!q)return;const matches=Object.entries(books).flatMap(([id,b])=>b.items.filter(x=>(b.title+x[0]).includes(q)).map(x=>({id,item:x})));if(!matches.length){show('<h2>検索結果</h2><p>「'+q.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))+'」に一致する目次はありませんでした。</p>');return}show('<div class="chapter">INDEX / 検索</div><h2>検索結果</h2><ul>'+matches.map(x=>'<li><a href="./'+x.item[1]+'">'+books[x.id].title+' ／ '+x.item[0]+' →</a></li>').join("")+'</ul>')});
</script></body></html>
