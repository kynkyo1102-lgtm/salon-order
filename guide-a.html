  <link rel="stylesheet" href="common.css">

  <style>
    /* =========================================================
       Aページ：登録案内メニュー
       ========================================================= */

    .guide-menu {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .guide-menu-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 220px;
      padding: 26px 24px 23px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;
    }

    .guide-menu-card:hover {
      transform: translateY(-2px);
      border-color: rgba(27, 78, 168, 0.28);
      box-shadow: 0 6px 18px rgba(18, 55, 120, 0.10);
    }

    .guide-menu-icon {
      width: 58px;
      height: 58px;
      margin-bottom: 20px;
      color: var(--primary);
      flex-shrink: 0;
    }

    .guide-menu-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .guide-menu-title {
      color: var(--primary-dark);
      font-size: 1.12rem;
      font-weight: 800;
      line-height: 1.45;
      margin-bottom: 8px;
    }

    .guide-menu-desc {
      color: #687386;
      font-size: 0.84rem;
      line-height: 1.7;
      flex: 1;
    }

    .guide-menu-arrow {
      align-self: flex-end;
      margin-top: 16px;
      color: var(--primary);
      font-size: 1.25rem;
      line-height: 1;
      font-weight: 700;
    }

    /* スマートフォン */
    @media (max-width: 700px) {
      .guide-menu {
        grid-template-columns: 1fr;
        gap: 13px;
      }

      .guide-menu-card {
        min-height: 0;
        padding: 21px 19px 19px;
      }

      .guide-menu-icon {
        width: 50px;
        height: 50px;
        margin-bottom: 15px;
      }

      .guide-menu-title {
        font-size: 1.02rem;
      }

      .guide-menu-desc {
        font-size: 0.81rem;
      }
    }
  </style>
</head>
