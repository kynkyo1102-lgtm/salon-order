<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会員番号 事前登録</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #f7f4ee;
      color: #2b2019;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px;
    }
    h1 {
      font-size: 1.1rem;
      border-bottom: 2px solid #c8a261;
      padding-bottom: 8px;
      color: #231610;
    }
    .card {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #e5dac9;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #e5dac9;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #231610;
      color: #e6cb96;
      border: 1px solid #c8a261;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: #fff;
      padding: 10px 12px;
      border: 1px solid #e5dac9;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
    }
    .btn-del {
      background: none;
      border: none;
      color: #c94b4b;
      font-weight: bold;
      cursor: pointer;
      width: auto;
      padding: 0;
    }
  </style>
</head>
<body>

  <h1>👤 会員番号 事前登録ページ</h1>
  <p style="font-size: 0.78rem; color: #78695f;">ここで登録しておくと、注文画面でプルダウンから選択できるようになります。</p>

  <div class="card">
    <div class="form-group">
      <label>会員番号（主番 5〜7桁など） *</label>
      <input type="text" id="regMain" placeholder="例: 1267505">
    </div>
    <div class="form-group">
      <label>枝番（2桁） *</label>
      <input type="text" id="regSub" placeholder="例: 06" value="00">
    </div>
    <div class="form-group">
      <label>お名前（任意・自動入力用）</label>
      <input type="text" id="regName" placeholder="例: 杉本 景香">
    </div>
    <button type="button" onclick="addMember()">＋ この会員を登録</button>
  </div>

  <h2>📋 登録済み一覧</h2>
  <ul id="memberList"></ul>

  <div style="margin-top: 20px; text-align: center;">
    <a href="./test.html" style="color: #4a3222; font-size: 0.85rem; font-weight: bold;">← 注文書画面に戻る</a>
  </div>

  <script>
    function getMembers() {
      return JSON.parse(localStorage.getItem('salonPresetMembers') || '[]');
    }

    function saveMembers(list) {
      localStorage.setItem('salonPresetMembers', JSON.stringify(list));
      renderList();
    }

    function addMember() {
      const main = document.getElementById('regMain').value.trim();
      const sub = document.getElementById('regSub').value.trim();
      const name = document.getElementById('regName').value.trim();

      if (!main) {
        alert('会員番号を入力してください');
        return;
      }

      const list = getMembers();
      const fullId = main + '-' + String(sub).padStart(2, '0');
      
      // 重複チェック
      if (list.some(m => m.fullId === fullId)) {
        alert('この会員番号は既に登録されています');
        return;
      }

      list.push({ main, sub: String(sub).padStart(2, '0'), fullId, name });
      saveMembers(list);

      document.getElementById('regMain').value = '';
      document.getElementById('regName').value = '';
      alert('登録しました！');
    }

    function removeMember(index) {
      const list = getMembers();
      list.splice(index, 1);
      saveMembers(list);
    }

    function renderList() {
      const list = getMembers();
      const ul = document.getElementById('memberList');
      ul.innerHTML = '';

      if (list.length === 0) {
        ul.innerHTML = '<li style="color:#78695f;">登録されている会員はありません</li>';
        return;
      }

      list.forEach((m, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div>
            <strong>${m.fullId}</strong> ${m.name ? `(${m.name})` : ''}
          </div>
          <button class="btn-del" onclick="removeMember(${idx})">削除</button>
        `;
        ul.appendChild(li);
      });
    }

    window.addEventListener('DOMContentLoaded', renderList);
  </script>
</body>
</html>
