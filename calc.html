<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サロン商品 発注サポートツール</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 計算ツール用の補助スタイル */
    .plan-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .plan-card.best {
      border: 1.5px solid var(--accent-gold);
      background: linear-gradient(180deg, #ffffff 0%, #fcfaf5 100%);
    }
    .plan-title {
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: var(--wood-medium);
    }
    .split-container {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .split-col {
      flex: 1;
      background: #fffdf9;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }
    .product-list-box {
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      padding: 6px;
      margin-bottom: 14px;
      background: #fff;
      border-radius: 8px;
    }
    .product-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      border-bottom: 1px dashed var(--border-color);
      transition: background 0.2s;
    }
    .product-item:last-child {
      border-bottom: none;
    }
    .product-item.selected {
      background-color: rgba(200, 162, 97, 0.12);
      font-weight: bold;
    }
    .product-item input {
      width: 70px;
      margin-bottom: 0;
      text-align: center;
    }
    .result-box {
      background-color: #fffdf9;
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 8px;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-logo">Salon Order</div>
    <h1>サロン商品 発注サポートツール</h1>
  </header>

  <main>
    <!-- 機能1: 最適目標PT計算 -->
    <div class="card-box">
      <div class="section-title">1. 目標PTに対する最適組み合わせ計算</div>
      
      <div class="form-group">
        <label>対象月度</label>
        <select id="monthSelect"></select>
      </div>

      <div class="form-group">
        <label>目標ポイント（例: 10000, 200000）</label>
        <input type="number" id="targetPt" value="10000" step="1000">
      </div>

      <button class="btn-copy" onclick="calculateBestCombos()">3つのパターンを提案</button>

      <div id="comboResult" class="result-box" style="display:none;"></div>
    </div>

    <!-- 機能2: 左右均等バイナリー分配 -->
    <div class="card-box">
      <div class="section-title">2. 購入商品の左右バランス分配</div>
      <p class="usage-guide">購入する個数を指定してください（1個以上で背景がハイライトされます）。</p>
      
      <div id="productQtyList" class="product-list-box">
        <!-- JSで動的生成 -->
      </div>

      <button class="btn-copy" onclick="calculateBinarySplit()">左右均等に割り振り</button>

      <div id="splitResult" class="result-box" style="display:none;">
        <div class="split-container">
          <div class="split-col">
            <h3 style="margin-top:0; color:var(--wood-dark); font-size:0.9rem; border-bottom:2px solid var(--accent-gold); padding-bottom:4px;">左グループ (L)</h3>
            <ul id="leftList" style="padding-left:18px; font-size:0.82rem; margin:8px 0;"></ul>
            <hr style="border:none; border-top:1px dashed var(--border-color);">
            <p style="font-size:0.82rem; margin:4px 0;">PT合計: <strong id="leftTotalPt">0</strong> PT</p>
            <p style="font-size:0.82rem; margin:4px 0;">金額合計: <strong id="leftTotalCost">0</strong> 円</p>
          </div>
          <div class="split-col">
            <h3 style="margin-top:0; color:var(--wood-dark); font-size:0.9rem; border-bottom:2px solid var(--accent-gold); padding-bottom:4px;">右グループ (R)</h3>
            <ul id="rightList" style="padding-left:18px; font-size:0.82rem; margin:8px 0;"></ul>
            <hr style="border:none; border-top:1px dashed var(--border-color);">
            <p style="font-size:0.82rem; margin:4px 0;">PT合計: <strong id="rightTotalPt">0</strong> PT</p>
            <p style="font-size:0.82rem; margin:4px 0;">金額合計: <strong id="rightTotalCost">0</strong> 円</p>
          </div>
        </div>
        <div style="margin-top:14px; padding-top:10px; border-top:1.5px solid var(--accent-gold); font-size:0.9rem; text-align:center;">
          左右のPT差: <strong id="ptDiff" style="color:#c94b4b;">0</strong> PT<br>
          合計金額: <strong id="grandTotalCost" style="color:var(--wood-dark); font-size:1.05rem;">0</strong> 円
        </div>
      </div>
    </div>
  </main>

  <footer>
    &copy; Salon Order Support System
  </footer>

  <script>
    let configData = null;

    async function loadConfig() {
      try {
        const res = await fetch('month_config.json');
        configData = await res.json();
        
        const monthSelect = document.getElementById('monthSelect');
        configData.activeMonths.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m;
          monthSelect.appendChild(opt);
        });

        renderProductQtyList();
      } catch (e) {
        alert('month_config.json の読み込みに失敗しました。');
      }
    }

    function renderProductQtyList() {
      const month = document.getElementById('monthSelect').value;
      const container = document.getElementById('productQtyList');
      container.innerHTML = '';

      configData.products.forEach((p, index) => {
        if (p.name === 'リペアセラム') return;

        const pt = p.pts[month] || 0;
        const div = document.createElement('div');
        div.className = 'product-item';
        div.id = `item-row-${index}`;
        div.innerHTML = `
          <span style="font-size:0.85rem;">
            <strong>${p.name}</strong><br>
            <small style="color:var(--text-sub);">${p.price.toLocaleString()}円 / ${pt.toLocaleString()}PT</small>
          </span>
          <input type="number" class="prod-qty" data-index="${index}" min="0" value="0" onchange="highlightSelected(${index})">
        `;
        container.appendChild(div);
      });
    }

    function highlightSelected(index) {
      const row = document.getElementById(`item-row-${index}`);
      const input = row.querySelector('.prod-qty');
      if (parseInt(input.value) > 0) {
        row.classList.add('selected');
      } else {
        row.classList.remove('selected');
      }
    }

    // 機能1: 最適目標PT計算
    function calculateBestCombos() {
      const targetPt = parseInt(document.getElementById('targetPt').value) || 0;
      const month = document.getElementById('monthSelect').value;

      const validProducts = configData.products
        .filter(p => p.name !== 'リペアセラム')
        .map(p => ({ name: p.name, price: p.price, pt: p.pts[month] || 0 }))
        .filter(p => p.pt > 0);

      if (validProducts.length < 2 || targetPt <= 0) return;

      let bestPlan = findOptimalMultiCombo(validProducts, targetPt);

      let mainProd = validProducts.find(p => p.name === 'OX-288' || p.name === 'ボアソン') || validProducts[0];
      let planA = createMainProdCombo(validProducts, mainProd, targetPt);

      let subProd = validProducts.find(p => p.name !== mainProd.name) || validProducts[1];
      let planB = createMainProdCombo(validProducts, subProd, targetPt);

      let plans = [
        {
          title: "★【最優先】おすすめ組み合わせ",
          items: bestPlan.items,
          totalPt: bestPlan.totalPt,
          totalCost: bestPlan.totalCost,
          isBest: true
        },
        {
          title: "【パターンA】定番・主力商品ベース",
          items: planA.items,
          totalPt: planA.totalPt,
          totalCost: planA.totalCost,
          isBest: false
        },
        {
          title: "【パターンB】別商品バリエーション",
          items: planB.items,
          totalPt: planB.totalPt,
          totalCost: planB.totalCost,
          isBest: false
        }
      ];

      const resDiv = document.getElementById('comboResult');
      resDiv.style.display = 'block';
      let html = '';

      plans.forEach((plan) => {
        let displayItems = formatItemsWithSamePrice(plan.items, validProducts);

        html += `
          <div class="plan-card ${plan.isBest ? 'best' : ''}">
            <div class="plan-title">${plan.title}</div>
            <ul style="margin: 6px 0; padding-left: 20px; font-size:0.85rem;">
              ${displayItems.map(i => `<li>${i.displayName} × ${i.count}個 (${(i.pt * i.count).toLocaleString()} PT / ${(i.price * i.count).toLocaleString()}円)</li>`).join('')}
            </ul>
            <div style="font-size:0.88rem; margin-top:8px; border-top:1px dashed var(--border-color); padding-top:6px;">
              合計ポイント: <strong>${plan.totalPt.toLocaleString()} PT</strong> 
              <span style="color:#c94b4b; font-size:0.8rem;">(超過: +${(plan.totalPt - targetPt).toLocaleString()} PT)</span><br>
              合計金額: <strong style="color:var(--wood-dark);">${plan.totalCost.toLocaleString()} 円</strong>
            </div>
          </div>
        `;
      });

      resDiv.innerHTML = html;
    }

    function findOptimalMultiCombo(products, target) {
      const maxPt = Math.max(...products.map(p => p.pt));
      const limit = target + maxPt;

      let dp = new Array(limit + 1).fill(Infinity);
      let parent = new Array(limit + 1).fill(null);
      dp[0] = 0;

      for (let i = 0; i < products.length; i++) {
        const p = products[i];
        for (let j = p.pt; j <= limit; j++) {
          if (dp[j - p.pt] !== Infinity) {
            if (dp[j - p.pt] + p.price < dp[j]) {
              dp[j] = dp[j - p.pt] + p.price;
              parent[j] = { prev: j - p.pt, prod: p };
            }
          }
        }
      }

      for (let pt = target; pt <= limit; pt++) {
        if (dp[pt] !== Infinity) {
          let counts = {};
          let curr = pt;
          while (curr > 0 && parent[curr]) {
            let pName = parent[curr].prod.name;
            counts[pName] = counts[pName] || { ...parent[curr].prod, count: 0 };
            counts[pName].count++;
            curr = parent[curr].prev;
          }
          let items = Object.values(counts);
          if (items.length >= 2) {
            return { items, totalPt: pt, totalCost: dp[pt] };
          }
        }
      }

      let baseProd = products[0];
      let subProd = products[1];
      let count1 = Math.max(1, Math.floor((target - subProd.pt) / baseProd.pt));
      let remPt = Math.max(0, target - (baseProd.pt * count1));
      let count2 = Math.ceil(remPt / subProd.pt);

      let items = [
        { ...baseProd, count: count1 },
        { ...subProd, count: count2 }
      ];
      let totalPt = (baseProd.pt * count1) + (subProd.pt * count2);
      let totalCost = (baseProd.price * count1) + (subProd.price * count2);

      return { items, totalPt, totalCost };
    }

    function createMainProdCombo(products, mainProd, target) {
      let subProducts = products.filter(p => p.name !== mainProd.name);
      let mainCount = Math.floor(target / mainProd.pt);
      
      if (mainCount === 0) mainCount = 1;
      let remPt = target - (mainProd.pt * mainCount);

      if (remPt <= 0) {
        mainCount = Math.max(1, mainCount - 1);
        remPt = target - (mainProd.pt * mainCount);
      }

      let subCombo = findOptimalMultiCombo(subProducts, remPt);
      let items = [{ ...mainProd, count: mainCount }];

      subCombo.items.forEach(si => {
        items.push(si);
      });

      let totalPt = items.reduce((sum, i) => sum + (i.pt * i.count), 0);
      let totalCost = items.reduce((sum, i) => sum + (i.price * i.count), 0);

      return { items, totalPt, totalCost };
    }

    function formatItemsWithSamePrice(items, allValidProducts) {
      return items.map(item => {
        let sameSpecProducts = allValidProducts.filter(p => p.pt === item.pt && p.price === item.price && p.name !== item.name);
        if (sameSpecProducts.length > 0) {
          let altNames = sameSpecProducts.map(p => p.name).join(' / ');
          return {
            ...item,
            displayName: `${item.name} （または ${altNames}）`
          };
        }
        return {
          ...item,
          displayName: item.name
        };
      });
    }

    // 機能2: 左右分配
    function calculateBinarySplit() {
      const month = document.getElementById('monthSelect').value;
      const inputs = document.querySelectorAll('.prod-qty');
      
      let allUnitItems = [];

      inputs.forEach(input => {
        const qty = parseInt(input.value) || 0;
        if (qty > 0) {
          const idx = input.getAttribute('data-index');
          const p = configData.products[idx];
          const pt = p.pts[month] || 0;
          for (let i = 0; i < qty; i++) {
            allUnitItems.push({ name: p.name, pt: pt, price: p.price });
          }
        }
      });

      if (allUnitItems.length === 0) {
        alert('商品を1つ以上（個数1以上）指定してください。');
        return;
      }

      allUnitItems.sort((a, b) => b.pt - a.pt);

      let left = [], right = [];
      let leftPt = 0, rightPt = 0;
      let leftCost = 0, rightCost = 0;

      allUnitItems.forEach(item => {
        if (leftPt <= rightPt) {
          left.push(item);
          leftPt += item.pt;
          leftCost += item.price;
        } else {
          right.push(item);
          rightPt += item.pt;
          rightCost += item.price;
        }
      });

      const summarize = (list) => {
        let map = {};
        list.forEach(i => {
          if (!map[i.name]) map[i.name] = { count: 0, pt: i.pt, price: i.price };
          map[i.name].count++;
        });
        return Object.keys(map).map(k => `<li>${k} × ${map[k].count}個 (${(map[k].pt * map[k].count).toLocaleString()}PT / ${(map[k].price * map[k].count).toLocaleString()}円)</li>`).join('');
      };

      document.getElementById('leftList').innerHTML = summarize(left);
      document.getElementById('rightList').innerHTML = summarize(right);
      
      document.getElementById('leftTotalPt').textContent = leftPt.toLocaleString();
      document.getElementById('leftTotalCost').textContent = leftCost.toLocaleString();
      
      document.getElementById('rightTotalPt').textContent = rightPt.toLocaleString();
      document.getElementById('rightTotalCost').textContent = rightCost.toLocaleString();

      document.getElementById('ptDiff').textContent = Math.abs(leftPt - rightPt).toLocaleString();
      document.getElementById('grandTotalCost').textContent = (leftCost + rightCost).toLocaleString();

      document.getElementById('splitResult').style.display = 'block';
    }

    document.getElementById('monthSelect').addEventListener('change', renderProductQtyList);
    window.onload = loadConfig;
  </script>
</body>
</html>
