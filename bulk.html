<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>南熊本サロン専用商品購入注文書</title>
  <style>
    :root {
      --primary-color: #007bff;
      --secondary-color: #17a2b8;
      --reset-color: #6c757d;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #dee2e6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      line-height: 1.5;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    h1, h2, h3 {
      text-align: center;
      margin-top: 0;
      color: #1a1a1a;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }

    .product-list {
      margin-top: 20px;
    }

    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .product-info {
      flex-grow: 1;
      padding-right: 10px;
    }

    .product-name {
      font-weight: bold;
      font-size: 15px;
    }

    .product-price {
      font-size: 13px;
      color: #666;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity-control input {
      width: 60px;
      text-align: center;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      margin-top: 15px;
      transition: background-color 0.2s;
    }

    .btn-primary { background-color: var(--primary-color); color: #fff; }
    .btn-secondary { background-color: var(--secondary-color); color: #fff; }
    .btn-reset { background-color: var(--reset-color); color: #fff; }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 14px;
    }

    .summary-table th, .summary-table td {
      border: 1px solid var(--border-color);
      padding: 8px;
      text-align: right;
    }

    .summary-table th {
      background-color: #f8f9fa;
      text-align: center;
    }

    .summary-table td:nth-child(1) {
      text-align: left;
    }

    .total-box {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 2px solid #333;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
    }

    .alert-box {
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin: 15px 0;
      line-height: 1.5;
      text-align: left;
    }

    .hidden { display: none; }
  </style>
  <!-- html2canvas & jspdf CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <div class="container">
    <h1>南熊本サロン専用商品購入注文書</h1>

    <!-- 入力フォームエリア -->
    <div id="input-section" class="card">
      <h2>注文情報入力</h2>
      
      <div class="form-group">
        <label for="member-id">会員番号</label>
        <input type="text" id="member-id" placeholder="例: 1267505-01">
      </div>

      <div class="form-group">
        <label for="member-name">お名前</label>
        <input type="text" id="member-name" placeholder="例: 杉本景香">
      </div>

      <h3>商品一覧</h3>
      <div id="product-container" class="product-list">
        <!-- JSで商品項目が動的に生成されます -->
      </div>

      <button type="button" class="btn btn-primary" onclick="addOrder()">この内容で追加・次へ</button>
    </div>

    <!-- 注文追加済みリスト -->
    <div id="added-orders-section" class="card hidden">
      <h3>現在の追加済み注文リスト</h3>
      <div id="added-orders-list"></div>
      <button type="button" class="btn btn-secondary" onclick="generateFinalSummary()">追加を完了して全体まとめを表示</button>
    </div>

    <!-- 全体まとめ控えエリア（画像保存・PDF対象） -->
    <div id="summary-section" class="card hidden">
      <div id="capture-area">
        <h2>全体まとめ控え</h2>
        <div id="summary-members-info" style="font-size: 14px; margin-bottom: 10px; color: #555;"></div>

        <table class="summary-table">
          <thead>
            <tr>
              <th>商品名（全体合計）</th>
              <th>総数量</th>
              <th>総合計(税込)</th>
            </tr>
          </thead>
          <tbody id="summary-table-body">
            <!-- 集計データ挿入位置 -->
          </tbody>
        </table>

        <div class="total-box">
          <span>全合算 総合計金額:</span>
          <span id="grand-total-price" style="color: #d9534f;">¥0</span>
        </div>
        <div class="total-box" style="border-top: none; font-size: 16px;">
          <span>全合算 総獲得ポイント:</span>
          <span id="grand-total-points" style="color: #0275d8;">0pt</span>
        </div>
      </div>

      <!-- 保存ができない場合のアラート注意書き（追加箇所） -->
      <div class="alert-box">
        <strong>⚠️ 画像・PDFが保存できない方へ</strong><br>
        iPhoneのSafariやアプリ内ブラウザ等をご利用の際、保存が実行されない場合があります。恐れ入りますが、画面上の<strong>「全体まとめ控え」領域をスクリーンショット</strong>してご活用ください。
      </div>

      <!-- アクションボタン群 -->
      <button type="button" class="btn btn-primary" onclick="saveAsImage()">💾 「全体まとめ控え」を画像保存</button>
      <button type="button" class="btn btn-secondary" onclick="saveAsPDF()">📄 全枚数をまとめて1つのPDFで保存</button>
      <button type="button" class="btn btn-reset" onclick="resetForm()">🔄最初の入力に戻る</button>
    </div>
  </div>

  <script>
    // 商品データ定義
    const products = [
      { id: 'p1', name: 'OX-288', price: 13800, point: 1000 },
      { id: 'p2', name: 'OX-288 (ゼリータイプ)', price: 14200, point: 1000 },
      { id: 'p3', name: 'アルピニスト スラージュ', price: 4000, point: 300 },
      { id: 'p4', name: 'Ｏ・Ｍ・Ｃ プロテイン', price: 6000, point: 500 }
    ];

    let orders = [];

    // 初期化：商品リストの描画
    function init() {
      const container = document.getElementById('product-container');
      container.innerHTML = '';
      products.forEach(p => {
        const itemHtml = `
          <div class="product-item">
            <div class="product-info">
              <div class="product-name">${p.name}</div>
              <div class="product-price">¥${p.price.toLocaleString()} (税込)</div>
            </div>
            <div class="quantity-control">
              <input type="number" id="qty-${p.id}" min="0" value="0" inputmode="numeric">
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', itemHtml);
      });
    }

    // 注文の追加
    function addOrder() {
      const memberId = document.getElementById('member-id').value.trim();
      const memberName = document.getElementById('member-name').value.trim();

      if (!memberId || !memberName) {
        alert('会員番号とお名前を入力してください。');
        return;
      }

      const currentItems = [];
      products.forEach(p => {
        const qty = parseInt(document.getElementById(`qty-${p.id}`).value) || 0;
        if (qty > 0) {
          currentItems.push({ ...p, quantity: qty });
        }
      });

      if (currentItems.length === 0) {
        alert('少なくとも1つの商品の数量を入力してください。');
        return;
      }

      orders.push({
        id: memberId,
        name: memberName,
        items: currentItems
      });

      updateAddedOrdersList();
      clearInputForm();
      document.getElementById('added-orders-section').classList.remove('hidden');
      alert(`${memberName} 様の注文を追加しました。`);
    }

    // 追加済みリストの表示更新
    function updateAddedOrdersList() {
      const listContainer = document.getElementById('added-orders-list');
      listContainer.innerHTML = '';
      orders.forEach((o, index) => {
        const orderSummary = o.items.map(i => `${i.name}×${i.quantity}`).join(', ');
        listContainer.insertAdjacentHTML('beforeend', `
          <div style="padding: 8px 0; border-bottom: 1px solid #ddd; font-size: 14px;">
            <strong>${index + 1}. ${o.name} 様 (${o.id})</strong><br>
            <span style="color: #666;">${orderSummary}</span>
          </div>
        `);
      });
    }

    // 入力フォームのクリア（連続入力用）
    function clearInputForm() {
      document.getElementById('member-id').value = '';
      document.getElementById('member-name').value = '';
      products.forEach(p => {
        document.getElementById(`qty-${p.id}`).value = '0';
      });
    }

    // 全体集計の生成
    function generateFinalSummary() {
      if (orders.length === 0) {
        alert('注文がまだ追加されていません。');
        return;
      }

      const aggregated = {};
      let grandTotal = 0;
      let grandPoints = 0;
      const memberNames = [];

      orders.forEach(o => {
        memberNames.push(`${o.name} 様 (${o.id})`);
        o.items.forEach(item => {
          if (!aggregated[item.id]) {
            aggregated[item.id] = { name: item.name, price: item.price, point: item.point, totalQty: 0 };
          }
          aggregated[item.id].totalQty += item.quantity;
        });
      });

      const tbody = document.getElementById('summary-table-body');
      tbody.innerHTML = '';

      Object.keys(aggregated).forEach(key => {
        const item = aggregated[key];
        const itemTotalPrice = item.price * item.totalQty;
        const itemTotalPoints = item.point * item.totalQty;

        grandTotal += itemTotalPrice;
        grandPoints += itemTotalPoints;

        tbody.insertAdjacentHTML('beforeend', `
          <tr>
            <td>${item.name}</td>
            <td>${item.totalQty}</td>
            <td>¥${itemTotalPrice.toLocaleString()}</td>
          </tr>
        `);
      });

      document.getElementById('summary-members-info').innerHTML = `<strong>対象会員一覧:</strong><br>${memberNames.join(' / ')}`;
      document.getElementById('grand-total-price').innerText = `¥${grandTotal.toLocaleString()}`;
      document.getElementById('grand-total-points').innerText = `${grandPoints.toLocaleString()}pt`;

      document.getElementById('summary-section').classList.remove('hidden');
      document.getElementById('summary-section').scrollIntoView({ behavior: 'smooth' });
    }

    // 画像保存処理 (html2canvas)
    function saveAsImage() {
      const captureArea = document.getElementById('capture-area');
      html2canvas(captureArea, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `サロン注文控え_全体まとめ.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(err => {
        alert('画像の保存に失敗しました。下の注意書きの通りスクショをお試しください。');
      });
    }

    // PDF保存処理 (jsPDF + html2canvas)
    function saveAsPDF() {
      const { jsPDF } = window.jspdf;
      const captureArea = document.getElementById('capture-area');

      html2canvas(captureArea, { scale: 2 }).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        const pdf = new jsPDF('p', 'mm', 'a4');
        const imgProps = pdf.getImageProperties(imgData);
        const pdfWidth = pdf.internal.pageSize.getWidth() - 20;
        const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

        pdf.addImage(imgData, 'PNG', 10, 10, pdfWidth, pdfHeight);
        pdf.save(`サロン注文控え_全体まとめ.pdf`);
      }).catch(err => {
        alert('PDFの作成に失敗しました。');
      });
    }

    // リセット処理
    function resetForm() {
      if (confirm('入力内容をすべてリセットして最初の画面に戻りますか？')) {
        orders = [];
        clearInputForm();
        document.getElementById('added-orders-list').innerHTML = '';
        document.getElementById('added-orders-section').classList.add('hidden');
        document.getElementById('summary-section').classList.add('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // ページロード時に初期化実行
    window.onload = init;
  </script>
</body>
</html>
