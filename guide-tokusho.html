<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>特商法クエスト｜ニナガイド</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b18;color:#f5f4ef;font-family:system-ui,"Noto Sans JP",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #f7dc72;outline-offset:3px}.back{position:fixed;top:12px;left:12px;z-index:10;color:#fff;text-decoration:none;background:#162542;padding:9px 13px;border:2px solid #8ba2cc;font-size:12px}.screen{min-height:100dvh;display:grid;place-items:center;padding:60px 14px 24px}.game{width:min(960px,100%);background:#101b33;border:5px solid #8a9bb8;box-shadow:0 0 0 5px #283e63,0 18px 60px #0008;padding:12px}.title{text-align:center;font-size:clamp(26px,6vw,54px);margin:6px 0 10px;letter-spacing:.12em;text-shadow:4px 4px #263f76}.subtitle{text-align:center;color:#c9b97a;font-size:13px;margin-bottom:10px}.hud{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:6px 3px 12px;flex-wrap:wrap}.map{position:relative;width:100%;aspect-ratio:3/2;background:#171627;overflow:hidden;border:4px solid #070c1a}.map>img{width:100%;height:100%;display:block}.player{position:absolute;width:6%;height:10%;object-fit:contain;transform:translate(-50%,-50%);filter:drop-shadow(2px 4px 1px #0009);transition:left .09s linear,top .09s linear}.marker{position:absolute;transform:translate(-50%,-50%);background:#f3d06a;color:#15203a;border:3px solid #7b4e2b;padding:4px 8px;font-size:12px;font-weight:900;box-shadow:3px 4px #0007;white-space:nowrap}.marker.done{background:#a1d8ac}.dialog{background:#0b1530;border:3px double #e8efff;padding:16px;margin-top:12px;min-height:108px;line-height:1.8;font-size:clamp(14px,2vw,18px)}.dialog strong{display:block;color:#f5d88b;font-size:13px;margin-bottom:5px}.choices{display:grid;gap:8px;margin-top:10px}.choices button,.primary{border:2px solid #96a8cb;background:#21365d;color:#fff;text-align:left;padding:12px 15px;font-weight:700}.choices button:hover,.primary:hover{background:#365b89}.choices button:disabled{opacity:.7}.feedback{padding:12px;background:#e7f1ff;color:#182a47;margin-top:10px;line-height:1.8}.feedback[hidden],.controls[hidden],.choices[hidden]{display:none}.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:12px}.controls button{min-width:48px;min-height:45px;border:2px solid #b6c9e9;background:#294a78;color:#fff;font-weight:900}.controls .action{background:#e4d39c;color:#142441;padding:0 15px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:#b9c9e0}.bottom button{background:none;color:#e7d19a;border:1px solid #8ca2c6;padding:8px}.notice{max-width:960px;margin:16px auto;color:#b5c2d7;font-size:12px;line-height:1.8}.notice a{color:#d5e6ff}@media(max-width:600px){.game{padding:7px;border-width:3px}.screen{padding:58px 9px 20px}.map{border-width:2px}.marker{font-size:9px;padding:2px 4px}.dialog{padding:10px;min-height:110px}.player{width:8%}.controls{gap:6px}.controls button{min-width:43px}.title{text-shadow:2px 2px #263f76}}
</style></head><body><a class="back" href="./ninaguide.html">← ニナガイドへ</a><main class="screen"><div><div class="game"><div class="subtitle">NINA GUIDE PRESENTS</div><h1 class="title">特商法クエスト</h1><div class="hud"><span id="stage">ダンジョン入口</span><span id="score">知識 0 / 8</span></div><div class="map" id="map"><img src="assets/tokusho-dungeon.svg" alt="石造りのダンジョン。宝箱や回廊、階段があるマップ"><img id="player" class="player" src="assets/tokusho-hero.svg" alt="勇者"></div><div class="dialog" id="dialog"><strong>ダンジョンの入口</strong>勇者よ、ここには紹介活動で知っておきたい8つの試練が眠っている。宝箱に近づいて調べよう！</div><div class="choices" id="choices"><button id="start">▶ ぼうけんを はじめる</button></div><div class="feedback" id="feedback" hidden></div><div class="controls" id="controls" hidden><button data-move="up" aria-label="上へ">▲</button><button data-move="left" aria-label="左へ">◀</button><button data-move="down" aria-label="下へ">▼</button><button data-move="right" aria-label="右へ">▶</button><button class="action" id="interact">しらべる</button></div><div class="bottom"><span>移動：矢印キー / WASD　調べる：Space</span><button id="reset">最初から</button></div></div><p class="notice">※本ゲームはニナガイドによる非公式の学習用コンテンツです。正解数は法令遵守を保証しません。会社の最新の概要書面・規約・公式案内を優先してください。<br>参考：ニナファームジャポン「特定商取引法」チラシ（2024年6月1日／Ver.1.9）。</p></div></main><script>
const quests=[["勧誘の目的", "友人を食事に誘ってから突然会員活動を勧めようとしている。どうする？", ["食事の席で初めて目的を伝える", "誘う前に会社名や勧誘目的を明確に伝える", "興味を示すまで商品名を伏せる"], 1, "勧誘に先立ち、会社名・氏名・商品種類・勧誘目的などを明確に伝えましょう。"], ["費用の説明", "費用や報酬を説明するとき、適切なのは？", ["利益だけを強調する", "負担や条件も含めて正確に説明する", "高額報酬の例だけを示す"], 1, "費用・条件・報酬の仕組みを正確に説明し、利益を保証する表現は避けます。"], ["断る意思", "相手が「興味ありません」と断ったら？", ["相手の意思を尊重して勧誘をやめる", "後日また繰り返し勧誘する", "別の人から勧めてもらう"], 0, "断る意思が示されたら、その意思を尊重しましょう。"], ["収入の表現", "収入の説明として適切なのは？", ["誰でも必ず稼げる", "登録すれば利益が確実", "報酬には条件があり、収入は保証されない"], 2, "収入を確約・誇張せず、報酬の発生条件と不確実性を伝えます。"], ["SNSの注意", "SNSで不特定多数に一斉に勧誘メッセージを送る前に？", ["会社のSNSルールを確認し、不特定多数への勧誘を避ける", "丁寧なら一斉送信してよい", "会社名を伏せて反応を見る"], 0, "会社独自のSNSルールも確認し、守りましょう。"], ["クーリング・オフ", "登録を考える人にクーリング・オフを聞かれたら？", ["説明せず登録を急がせる", "公式書面に沿って制度や手続きを説明する", "解約できないと伝える"], 1, "必要な書面の交付やクーリング・オフについて、公式資料に沿って正確に案内しましょう。"], ["迷惑な勧誘", "相手が迷っているとき、どうする？", ["長時間説得する", "都合と意思を尊重し、無理に勧めない", "今決めないと損だと強調する"], 1, "威圧的・執拗な勧誘は避け、相手の自由な判断を尊重しましょう。"], ["最終試練", "活動前に最後に確認するものは？", ["このゲームで満点なら十分", "口コミの情報だけ", "会社の最新の概要書面・規約・公式案内"], 2, "このゲームは非公式な学習用です。正式な条件は最新の会社公式資料を優先してください。"]];
// Events are placed along the visible central walkable route. The map is decorative; this prototype uses an explicit simplified movement zone.
const sites=[{x:50,y:82},{x:50,y:71},{x:50,y:60},{x:50,y:49},{x:50,y:39},{x:50,y:30},{x:50,y:22},{x:50,y:15}];
const map=document.getElementById('map'),player=document.getElementById('player'),choices=document.getElementById('choices'),dialog=document.getElementById('dialog'),feedback=document.getElementById('feedback'),controls=document.getElementById('controls'),stage=document.getElementById('stage'),scoreNode=document.getElementById('score');let state='title',step=0,score=0,x=50,y=92;function place(){player.style.left=x+'%';player.style.top=y+'%'}function message(who,body){dialog.replaceChildren();const strong=document.createElement('strong');strong.textContent=who;dialog.append(strong,document.createTextNode(body))}function btn(label,cb){const b=document.createElement('button');b.textContent=label;b.addEventListener('click',cb);choices.append(b)}function markers(){map.querySelectorAll('.marker').forEach(n=>n.remove());sites.forEach((p,i)=>{if(i<step)return;const m=document.createElement('span');m.className='marker';m.style.left=p.x+'%';m.style.top=p.y+'%';m.textContent=i===7?'★':'◆';m.setAttribute('aria-hidden','true');map.append(m)})}function begin(){state='walk';step=0;score=0;x=50;y=92;place();markers();controls.hidden=false;choices.hidden=true;feedback.hidden=true;stage.textContent='B1F / 試練 1';scoreNode.textContent='知識 0 / 8';message('ダンジョン','◆ の場所まで進み、「しらべる」を押そう。')}function walk(dx,dy){if(state!=='walk')return;x=Math.max(41,Math.min(59,x+dx*2));y=Math.max(13,Math.min(94,y+dy*2));place();if(near())message('宝箱','何かが眠っている。「しらべる」で試練に挑戦しよう。')}function near(){const p=sites[step];return p&&Math.hypot((x-p.x), (y-p.y))<7}function inspect(){if(state!=='walk')return;if(!near()){message('ダンジョン','まだ宝箱が遠い。◆ の場所まで近づこう。');return}state='quiz';controls.hidden=true;choices.hidden=false;const q=quests[step];message('第'+(step+1)+'の試練：'+q[0],q[1]);choices.replaceChildren();q[2].forEach((s,i)=>btn((i+1)+'．'+s,()=>answer(i)))}function answer(i){if(state!=='quiz')return;state='result';const q=quests[step],ok=i===q[3];if(ok)score++;scoreNode.textContent='知識 '+score+' / 8';feedback.hidden=false;feedback.textContent=(ok?'★ 正解！ 知識を手に入れた！':'答えを確認しよう。')+' '+q[4];[...choices.children].forEach(b=>b.disabled=true);btn(step===7?'▶ 冒険の結果へ':'▶ 次の試練へ',next)}function next(){feedback.hidden=true;step++;if(step===8){state='end';markers();message('冒険クリア！','8つの試練を突破した！ 正解 '+score+' / 8 問。活動前には必ず公式資料を確認しよう。');choices.replaceChildren();btn('▶ もう一度冒険する',begin);return}state='walk';markers();choices.hidden=true;controls.hidden=false;stage.textContent='B1F / 試練 '+(step+1);message('ダンジョン','次の◆へ進もう。知識を集めて最深部を目指そう。')}document.getElementById('start').addEventListener('click',begin);document.getElementById('reset').addEventListener('click',()=>{choices.hidden=false;begin()});document.getElementById('interact').addEventListener('click',inspect);document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>{const d=b.dataset.move;walk(d==='left'?-1:d==='right'?1:0,d==='up'?-1:d==='down'?1:0)}));document.addEventListener('keydown',e=>{if(state!=='walk'||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;const key=e.key.toLowerCase(),directions={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(directions[key]){e.preventDefault();walk(...directions[key])}else if(key===' '){e.preventDefault();inspect()}});place();
</script></body></html>
