<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>特商法クエスト｜ニナガイド</title>
<style>
:root{color-scheme:dark;--ink:#f7f0d9;--gold:#f5d27a;--blue:#17294b;--border:#879bc1}
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 25%,#263e69,#0b1227 70%);color:var(--ink);font-family:system-ui,"Noto Sans JP",sans-serif}
button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #f6d77b;outline-offset:4px}
.back{position:fixed;top:12px;left:12px;z-index:5;color:white;text-decoration:none;background:#10203fe8;border:1px solid #8ca6d2;padding:10px 13px;border-radius:7px;font-size:12px}
.wrap{min-height:100dvh;display:grid;place-items:center;padding:68px 12px 28px}
.shell{width:min(660px,100%);border:4px solid #7890b9;box-shadow:0 0 0 5px #172c51,0 18px 70px #0008;background:#101b35;padding:clamp(10px,2.5vw,20px);border-radius:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#d6dff3;font-size:12px;margin-bottom:12px}
.logo{font-size:11px;letter-spacing:.2em;color:#e6c87b}.progress{display:flex;gap:5px;margin:8px 0 15px}.progress span{flex:1;height:6px;background:#33476c;border-radius:10px}.progress span.done{background:#f1d17a}
.scene{position:relative;aspect-ratio:3/2;overflow:hidden;background:#141b2b;border:3px solid #354e77;border-radius:5px;isolation:isolate}
.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#050b1b33,#070d23aa);z-index:1}
.scene>img.map{position:absolute;width:100%;height:100%;object-fit:cover;display:block}
.scene .hero{position:absolute;z-index:2;left:50%;bottom:0;width:clamp(68px,24%,135px);height:64%;object-fit:contain;object-position:bottom;transform:translateX(-50%);filter:drop-shadow(0 7px 4px #000b)}
.scene .hero.side{left:27%;width:22%;height:56%}
.scene .npc{position:absolute;z-index:2;right:17%;bottom:16%;font-size:clamp(42px,12vw,76px);filter:drop-shadow(3px 5px #0009)}
.scene .glow{position:absolute;z-index:2;left:50%;top:17%;transform:translateX(-50%);font-size:clamp(35px,10vw,64px);filter:drop-shadow(0 0 16px #ffe39e)}
.scene .tag{position:absolute;z-index:3;top:12px;left:12px;background:#08162cdb;border:1px solid #c1a66c;padding:6px 10px;font-size:12px;letter-spacing:.08em}
.panel{margin-top:13px;border:2px solid #aabce1;background:#0b1630;padding:clamp(15px,3vw,23px);border-radius:6px;min-height:158px}
.speaker{color:var(--gold);font-size:12px;letter-spacing:.07em;font-weight:800;margin-bottom:10px}.line{font-size:clamp(16px,3.5vw,20px);line-height:1.85;white-space:pre-line;margin:0}
.options{display:grid;gap:10px;margin-top:15px}.option{border:2px solid #819bc7;background:#1d345c;color:white;border-radius:7px;text-align:left;padding:14px 15px;line-height:1.55;font-weight:700;min-height:50px}.option:hover{background:#2b4a7c}.option:disabled{opacity:.8;cursor:default}.option.correct{border-color:#e7d27e;background:#39513f}.option.wrong{border-color:#d78b8b;background:#553243}
.primary{display:block;width:100%;background:#f2d57e;color:#1c2940;border:2px solid #fff0bc;padding:15px;border-radius:7px;font-weight:900;margin-top:15px;box-shadow:0 4px #a37a35}.primary:hover{background:#ffe7a3}
.result{background:#172b49;border:1px solid #8ea9d2;padding:15px;margin-top:15px;border-radius:6px;line-height:1.8}.result strong{color:#ffe49b;display:block;margin-bottom:7px;font-size:20px}.result p{margin:0}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:15px;color:#b4c6e4;font-size:12px;gap:10px}.textbtn{background:none;border:0;color:#e9d18e;text-decoration:underline;padding:8px}
.notice{max-width:660px;margin:18px auto 0;color:#b9c6dd;font-size:11px;line-height:1.8}
[hidden]{display:none!important}
@media(max-width:500px){.wrap{padding:62px 9px 20px}.shell{border-width:3px;padding:9px}.scene{aspect-ratio:1.18}.scene>img.map{object-fit:cover}.panel{min-height:150px}.scene .hero{height:62%}}
@media(prefers-reduced-motion:no-preference){.panel{animation:appear .24s ease-out}@keyframes appear{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}}
</style></head><body>
<a class="back" href="./ninaguide.html">← ニナガイドへ</a>
<main class="wrap"><div><section class="shell" aria-label="特商法クエスト">
<div class="top"><span class="logo">NINA GUIDE QUEST</span><span id="counter">全8つの試練</span></div>
<div class="progress" id="progress" aria-label="クエストの進行状況"></div>
<div class="scene"><img class="map" src="assets/tokusho-dungeon.svg" alt="石造りのダンジョン"><span class="tag" id="sceneTag">QUEST START</span><span class="glow" id="glow">✦</span><img class="hero" id="hero" src="assets/tokusho-hero.svg" alt="赤い服の勇者"><span class="npc" id="npc" aria-hidden="true" hidden>📜</span></div>
<div class="panel" aria-live="polite"><div class="speaker" id="speaker">冒険のはじまり</div><p class="line" id="line"></p>
<div class="options" id="options"></div><div class="result" id="result" hidden></div><button class="primary" id="next"></button></div>
<div class="bottom"><span id="score">知識を身につけよう</span><button class="textbtn" id="restart">最初から</button></div>
</section><p class="notice">※本ゲームはニナガイドによる非公式の学習用コンテンツです。正解数は法令遵守を保証しません。会社の最新の概要書面・規約・公式案内を優先してください。<br>参考：ニナファームジャポン「特定商取引法」チラシ（2024年6月1日／Ver.1.9）。</p></div></main>
<script>
[["勧誘の目的", "友人を食事に誘ってから突然会員活動を勧めようとしている。どうする？", ["食事の席で初めて目的を伝える", "誘う前に会社名や勧誘目的を明確に伝える", "興味を示すまで商品名を伏せる"], 1, "勧誘に先立ち、会社名・氏名・商品種類・勧誘目的などを明確に伝えましょう。"], ["費用の説明", "費用や報酬を説明するとき、適切なのは？", ["利益だけを強調する", "負担や条件も含めて正確に説明する", "高額報酬の例だけを示す"], 1, "費用・条件・報酬の仕組みを正確に説明し、利益を保証する表現は避けます。"], ["断る意思", "相手が「興味ありません」と断ったら？", ["相手の意思を尊重して勧誘をやめる", "後日また繰り返し勧誘する", "別の人から勧めてもらう"], 0, "断る意思が示されたら、その意思を尊重しましょう。"], ["収入の表現", "収入の説明として適切なのは？", ["誰でも必ず稼げる", "登録すれば利益が確実", "報酬には条件があり、収入は保証されない"], 2, "収入を確約・誇張せず、報酬の発生条件と不確実性を伝えます。"], ["SNSの注意", "SNSで不特定多数に一斉に勧誘メッセージを送る前に？", ["会社のSNSルールを確認し、不特定多数への勧誘を避ける", "丁寧なら一斉送信してよい", "会社名を伏せて反応を見る"], 0, "会社独自のSNSルールも確認し、守りましょう。"], ["クーリング・オフ", "登録を考える人にクーリング・オフを聞かれたら？", ["説明せず登録を急がせる", "公式書面に沿って制度や手続きを説明する", "解約できないと伝える"], 1, "必要な書面の交付やクーリング・オフについて、公式資料に沿って正確に案内しましょう。"], ["迷惑な勧誘", "相手が迷っているとき、どうする？", ["長時間説得する", "都合と意思を尊重し、無理に勧めない", "今決めないと損だと強調する"], 1, "威圧的・執拗な勧誘は避け、相手の自由な判断を尊重しましょう。"], ["最終試練", "活動前に最後に確認するものは？", ["このゲームで満点なら十分", "口コミの情報だけ", "会社の最新の概要書面・規約・公式案内"], 2, "このゲームは非公式な学習用です。正式な条件は最新の会社公式資料を優先してください。"]]
const $=id=>document.getElementById(id);
let step=0,points=0,mode="intro",answered=false;
function progress(){ $("progress").replaceChildren();for(let i=0;i<quests.length;i++){const p=document.createElement("span");if(i<step||mode==="end")p.className="done";$("progress").append(p)}}
function setup({tag,speaker,line,npc="",heroSide=false,glow=false,counter=""}){$("sceneTag").textContent=tag;$("speaker").textContent=speaker;$("line").textContent=line;$("npc").hidden=!npc;$("npc").textContent=npc;$("hero").classList.toggle("side",heroSide);$("glow").hidden=!glow;$("counter").textContent=counter;$("options").replaceChildren();$("result").hidden=true;$("result").replaceChildren();$("next").hidden=false;progress()}
function intro(){step=0;points=0;mode="intro";$("score").textContent="知識を身につけよう";setup({tag:"PROLOGUE",speaker:"冒険のはじまり",line:"ここは、正しい紹介活動の知識を試すダンジョン。\n8つの試練を乗り越えて、知識の宝を手に入れよう！",glow:true,counter:"全8つの試練"});$("next").textContent="▶ クエストをはじめる"}
function quest(){mode="quiz";answered=false;const q=quests[step];setup({tag:"QUEST "+String(step+1).padStart(2,"0"),speaker:"第"+(step+1)+"の試練｜"+q[0],line:q[1],npc:step===7?"👑":step%3===0?"📜":step%3===1?"🧙":"💎",heroSide:true,counter:(step+1)+" / 8"});$("next").hidden=true;q[2].forEach((option,i)=>{const b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+i)+"．"+option;b.addEventListener("click",()=>answer(i));$("options").append(b)})}
function answer(i){if(answered)return;answered=true;mode="answer";const q=quests[step],ok=i===q[3];if(ok)points++;[...$("options").children].forEach((b,j)=>{b.disabled=true;if(j===q[3])b.classList.add("correct");else if(j===i)b.classList.add("wrong")});const title=document.createElement("strong");title.textContent=ok?"✦ 正解！":"正しい答えを確認しよう";const p=document.createElement("p");p.textContent=q[4];$("result").replaceChildren(title,p);$("result").hidden=false;$("score").textContent="正解 "+points+" / 8";$("next").hidden=false;$("next").textContent=step===7?"▶ 冒険の結果を見る":"▶ 次の試練へ"}
function end(){mode="end";setup({tag:"QUEST CLEAR",speaker:"8つの試練を突破！",line:"冒険クリア！\n正解 "+points+" / 8 問。\n学んだことを、相手を尊重した正確な説明に役立てよう。",glow:true,counter:"クリア！"});$("score").textContent="正解 "+points+" / 8";$("next").textContent="▶ もう一度挑戦する";const note=document.createElement("p");note.textContent="※このゲームの結果は、法令遵守の認定ではありません。実際の活動前に最新の公式資料を確認してください。";note.style.cssText="font-size:13px;line-height:1.8;color:#c7d6ee;margin:15px 0 0";$("options").append(note)}
$("next").addEventListener("click",()=>{if(mode==="intro")quest();else if(mode==="answer"){step++;if(step===quests.length)end();else quest()}else if(mode==="end")intro()});
$("restart").addEventListener("click",intro);intro();
</script></body></html>
