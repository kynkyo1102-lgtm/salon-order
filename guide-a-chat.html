<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ミトコンドリアちゃんと登録方法を選ぶ｜メンバーズガイド</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./guide-shared-chrome.css?v=20261026-1"><link rel="stylesheet" href="./guide-a-home-theme.css?v=20261027-3"></head><body class="registration-guide">
<main class="reg-chat"><div class="journey-kicker">MITOCHONDRIA GUIDE</div><h1>登録方法を一緒に選ぼう</h1><p class="lead">質問に答えながら、自分に合う登録方法を確認できます。</p>
<div class="journey-path" aria-label="登録までの流れ"><span>① 方法を選ぶ</span><i aria-hidden="true"></i><span>② 手順を確認</span><i aria-hidden="true"></i><span>③ 登録完了</span></div><section class="chat-panel" aria-label="会話形式の登録案内"><div class="chat-progress"><span id="stepLabel">はじめに</span><span id="stepCounter" aria-live="polite"></span></div><div class="chat-progress-bar"><div id="progressFill" class="chat-progress-fill" style="width:0"></div></div>
<div class="chat-message"><div class="chat-avatar" aria-hidden="true"><img src="./assets/mitochondria-chan.svg" alt="" width="85" height="128" style="display:block;width:100%;height:auto" loading="eager"><small>ミトコンドリアちゃん</small></div><div class="chat-bubble"><div id="message" aria-live="polite">こんにちは！登録方法を一緒に確認しましょう。</div></div></div>
<div id="answerHistory" class="chat-answers" hidden></div><div id="choices" class="chat-choices"></div><div id="paymentCostLink" class="chat-cost-link" hidden><span>初回の商品代金が気になる方へ</span><a href="./guide-a-cost.html">初回費用を確認する <span aria-hidden="true">↗</span></a></div><div id="result" hidden></div><div class="chat-controls"><button id="backBtn" type="button">← ひとつ戻る</button><button id="restartBtn" type="button">最初からやり直す</button></div></section>
<p class="chat-footnote">※この案内は現在のガイドの登録条件をもとにした簡易ナビゲーションです。実際のお手続きでは公式の概要書面・最新の条件をご確認ください。</p><div class="guide-links"><a href="./guide-a-compare.html">WEB登録と郵送登録の比較表を見る →</a></div></main>

<script>
(()=>{const $=id=>document.getElementById(id),history=[];const scenes={start:{label:"はじめに",text:"こんにちは！\nいくつか質問するね。あなたに合う登録方法を一緒に確認しよう！",options:[["案内をはじめる","payment"]]},payment:{label:"質問 1 / 3",text:"初回の商品代金は、クレジットカードで支払う予定ですか？",options:[["はい、クレジットカードで支払いたい","company"],["いいえ、銀行振込を考えている","paper"],["まだ決まっていない","unsure"]]},company:{label:"質問 2 / 3",text:"登録するのは個人ですか？ 法人ですか？",options:[["個人で登録する","device"],["法人で登録する","corporate"],["まだ決めていない","unsure"]]},device:{label:"質問 3 / 3",text:"スマホやパソコンで、メールを確認しながら入力できそう？",options:[["できそう！","web"],["少し不安がある","support"],["書類を見ながら進めたい","paper"]]},corporate:{label:"ご案内",text:"法人で登録する場合は、郵送登録の手順を確認してね。",result:"paper",reason:"現在のガイドでは、法人登録は郵送での手続きと案内されています。"},paper:{label:"ご案内",text:"郵送登録の手順をご案内するね！",result:"paper",reason:"申請書と初回商品代金の振込明細のコピーを郵送する方法です。"},web:{label:"ご案内",text:"WEB登録の手順をご案内するね！",result:"web",reason:"メールを確認しながら必要事項を入力し、初回代金をクレジットカードで支払う方法です。"},support:{label:"ご案内",text:"迷ったら、WEB登録と郵送登録の違いを比べてみよう！",result:"both",reason:"操作に不安がある場合は、紹介者などに確認しながら進めることもできます。"},unsure:{label:"ご案内",text:"まだ決まっていなくても大丈夫。まずは違いを見てみよう！",result:"both",reason:"支払い方法や個人・法人の区分を確認してから選びましょう。"}};let current="start";function render(){const s=scenes[current],isResult=!!s.result;$("paymentCostLink").hidden=current!=="payment";$("stepLabel").textContent=s.label;$("stepCounter").textContent=isResult?"結果":current==="start"?"":"全3問";$("progressFill").style.width=isResult?"100%":current==="start"?"0%":current==="payment"?"33%":current==="company"?"66%":"90%";$("message").textContent=s.text;$("choices").replaceChildren();$("result").replaceChildren();$("result").hidden=!isResult;$("backBtn").disabled=!history.length;$("answerHistory").hidden=!history.length;$("answerHistory").replaceChildren();history.forEach(h=>{if(h.choice==="案内をはじめる")return;const span=document.createElement("span");span.textContent=h.choice;$("answerHistory").append(span)});if(!isResult){s.options.forEach(([label,next])=>{const b=document.createElement("button");b.className="chat-choice";b.type="button";b.textContent=label;b.addEventListener("click",()=>{history.push({from:current,choice:label});current=next;render();document.querySelector(".chat-panel").scrollIntoView({behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})});$("choices").append(b)})}else{const div=document.createElement("div");div.className="chat-result";const title=document.createElement("strong");title.textContent=s.result==="web"?"WEB登録をご案内します":s.result==="paper"?"郵送登録をご案内します":"まずは比較してみましょう";const p=document.createElement("p");p.textContent=s.reason;div.append(title,p);$("result").append(div);const links=s.result==="web"?[["WEB登録の流れを見る","./guide-a-web.html"]]:s.result==="paper"?[["郵送登録の流れを見る","./guide-a-paper.html"]]:[["登録方法を比較する","./guide-a-compare.html"]];links.forEach(([label,href])=>{const a=document.createElement("a");a.href=href;a.className="chat-action";a.textContent=label+" →";$("result").append(a)});const compare=document.createElement("a");compare.className="chat-secondary";compare.href="./guide-a-compare.html";compare.textContent="比較表も確認する";$("result").append(compare)}}$("backBtn").addEventListener("click",()=>{const h=history.pop();if(h){current=h.from;render()}});$("restartBtn").addEventListener("click",()=>{history.length=0;current="start";render()});render()})();
</script>
<script src="./guide-shared-chrome.js?v=20261026-1" defer></script></body></html>
