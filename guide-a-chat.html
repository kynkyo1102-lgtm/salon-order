<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ミトコンドリアちゃんの登録案内｜メンバーズガイド</title><link rel="stylesheet" href="./common.css?v=20261019-noto2">
<link rel="stylesheet" href="./guide-a-chat.css?v=20261021-1"></head><body><header><div class="header-container"><a class="back-link" href="./guide-a.html">← 新規登録の流れへ戻る</a></div></header>
<main class="reg-chat"><div class="eyebrow">GUIDE A / 新規登録</div><h1>登録方法を一緒に選ぼう</h1><p class="lead">ミトコンドリアちゃんの質問に答えるだけ。あなたに合いそうな登録方法をご案内します。</p>
<section class="chat-panel" aria-label="会話形式の登録案内"><div class="chat-progress"><span id="stepLabel">ごあいさつ</span></div><div class="chat-progress-bar"><div id="progressFill" class="chat-progress-fill" style="width:0"></div></div>
<div class="chat-message"><div class="chat-avatar" aria-hidden="true"><img src="./assets/mitochondria-chan.svg" alt="" width="85" height="128" style="display:block;width:100%;height:auto" loading="eager"></div><div class="chat-bubble"><div id="message" aria-live="polite">こんにちは！登録方法を一緒に確認しましょう。</div></div></div>
<div id="answerHistory" class="chat-answers" hidden></div><div id="choices" class="chat-choices"></div><div id="result" hidden></div><div class="chat-controls"><button id="backBtn" type="button">← ひとつ戻る</button><button id="restartBtn" type="button">最初からやり直す</button></div></section>
<p class="chat-footnote">※この案内は現在のガイドの登録条件をもとにした簡易ナビゲーションです。実際のお手続きでは公式の概要書面・最新の条件をご確認ください。</p><div class="guide-links"><a href="./guide-a-compare-table.html">WEB登録と郵送登録の比較表を見る →</a></div></main>
<nav class="guide-floating-actions" aria-label="便利なリンク"><a class="guide-float-eservice" href="https://www.ninapharm.co.jp/e-service/" target="_blank" rel="noopener noreferrer">↗ E-Service</a><a class="diagnosis-float" href="./check.html"><span aria-hidden="true">✦</span> ボーナス診断</a></nav>
<script src="./guide-menu.js" defer></script><script>
(()=>{const $=id=>document.getElementById(id),history=[];const scenes={start:{label:"はじめに",text:"こんにちは！\nミトコンドリアちゃんです。\n新規登録の方法を一緒に確認していきましょう！",options:[["案内をはじめる","company"]]},company:{label:"質問 1 / 3",text:"まず、登録するのは個人ですか？ それとも法人ですか？",options:[["個人で登録したい","payment"],["法人で登録したい","corporate"],["まだ決まっていない","unsure"]]},payment:{label:"質問 2 / 3",text:"初回のお支払いについて教えてください。",options:[["クレジットカードで支払いたい","device"],["銀行振込で支払いたい","paper"],["まだ決めていない・わからない","unsure"]]},device:{label:"質問 3 / 3",text:"スマートフォンやパソコンで、メールを確認しながら入力することはできそうですか？",options:[["できそう！","web"],["少し不安がある","support"],["書面で確認しながら進めたい","paper"]]},corporate:{label:"ご案内",text:"法人登録は、現在のガイドでは郵送での登録となっています。",result:"paper",reason:"法人登録はWEB登録の対象外と案内されています。"},paper:{label:"ご案内",text:"お話を聞くと、郵送登録の手順が合いそうです！",result:"paper",reason:"郵送登録では、初回商品代金を事前に振り込み、申請書と振込明細のコピーを郵送します。"},web:{label:"ご案内",text:"お話を聞くと、WEB登録が合いそうです！",result:"web",reason:"WEB登録では、メールから入力を進め、初回のお支払いにクレジットカードを使います。"},support:{label:"ご案内",text:"操作が不安なら、無理せず紹介者などに確認しながら進めるのがおすすめです。",result:"both",reason:"WEB登録と郵送登録の手順を比べて、進めやすい方法を選びましょう。"},unsure:{label:"ご案内",text:"まだ決められなくても大丈夫！ まずは登録方法の違いを確認してみましょう。",result:"both",reason:"法人か個人か、初回のお支払い方法などを確認してから決めると安心です。"}};let current="start";function render(){const s=scenes[current],isResult=!!s.result;$("stepLabel").textContent=s.label;$("progressFill").style.width=isResult?"100%":current==="start"?"0%":current==="company"?"33%":current==="payment"?"66%":"90%";$("message").textContent=s.text;$("choices").replaceChildren();$("result").replaceChildren();$("result").hidden=!isResult;$("backBtn").disabled=!history.length;$("answerHistory").hidden=!history.length;$("answerHistory").replaceChildren();history.forEach(h=>{if(h.choice==="案内をはじめる")return;const span=document.createElement("span");span.textContent=h.choice;$("answerHistory").append(span)});if(!isResult){s.options.forEach(([label,next])=>{const b=document.createElement("button");b.className="chat-choice";b.type="button";b.textContent=label;b.addEventListener("click",()=>{history.push({from:current,choice:label});current=next;render()});$("choices").append(b)})}else{const div=document.createElement("div");div.className="chat-result";const title=document.createElement("strong");title.textContent=s.result==="web"?"WEB登録をご案内します":s.result==="paper"?"郵送登録をご案内します":"まずは比較してみましょう";const p=document.createElement("p");p.textContent=s.reason;div.append(title,p);$("result").append(div);const links=s.result==="web"?[["WEB登録の流れを見る","./guide-a-web.html"]]:s.result==="paper"?[["郵送登録の流れを見る","./guide-a-paper.html"]]:[["登録方法を比較する","./guide-a-compare-table.html"]];links.forEach(([label,href])=>{const a=document.createElement("a");a.href=href;a.className="chat-action";a.textContent=label+" →";$("result").append(a)});const compare=document.createElement("a");compare.className="chat-secondary";compare.href="./guide-a-compare-table.html";compare.textContent="比較表も確認する";$("result").append(compare)}}$("backBtn").addEventListener("click",()=>{const h=history.pop();if(h){current=h.from;render()}});$("restartBtn").addEventListener("click",()=>{history.length=0;current="start";render()});render()})();
</script></body></html>
