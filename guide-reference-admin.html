<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参照情報管理｜メンバーズガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./guide-shared-chrome.css?v=20261114-admin1"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fb;color:#273544;font-family:"Noto Sans JP",sans-serif}.admin{width:min(860px,100%);margin:auto;padding:38px 20px 120px}.admin h1{font-size:26px;color:#004AAD;margin:0 0 10px}.lead{color:#647383;font-size:14px;line-height:1.8}.panel{background:#fff;border:1px solid #e0e7ed;border-radius:14px;padding:20px;margin-top:18px}.panel h2{font-size:17px;margin:0 0 16px;color:#174d85}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:13px;font-weight:700;color:#536474}.field input,.field select{width:100%;min-height:46px;border:1px solid #ccd7e0;border-radius:9px;padding:10px 12px;font:inherit;background:#fff;color:#273544}.hint{font-size:12px;color:#788694}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:9px;padding:12px 17px;background:#004AAD;color:white;font:700 14px inherit;cursor:pointer}.btn.secondary{background:#edf3f8;color:#24517e}.btn.danger{background:#fff0f0;color:#a33}.entry{padding:13px 0;border-bottom:1px solid #edf0f3;display:flex;justify-content:space-between;gap:12px;align-items:center}.entry:last-child{border:0}.entry small{display:block;color:#71808d;margin-top:4px}.entry button{border:0;background:#edf3f8;border-radius:7px;padding:8px 10px;color:#24517e}.output{width:100%;min-height:230px;resize:vertical;border:1px solid #ccd7e0;border-radius:9px;padding:12px;font:12px/1.6 monospace}.status{font-size:13px;color:#38724c;min-height:20px}.warning{font-size:12px;color:#6d7882;line-height:1.7}.toplink{display:inline-block;margin-bottom:20px;color:#004AAD;text-decoration:none;font-size:13px}
</style></head><body>
<main class="admin"><a class="toplink" href="./ninaguide.html">‹ メンバーズガイドへ</a><h1>参照情報管理</h1><p class="lead">各ガイドページの参照元を登録し、公開用JavaScriptを生成します。入力内容はこの端末のブラウザに保存できます。</p>
<section class="panel"><h2>参照情報を追加</h2>
<div class="field"><label for="page">登録するガイドページ</label><select id="page"></select></div>
<div class="field"><label for="type">参照元の種類</label><select id="type"><option value="manual">メンバーズマニュアル</option><option value="document">その他の資料</option><option value="original">当サイト独自の内容</option></select></div>
<div class="field"><label for="title">資料名・内容名</label><input id="title" placeholder="例：商品案内資料（独自の内容なら説明名）"></div>
<div class="field"><label for="pages">ページ番号</label><input id="pages" placeholder="例：12, 13（ない場合は空欄）"><span class="hint">複数ページはカンマ区切り。ページ番号がない資料は空欄でOK。</span></div>
<div class="field"><label for="url">資料へのリンク（任意）</label><input id="url" type="url" placeholder="https://..."></div>
<div class="field"><label for="edition">版・改訂年月（任意）</label><input id="edition" placeholder="例：2026年11月改訂"></div>
<div class="actions"><button class="btn" id="add">登録する</button><button class="btn secondary" id="clear">入力をクリア</button></div></section>
<section class="panel"><h2>登録済みの参照情報</h2><div id="entries"></div><p class="warning">この一覧はこのブラウザ内に保存されます。別の端末・ブラウザとは自動同期されません。</p></section>
<section class="panel"><h2>公開用コードを生成</h2><p class="lead">登録内容をまとめた guide-manual-references.js を生成します。内容を確認してコピーし、GitHub上の同名ファイルを置き換えてください。</p><textarea class="output" id="output" readonly></textarea><div class="actions"><button class="btn" id="generate">コードを生成</button><button class="btn secondary" id="copy">コードをコピー</button></div><p class="status" id="status" aria-live="polite"></p></section>
</main><script>
(()=>{
'use strict';
const pages=[['guide-a-chat.html','登録ガイド'],['guide-a-compare.html','登録方法の比較'],['guide-a-compare-table.html','登録方法の比較表'],['guide-a-cost.html','初回費用'],['guide-a-cutoff.html','新規登録の締め日'],['guide-a-paper.html','郵送登録'],['guide-a-placement.html','組織の配置について'],['guide-a-registration-steps.html','登録手順'],['guide-a-web.html','WEB登録'],['guide-b.html','定期購入トップ'],['guide-b-bonus.html','定期購入特典'],['guide-b-cost.html','毎月の商品購入'],['guide-b-deadline.html','変更・停止の締め日'],['guide-b-payment.html','お支払方法'],['guide-b-schedule.html','お届けスケジュール'],['guide-b-stop.html','定期購入の停止'],['guide-c.html','ボーナスプラン概要'],['guide-c-basic.html','基本条件'],['guide-c-bonus.html','ボーナスプラン'],['guide-c-bonus-10-active.html','10アクティブ'],['guide-c-bonus-5-active.html','5アクティブ'],['guide-c-bonus-amf.html','AMF'],['guide-c-bonus-basic-commission.html','基本コミッション'],['guide-c-bonus-cullinan-amf.html','カリナンAMF'],['guide-c-bonus-double-mega-match.html','ダブルメガマッチ'],['guide-c-bonus-first-start.html','ファーストスタートボーナス'],['guide-c-bonus-leadership.html','リーダーシップ'],['guide-c-bonus-mega-match.html','メガマッチ'],['guide-c-branch.html','ブランチ'],['guide-c-payment.html','ボーナスの支払い'],['guide-c-reward-basics.html','ボーナスの基本'],['guide-c-title.html','タイトル昇格条件'],['guide-cap-adjustment.html','キャップ調整'],['guide-compliance.html','活動のルール・コンプライアンス'],['guide-compliance-contract.html','契約・特商法'],['guide-compliance-invite.html','勧誘時のルール'],['guide-compliance-products.html','商品説明のルール'],['guide-compliance-sns.html','SNS発信のルール'],['guide-d.html','手続き・申請'],['guide-e.html','よくある困りごと'],['guide-e-extra-points.html','追加ポイントについて'],['guide-list.html','ガイド一覧'],['guide-myplan.html','マイプラン'],['guide-myplan-income.html','マイプラン・収入シミュレーション'],['guide-myplan-title.html','マイプラン・タイトルシミュレーション'],['guide-procedures.html','手続き一覧'],['guide-tokusho.html','特定商取引法について']];
const $=id=>document.getElementById(id),storeKey='guideReferenceAdmin_v1';
let data={};
try{data=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){data={}}
pages.forEach(([file])=>{if(!Array.isArray(data[file]))data[file]=[]});
pages.forEach(([file,name])=>{const o=document.createElement('option');o.value=file;o.textContent=name+'（'+file+'）';$('page').append(o)});
function save(){localStorage.setItem(storeKey,JSON.stringify(data));render()}
function render(){const root=$('entries');root.replaceChildren();let count=0;pages.forEach(([file,name])=>{(data[file]||[]).forEach((ref,i)=>{count++;const row=document.createElement('div');row.className='entry';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=name+'：'+(ref.type==='manual'?'メンバーズマニュアル':ref.type==='original'?'当サイト独自':ref.title);const small=document.createElement('small');small.textContent=[ref.pages&&ref.pages.length?ref.pages.join('・')+'P':'ページ番号なし',ref.edition].filter(Boolean).join(' ／ ');info.append(title,small);const del=document.createElement('button');del.textContent='削除';del.addEventListener('click',()=>{data[file].splice(i,1);save()});row.append(info,del);root.append(row)})});if(!count){const p=document.createElement('p');p.className='hint';p.textContent='まだ参照情報は登録されていません。';root.append(p)}}
function escapeString(s){return JSON.stringify(s||'')}
function generate(){const lines=['/* Generated by guide-reference-admin.html. Replace the existing file with this content. */','(()=>{','\'use strict\';','const GUIDE_REFERENCES={'];pages.forEach(([file])=>{const refs=data[file]||[];const encoded=refs.map(r=>'{type:'+escapeString(r.type)+',title:'+escapeString(r.title)+',pages:'+JSON.stringify(r.pages||[])+',url:'+escapeString(r.url)+',edition:'+escapeString(r.edition)+'}').join(',');lines.push(' '+escapeString(file)+':['+encoded+'],' )});lines.push('};','const filename=decodeURIComponent(location.pathname.split(\'/\').pop()||\'\');','const refs=GUIDE_REFERENCES[filename];','if(!refs||!refs.length)return;','const main=document.querySelector(\'main\');','if(!main)return;','main.querySelectorAll(\'.guide-reference-note\').forEach(el=>el.remove());','const note=document.createElement(\'p\');note.className=\'guide-reference-note\';note.setAttribute(\'aria-label\',\'参照資料\');','refs.forEach((ref,index)=>{if(index)note.append(document.createTextNode(\' ／ \'));const label=document.createElement(\'span\');const type=ref.type===\'manual\'?\'メンバーズマニュアル\':ref.type===\'original\'?\'当サイト独自\'+(ref.title?\'：\'+ref.title:\'\'):(ref.title||\'参考資料\');let detail=type;if(ref.pages&&ref.pages.length)detail+=\' \'+ref.pages.join(\'・\')+\'P\';if(ref.edition)detail+=\'（\'+ref.edition+\'）\';label.textContent=detail;if(ref.url){const link=document.createElement(\'a\');link.href=ref.url;link.textContent=detail;link.target=\'_blank\';link.rel=\'noopener noreferrer\';note.append(link)}else note.append(label)});','const back=main.querySelector(\'.guide-bottom-return\');if(back)main.insertBefore(note,back);else main.append(note);','})();');$('output').value=lines.join('\n')}
$('add').addEventListener('click',()=>{const type=$('type').value,title=$('title').value.trim(),raw=$('pages').value.trim(),url=$('url').value.trim(),edition=$('edition').value.trim();if(type!=='manual'&&!title){$('status').textContent='資料名・内容名を入力してください。';return}if(url&&!/^https?:\/\//i.test(url)){$('status').textContent='リンクは https:// または http:// から入力してください。';return}const nums=raw?raw.split(',').map(x=>Number(x.trim())):[];if(nums.some(n=>!Number.isInteger(n)||n<1)){$('status').textContent='ページ番号は1以上の整数で入力してください。';return}data[$('page').value].push({type,title,pages:nums,url,edition});['title','pages','url','edition'].forEach(id=>$(id).value='');$('status').textContent='登録しました。';save()});
$('clear').addEventListener('click',()=>['title','pages','url','edition'].forEach(id=>$(id).value=''));
$('generate').addEventListener('click',()=>{generate();$('status').textContent='コードを生成しました。'});
$('copy').addEventListener('click',async()=>{if(!$('output').value)generate();try{await navigator.clipboard.writeText($('output').value);$('status').textContent='コードをコピーしました。'}catch(e){$('output').focus();$('output').select();$('status').textContent='コード欄を選択しました。コピーしてください。'}});
render();
})();
</script></body></html>
