<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サロン注文ツール - 月度＆ポイント管理画面</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; max-width: 900px; margin: 0 auto; }
    h1, h2 { color: #333; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input[type="text"], input[type="number"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    .btn { padding: 10px 16px; background: #4caf50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    .btn-secondary { background: #008cba; }
    .btn-danger { background: #f44336; }
    .flex { display: flex; gap: 10px; align-items: center; }
    
    /* お知らせ用スタイル */
    .news-item-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
    .news-item-date { width: 120px; flex-shrink: 0; }
    .news-item-text { flex-grow: 1; }
  </style>
</head>
<body>

  <h1>⚙️ 月度・商品ポイント管理画面</h1>

  <!-- 1. 処理月度の設定 -->
  <div class="card">
    <h2>1. 選択可能な処理月度の設定</h2>
    <p style="font-size: 0.85rem; color: #666;">
      ※1〜10日は「先月度, 今月度」（例: 8月度, 9月度）、11日以降は「今月度」（例: 9月度）のようにカンマ区切りで入力してください。
    </p>
    <label>有効な月度 (カンマ区切り)</label>
    <input type="text" id="activeMonthsInput" value="8月度" oninput="handleMonthChange()">
  </div>

  <!-- 2. お知らせ設定 (複数登録対応) -->
  <div class="card">
    <h2>2. トップページお知らせ設定 (複数可)</h2>
    <p style="font-size: 0.85rem; color: #666;">
      ※日付と本文を入力してください。保存・ダウンロード時に新しい日付が自動で上にソートされます。
    </p>
    <div id="newsContainer"></div>
    <button type="button" class="btn btn-secondary" onclick="addNewsRowUI()">＋ お知らせを追加</button>
  </div>

  <!-- 3. 商品マスター・ポイント一覧 -->
  <div class="card">
    <h2>3. 商品価格 & 月度別ポイント編集</h2>
    <table id="productTable">
      <thead>
        <tr id="tableHeader">
          <th>商品名</th>
          <th style="width: 100px;">価格(円)</th>
          <!-- 月度別ポイントヘッダーが動的に入ります -->
        </tr>
      </thead>
      <tbody id="productTableBody"></tbody>
    </table>
    <br>
    <button type="button" class="btn btn-secondary" onclick="addNewProductRow()">＋ 商品を追加</button>
  </div>

  <!-- 4. 保存・出力 -->
  <div class="card">
    <h2>4. 設定ファイルの書き出し</h2>
    <div class="flex">
      <button type="button" class="btn" onclick="exportJSON()">💾 month_config.json をダウンロード</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
      <button type="button" class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📂 既存の JSON を読み込んで編集</button>
    </div>
  </div>

  <script>
    let masterData = {
      activeMonths: ["8月度"],
      newsList: [
        { date: "8/17", text: "【新機能】購入ポイントの最適化や左右分配ができる「注文計算アシスタント」を公開しました！" },
        { date: "8/7", text: "【完売案内】ゼログラビティ リペアセラムは完売いたしました。" }
      ],
      products: []
    };

    window.onload = () => {
      renderAll();
    };

    function renderAll() {
      document.getElementById('activeMonthsInput').value = (masterData.activeMonths || []).join(', ');
      renderNewsList();
      renderTableHeaders();
    }

    /* --- 日付パース・ソート補助関数 --- */
    function parseDateString(dateStr) {
      if (!dateStr) return 0;
      const m = dateStr.match(/(\d+)\/(\d+)/);
      if (m) {
        return parseInt(m[1], 10) * 100 + parseInt(m[2], 10);
      }
      return 0;
    }

    function sortNewsList(list) {
      return list.sort((a, b) => parseDateString(b.date) - parseDateString(a.date));
    }

    /* --- お知らせ用処理 --- */
    function renderNewsList() {
      const container = document.getElementById('newsContainer');
      container.innerHTML = '';
      
      let list = masterData.newsList || [];
      if (list.length === 0 && (masterData.newsDate || masterData.newsText)) {
        list = [{ date: masterData.newsDate || '', text: masterData.newsText || '' }];
      }

      // 降順ソートを適用
      list = sortNewsList(list);

      if (list.length === 0) {
        list = [{ date: '', text: '' }];
      }

      list.forEach((item) => {
        addNewsRowUI(item.date, item.text);
      });
    }

    function addNewsRowUI(date = '', text = '') {
      const container = document.getElementById('newsContainer');
      const div = document.createElement('div');
      div.className = 'news-item-row';
      div.innerHTML = `
        <input type="text" class="input-news-date news-item-date" placeholder="日付 (例: 8/17)" value="${date}">
        <input type="text" class="input-news-text news-item-text" placeholder="お知らせ本文" value="${text}">
        <button type="button" class="btn btn-danger" onclick="removeNewsRow(this)" style="padding: 6px 12px;">✕</button>
      `;
      container.appendChild(div);
    }

    function removeNewsRow(btn) {
      btn.parentElement.remove();
    }

    function getNewsData() {
      const rows = document.querySelectorAll('.news-item-row');
      let newsList = [];
      rows.forEach(row => {
        const dateInput = row.querySelector('.input-news-date');
        const textInput = row.querySelector('.input-news-text');
        if (!dateInput || !textInput) return;
        
        const date = dateInput.value.trim();
        const text = textInput.value.trim();
        
        if (text !== '' || date !== '') {
          newsList.push({ date, text });
        }
      });

      // 新しい日付順（降順）に並び替え
      return sortNewsList(newsList);
    }

    /* --- 商品・ポイント用処理 --- */
    function getMonths() {
      const input = document.getElementById('activeMonthsInput').value;
      const normalized = input.replace(/、/g, ',');
      const months = normalized.split(',').map(m => m.trim()).filter(m => m.length > 0);
      return months.length > 0 ? months : ["今月度"];
    }

    function handleMonthChange() {
      saveCurrentTableToData();
      renderTableHeaders();
    }

    function renderTableHeaders() {
      const months = getMonths();
      masterData.activeMonths = months;

      const headerTr = document.getElementById('tableHeader');
      headerTr.innerHTML = `
        <th>商品名</th>
        <th style="width: 110px;">価格(税込)</th>
        ${months.map(m => `<th>${m} Pt</th>`).join('')}
        <th style="width: 50px;">操作</th>
      `;

      renderTableBody();
    }

    function renderTableBody() {
      const tbody = document.getElementById('productTableBody');
      tbody.innerHTML = '';
      const months = masterData.activeMonths || ["今月度"];

      (masterData.products || []).forEach((prod) => {
        const tr = document.createElement('tr');
        
        let ptCells = months.map(m => {
          const ptVal = (prod.pts && prod.pts[m] !== undefined) ? prod.pts[m] : 0;
          return `<td><input type="number" class="input-pt" data-month="${m}" value="${ptVal}"></td>`;
        }).join('');

        tr.innerHTML = `
          <td><input type="text" class="input-name" value="${prod.name || ''}"></td>
          <td><input type="number" class="input-price" value="${prod.price || 0}"></td>
          ${ptCells}
          <td><button type="button" class="btn btn-danger" onclick="deleteRow(this)">✕</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function addNewProductRow() {
      saveCurrentTableToData();
      masterData.products.push({
        name: "新商品",
        price: 0,
        pts: {}
      });
      renderTableBody();
    }

    function deleteRow(btnElement) {
      btnElement.closest('tr').remove();
    }

    function saveCurrentTableToData() {
      const months = getMonths();
      const rows = document.querySelectorAll('#productTableBody tr');
      const updatedProducts = [];

      rows.forEach((row) => {
        const nameInput = row.querySelector('.input-name');
        const priceInput = row.querySelector('.input-price');
        if (!nameInput || !priceInput) return;

        const name = nameInput.value;
        const price = parseInt(priceInput.value, 10) || 0;
        const pts = {};

        months.forEach(m => {
          const ptInput = row.querySelector(`.input-pt[data-month="${m}"]`);
          pts[m] = ptInput ? (parseInt(ptInput.value, 10) || 0) : 0;
        });

        updatedProducts.push({ name, price, pts });
      });

      masterData.activeMonths = months;
      if (updatedProducts.length > 0) {
        masterData.products = updatedProducts;
      }
      masterData.newsList = getNewsData();

      // 旧フォーマットとの後方互換用
      if (masterData.newsList.length > 0) {
        masterData.newsDate = masterData.newsList[0].date || "";
        masterData.newsText = masterData.newsList[0].text || "";
      }
    }

    function exportJSON() {
      saveCurrentTableToData();
      
      // 画面を並び替え後の状態で最新化
      renderNewsList();

      const jsonString = JSON.stringify(masterData, null, 2);
      const blob = new Blob([jsonString], { type: "application/json;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", url);
      downloadAnchor.setAttribute("download", "month_config.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      URL.revokeObjectURL(url);
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (typeof parsed !== 'object' || parsed === null) throw new Error();
          masterData = parsed;
          renderAll();
          alert("JSONファイルを正常に読み込みました。お知らせも新しい日付順に整列されました。");
        } catch (err) {
          alert("JSONの読み込みに失敗しました。正しいフォーマットか確認してください。");
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }
  </script>
</body>
</html>
