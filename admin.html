<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サロン注文ツール - 月度＆ポイント管理画面</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; max-width: 900px; margin: 0 auto; }
    h1, h2 { color: #333; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input[type="text"], input[type="number"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    .btn { padding: 10px 16px; background: #4caf50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    .btn-secondary { background: #008cba; }
    .btn-danger { background: #f44336; }
    .flex { display: flex; gap: 10px; align-items: center; }
  </style>
</head>
<body>

  <h1>⚙️ 月度・商品ポイント管理画面</h1>

  <!-- 1. 処理月度の設定 -->
  <div class="card">
    <h2>1. 選択可能な処理月度の設定</h2>
    <p style="font-size: 0.85rem; color: #666;">
      ※1〜10日は「先月度, 今月度」（例: 8月度, 9月度）、11日以降は「今月度」（例: 9月度）のようにカンマ区切りで入力してください。
    </p>
    <label>有効な月度 (カンマ区切り)</label>
    <input type="text" id="activeMonthsInput" value="8月度, 9月度" onchange="renderTableHeaders()">
  </div>

  <!-- 2. 商品マスター・ポイント一覧 -->
  <div class="card">
    <h2>2. 商品価格 & 月度別ポイント編集</h2>
    <table id="productTable">
      <thead>
        <tr id="tableHeader">
          <th>商品名</th>
          <th style="width: 100px;">価格(円)</th>
          <!-- 月度別ポイントヘッダーが動的に入ります -->
        </tr>
      </thead>
      <tbody id="productTableBody"></tbody>
    </table>
    <br>
    <button class="btn btn-secondary" onclick="addNewProductRow()">＋ 商品を追加</button>
  </div>

  <!-- 3. 保存・出力 -->
  <div class="card">
    <h2>3. 設定ファイルの書き出し</h2>
    <div class="flex">
      <button class="btn" onclick="exportJSON()">💾 month_config.json をダウンロード</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
      <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📂 既存の JSON を読み込んで編集</button>
    </div>
  </div>

  <script>
    // デフォルトの商品データ構造
    let masterData = {
      activeMonths: ["8月度", "9月度"],
      products: [
        { name: "OX-288", price: 13800, pts: { "8月度": 10000, "9月度": 10000 } },
        { name: "ボアソン", price: 10800, pts: { "8月度": 10000, "9月度": 10000 } },
        { name: "ハイプロリーナ", price: 7200, pts: { "8月度": 6000, "9月度": 6000 } }
      ]
    };

    window.onload = () => {
      renderAll();
    };

    function renderAll() {
      document.getElementById('activeMonthsInput').value = masterData.activeMonths.join(', ');
      renderTableHeaders();
    }

    function getMonths() {
      const input = document.getElementById('activeMonthsInput').value;
      return input.split(',').map(m => m.trim()).filter(m => m.length > 0);
    }

    function renderTableHeaders() {
      const months = getMonths();
      masterData.activeMonths = months;

      const headerTr = document.getElementById('tableHeader');
      headerTr.innerHTML = `
        <th>商品名</th>
        <th style="width: 110px;">価格(税込)</th>
        ${months.map(m => `<th>${m} Pt</th>`).join('')}
        <th style="width: 50px;">操作</th>
      `;

      renderTableBody();
    }

    function renderTableBody() {
      const tbody = document.getElementById('productTableBody');
      tbody.innerHTML = '';
      const months = masterData.activeMonths;

      masterData.products.forEach((prod, index) => {
        const tr = document.createElement('tr');
        
        let ptCells = months.map(m => {
          const ptVal = (prod.pts && prod.pts[m] !== undefined) ? prod.pts[m] : 0;
          return `<td><input type="number" class="input-pt" data-index="${index}" data-month="${m}" value="${ptVal}"></td>`;
        }).join('');

        tr.innerHTML = `
          <td><input type="text" class="input-name" data-index="${index}" value="${prod.name}"></td>
          <td><input type="number" class="input-price" data-index="${index}" value="${prod.price}"></td>
          ${ptCells}
          <td><button class="btn btn-danger" onclick="deleteRow(${index})">✕</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function addNewProductRow() {
      saveCurrentTableToData();
      masterData.products.push({
        name: "新商品",
        price: 0,
        pts: {}
      });
      renderTableBody();
    }

    function deleteRow(index) {
      saveCurrentTableToData();
      masterData.products.splice(index, 1);
      renderTableBody();
    }

    function saveCurrentTableToData() {
      const months = getMonths();
      const rows = document.querySelectorAll('#productTableBody tr');

      const updatedProducts = [];

      rows.forEach((row, idx) => {
        const name = row.querySelector('.input-name').value;
        const price = parseInt(row.querySelector('.input-price').value) || 0;
        const pts = {};

        months.forEach(m => {
          const ptInput = row.querySelector(`.input-pt[data-month="${m}"]`);
          pts[m] = ptInput ? (parseInt(ptInput.value) || 0) : 0;
        });

        updatedProducts.push({ name, price, pts });
      });

      masterData.activeMonths = months;
      masterData.products = updatedProducts;
    }

    function exportJSON() {
      saveCurrentTableToData();
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(masterData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "month_config.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          masterData = JSON.parse(e.target.result);
          renderAll();
          alert("JSONファイルを正常に読み込みました。");
        } catch (err) {
          alert("JSONの読み込みに失敗しました。正しいフォーマットか確認してください。");
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
