const modal=document.getElementById("modal"),detail=document.getElementById("detail");function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function show(s){detail.innerHTML=s;modal.classList.add("open");document.getElementById("close").focus()}function openSection(id){let s=sections[id];show('<span class="eyebrow">NINA GUIDE / SHELF</span><h2>'+esc(s.title)+'</h2><p>'+esc(s.intro)+'</p>'+s.links.map(x=>'<a class="result-link" href="./'+x[1]+'">'+esc(x[0])+' →</a>').join(''))}document.querySelectorAll("[data-id]").forEach(x=>x.addEventListener("click",()=>openSection(x.dataset.id)));document.querySelectorAll("[data-note]").forEach(x=>x.addEventListener("click",()=>{let n=notes[x.dataset.note];show('<span class="eyebrow">MEMO / よくある疑問</span><h2>'+esc(n[0])+'</h2><p>この疑問は「'+esc(sections[n[1]].title)+'」のガイドで調べられます。</p><a class="result-link" href="./'+n[3]+'">'+esc(n[2])+' →</a><button class="search" style="margin-top:12px;border:0;background:none;text-decoration:underline" data-open="'+n[1]+'">関連する目次を開く</button>');detail.querySelector("[data-open]").addEventListener("click",()=>openSection(n[1]))}));document.getElementById("close").addEventListener("click",()=>modal.classList.remove("open"));modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("open")});document.addEventListener("keydown",e=>{if(e.key==="Escape")modal.classList.remove("open")});document.querySelectorAll("[data-keyword]").forEach(b=>b.addEventListener("click",()=>{document.getElementById("q").value=b.dataset.keyword;document.getElementById("search").requestSubmit()}));document.getElementById("search").addEventListener("submit",e=>{e.preventDefault();let q=document.getElementById("q").value.trim();if(!q)return;let matches=Object.values(sections).flatMap(s=>s.links.filter(x=>(s.title+x[0]).includes(q)).map(x=>[s.title,...x]));show('<span class="eyebrow">SEARCH / 調べもの</span><h2>「'+esc(q)+'」の検索結果</h2>'+(matches.length?matches.map(x=>'<a class="result-link" href="./'+x[2]+'">'+esc(x[0]+' ／ '+x[1])+' →</a>').join(''):'<p>一致する目次はありませんでした。別のキーワードでもお試しください。</p>'))});
