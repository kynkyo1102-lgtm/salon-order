" alt="" loading="lazy"><strong>小売や転売は…</strong><span class="cg-card-more">詳しく見る <span aria-hidden="true">＋</span></span></button><button class="cg-rule-card" type="button" data-rule="business-9" aria-haspopup="dialog"><span class="cg-card-num">No.010</span><img src="./assets/compliance/person-stop-angry.svg" alt="" loading="lazy"><strong>断られたら…</strong><span class="cg-card-more">詳しく見る <span aria-hidden="true">＋</span></span></button><button class="cg-rule-card" type="button" data-rule="business-10" aria-haspopup="dialog"><span class="cg-card-num">No.011</span><img src="./assets/compliance/person-confused.svg" alt="" loading="lazy"><strong>注文の量は…</strong><span class="cg-card-more">詳しく見る <span aria-hidden="true">＋</span></span></button><button class="cg-rule-card" type="button" data-rule="business-11" aria-haspopup="dialog"><span class="cg-card-num">No.012</span><img src="./assets/compliance/person-document.svg" alt="" loading="lazy"><strong>解約したいと言われたら…</strong><span class="cg-card-more">詳しく見る <span aria-hidden="true">＋</span></span></button><button class="cg-rule-card" type="button" data-rule="business-12" aria-haspopup="dialog"><span class="cg-card-num">No.013</span><img src="./assets/compliance/person-stop.svg" alt="" loading="lazy"><strong>ほかのビジネスへ…</strong><span class="cg-card-more">詳しく見る <span aria-hidden="true">＋</span></span></button><button class="cg-rule-card" type="button" data-rule="business-13" aria-haspopup="dialog"><span class="cg-card-num">No.014</span><img src="./assets/compliance/person-checklist.svg" alt="" loading="lazy"><strong>組織の位置は…</strong><span class="cg-card-more">詳しく見る <span aria-hidden="true">＋</span></span></button></div></section><section class="cg-gallery-section" id="products"><div class="cg-gallery-heading"><div><span class="cg-section-num">02 / RULE BOOK</span><h2>商品説明時のルール</h2><p>商品の魅力を正しく伝えるための約束。</p></div><img src="./assets/compliance/person-product.svg" alt="" loading="lazy"></div><div class="cg-gallery-grid"><button class="cg-rule-card" type="button" data-rule="products-0" aria-haspopup="dialog"><span class="cg-card-num">No.001</span><img src="./assets/compliance/person-product.svg" alt="" loading="lazy"><strong>健康食品の説明は…</strong><span class="cg-card-more">詳しく見る <span aria-hidden="true">＋</span></span></button><button class="cg-rule-card" type="button" data-rule="products-1" aria-haspopup="dialog"><span class="cg-card-num">No.002</span><img src="./assets/compliance/person-explain.svg" alt="" loading="lazy"><strong>表示や宣伝は…</strong><span class="cg-card-more">詳しく見る <span aria-hidden="true">＋</span></span></button><button class="cg-rule-card" type="button" data-rule="products-2" aria-haspopup="dialog"><span class="cg-card-num">No.003</span><img src="./assets/compliance/person-stop.svg" alt="" loading="lazy"><strong>効能効果は…</strong><span class="cg-card-more">詳しく見る <span aria-hidden="true">＋</span></span></button><button class="cg-rule-card" type="button" data-rule="products-3" aria-haspopup="dialog"><span class="cg-card-num">No.004</span><img src="./assets/compliance/person-thinking.svg" alt="" loading="lazy"><strong>飲み方の指定は…</strong><span class="cg-card-more">詳しく見る <span aria-hidden="true">＋</span></span></button><button class="cg-rule-card" type="button" data-rule="products-4" aria-haspopup="dialog"><span class="cg-card-num">No.005</span><img src="./assets/compliance/person-surprised.svg" alt="" loading="lazy"><strong>体験談は…</strong><span class="cg-card-more">詳しく見る <span aria-hidden="true">＋</span></span></button><button class="cg-rule-card" type="button" data-rule="products-5" aria-haspopup="dialog"><span class="cg-card-num">No.006</span><img src="./assets/compliance/person-document.svg" alt="" loading="lazy"><strong>文章で配るなら…</strong><span class="cg-card-more">詳しく見る <span aria-hidden="true">＋</span></span></button><button class="cg-rule-card" type="button" data-rule="products-6" aria-haspopup="dialog"><span class="cg-card-num">No.007</span><img src="./assets/compliance/person-phone.svg" alt="" loading="lazy"><strong>使用前・使用後は…</strong><span class="cg-card-more">詳しく見る <span aria-hidden="true">＋</span></span></button><button class="cg-rule-card" type="button" data-rule="products-7" aria-haspopup="dialog"><span class="cg-card-num">No.008</span><img src="./assets/compliance/person-checklist.svg" alt="" loading="lazy"><strong>効果を示す資料は…</strong><span class="cg-card-more">詳しく見る <span aria-hidden="true">＋</span></span></button><button class="cg-rule-card" type="button" data-rule="products-8" aria-haspopup="dialog"><span class="cg-card-num">No.009</span><img src="./assets/compliance/person-confused.svg" alt="" loading="lazy"><strong>好転反応と言って…</strong><span class="cg-card-more">詳しく見る <span aria-hidden="true">＋</span></span></button><button class="cg-rule-card" type="button" data-rule="products-9" aria-haspopup="dialog"><span class="cg-card-num">No.010</span><img src="./assets/compliance/person-friendly.svg" alt="" loading="lazy"><strong>化粧品の表現は…</strong><span class="cg-card-more">詳しく見る <span aria-hidden="true">＋</span></span></button><button class="cg-rule-card" type="button" data-rule="products-10" aria-haspopup="dialog"><span class="cg-card-num">No.011</span><img src="./assets/compliance/person-checklist.svg" alt="" loading="lazy"><strong>自作資料は…</strong><span class="cg-card-more">詳しく見る <span aria-hidden="true">＋</span></span></button></div></section><p class="cg-gallery-note">このページはコンプライアンスブックを読みやすくまとめたものです。詳しい条件や最新の運用は、冊子・公式案内をご確認ください。</p></main><dialog class="cg-rule-dialog" id="cg-rule-dialog" aria-labelledby="cg-modal-title"><div class="cg-modal-top"><span id="cg-modal-number"></span><button type="button" id="cg-modal-close" aria-label="閉じる">×</button></div><img id="cg-modal-art" src="" alt=""><h2 id="cg-modal-title"></h2><p id="cg-modal-body"></p><p class="cg-modal-source" id="cg-modal-source"></p><button class="cg-modal-done" type="button" id="cg-modal-done">一覧に戻る</button></dialog><script>const ruleData={"business":[["勧誘の前に…","勧誘の前に、伝えることがあります。","ビジネスへの勧誘を始める前に、会社名・勧誘目的など必要な事項を相手に伝え、話を聞く意思があるか確認します。"],["勧誘の時に…","勧誘時に、説明すべき内容とは？","ビジネスの仕組み、商品、費用、契約条件、報酬など、相手が判断するための重要事項を正確に説明します。"],["概要書面は…","「概要書面」を必ず渡してください。","契約前に必要な概要書面を交付します。説明だけで済ませず、書面を相手に渡すことが重要です。"],["クーリングオフは…","必ずクーリングオフの説明をしてください。","契約を解除できるクーリングオフ制度について、相手が理解できるよう説明します。手続きや期間は公式書面で確認してください。"],["勧誘できない人は…","勧誘してはいけない方々とは？","20歳未満の方など、勧誘できない相手が定められています。相手の状況や判断力にも配慮してください。"],["収入の話は…","収入についてのオーバートークは禁止です。","「必ず稼げる」「誰でも高収入」といった、収入を保証するような説明や誇張した表現はしません。"],["迷惑になってない？","相手に迷惑をかけていませんか？","深夜・早朝など迷惑な時間帯や、相手が困るような場所・状況での勧誘は避けます。"],["SNSでの勧誘は…","SNS・ブログで勧誘してはいけません。","冊子ではSNS・ブログを利用した勧誘を禁止しています。投稿やDMなど、インターネット上での活動にも注意してください。"],["小売や転売は…","小売または転売をしてはいけません。","会員以外への小売や、オークションサイト等を利用した転売はしません。商品の販売方法は公式ルールに従います。"],["断られたら…","断られたのにしつこく誘っていませんか？","勧誘を断られたら、その意思を尊重します。断った相手への繰り返しの勧誘は避けてください。"],["注文の量は…","過剰な量を注文したり、させていませんか？","無理な大量購入や在庫を抱えるような注文を避け、相手にも過剰な購入を勧めません。"],["解約したいと言われたら…","クーリングオフを妨げてはいけません。","クーリングオフや解約の申し出を妨害したり、思いとどまらせるために不適切な説明をしたりしません。"],["ほかのビジネスへ…","ほかのネットワークビジネスや組織に勧誘してはいけません。","会員に対して、ほかのネットワークビジネスや組織への勧誘を行わないようにします。"],["組織の位置は…","組織図や配置についてもルールがあります。","組織内の配置や変更について、会社の定めるルールを守ります。自己判断で不適切な操作をしないようにしてください。"]],"products":[["健康食品の説明は…","なぜ医薬品医療機器等法で健康食品が規制されるのですか？","健康食品は医薬品ではありません。病気の治療・予防をうたうなど、医薬品と誤認させる表現は避けます。"],["表示や宣伝は…","健康増進法や景品表示法にも注意。","商品の広告や紹介では、実際より著しく優良に見せる表現や根拠のない表示を避けます。"],["効能効果は…","「効能効果」をうたってはいけません。","健康食品について「病気が治る」「症状が改善する」などの効能効果を断定しません。"],["飲み方の指定は…","「用法用量」を指定してはいけません。","医薬品のように、飲む回数や量を治療目的で指定する説明は避けます。"],["体験談は…","体験談に注意しましょう。","個人の体験談でも、商品の医薬品的な効能効果を示す表現はできません。口頭でも注意が必要です。"],["文章で配るなら…","文書で配布してもいけません。","効能効果をうたう体験談などを、チラシやSNS投稿などの文書で配布することも避けます。"],["使用前・使用後は…","「使用前・使用後」の写真を使ってはいけません。","商品を使った前後の比較写真などで、効果を保証するように見せることは避けます。"],["効果を示す資料は…","効能効果を暗示する資料は使えません。","医薬品的な効果を連想させる写真・資料・図表などを使って商品を宣伝しません。"],["好転反応と言って…","「好転反応」と称して継続を勧めてはいけません。","体調不良を「好転反応」と決めつけて使用継続を勧めないでください。"],["化粧品の表現は…","化粧品には決められた表現があります。","化粧品で表現できる効能効果には範囲があります。公式の表現を確認して、範囲を超える説明をしないようにします。"],["自作資料は…","自作資料は事務局の承認が必要です。","商品紹介のチラシや説明資料を自作するときは、公開・配布前に事務局の承認を得ます。"]]};const modal=document.getElementById("cg-rule-dialog");const close=()=>modal.close();document.querySelectorAll(".cg-rule-card").forEach(card=>card.addEventListener("click",()=>{const [group,index]=card.dataset.rule.split("-");const entry=ruleData[group][Number(index)];document.getElementById("cg-modal-number").textContent="No."+String(Number(index)+1).padStart(3,"0");document.getElementById("cg-modal-title").textContent=entry[1];document.getElementById("cg-modal-body").textContent=entry[2];document.getElementById("cg-modal-art").src=card.querySelector("img").getAttribute("src");document.getElementById("cg-modal-source").textContent="冊子："+(group==="business"?"ビジネス活動時のルール":"商品説明時のルール");modal.showModal()}));document.getElementById("cg-modal-close").addEventListener("click",close);document.getElementById("cg-modal-done").addEventListener("click",close);modal.addEventListener("click",e=>{if(e.target===modal)close()});</script><script src="./guide-shared-chrome.js?v=20261105-return1" defer></script></body></html>
