<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文送信フォーム</title>
  <style>
    body {
      margin: 0;
      padding: 10px;
      font-family: sans-serif;
      background-color: #f4f4f4;
    }
    .form-container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 15px;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    label {
      font-weight: bold;
      font-size: 15px;
      display: block;
      margin-bottom: 5px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .flex-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .btn-add {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 5px;
    }
    .btn-remove {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-submit, .btn-reload {
      width: 100%;
      padding: 14px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
    .btn-submit:disabled {
      background-color: #ccc;
    }
    .summary-box {
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      margin-top: 15px;
      text-align: left;
    }
    .summary-item {
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
    .product-list-summary {
      background: #fff;
      border: 1px dashed #ccc;
      padding: 8px;
      border-radius: 4px;
      margin: 8px 0;
    }
  </style>
</head>
<body>

  <div class="form-container">
    
    <!-- 1. 入力フォーム画面 -->
    <div id="formSection">
      <h2 style="font-size: 1.3em; text-align: center; margin-top: 5px; margin-bottom: 20px;">注文送信フォーム</h2>
      <form id="orderForm">
        
        <!-- 1. 発注月度 -->
        <div style="margin-bottom: 15px;">
          <label for="month">1. 発注月度</label>
          <select id="month" name="month" required>
            <option value="">選択してください</option>
            <option value="7月度">7月度</option>
            <option value="8月度">8月度</option>
          </select>
        </div>

        <!-- 2. 会員番号 -->
        <div style="margin-bottom: 15px;">
          <label>2. 購入会員番号</label>
          <div class="flex-row">
            <input type="text" id="memberIdMain" placeholder="例: 12345" style="flex: 1;" required>
            <span>-</span>
            <select id="memberIdSub" style="width: 85px;"></select>
          </div>
        </div>

        <!-- 3. ポジション名 -->
        <div style="margin-bottom: 15px;">
          <label for="position">3. ポジション名</label>
          <input type="text" id="position" name="position" required>
        </div>

        <!-- 4. 製品名 × 数量 (複数追加可能) -->
        <div style="margin-bottom: 15px;">
          <label>4. 製品名 × 数量</label>
          <div id="productContainer">
            <!-- JavaScriptで動的生成 -->
          </div>
          <button type="button" class="btn-add" id="btnAddProduct">＋ 商品を追加する</button>
        </div>

        <!-- 合計金額・ポイント表示 -->
        <div style="margin-bottom: 15px; background-color: #f8f9fa; padding: 12px; border-radius: 4px; border: 1px solid #e9ecef;">
          <div style="font-size: 14px; color: #555;">合計金額: <span id="displayPrice" style="font-size: 18px; font-weight: bold; color: #d9534f;">¥0</span></div>
          <div style="font-size: 14px; color: #555; margin-top: 5px;">獲得ポイント: <span id="displayPt" style="font-size: 16px; font-weight: bold; color: #0275d8;">0pt</span></div>
        </div>

        <!-- 5. 注文者名（連絡先） -->
        <div style="margin-bottom: 15px;">
          <label for="contact">5. 注文者名（連絡先）</label>
          <input type="text" id="contact" name="contact" required>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">注文を送信する</button>
      </form>
    </div>

    <!-- 2. 送信完了画面 -->
    <div id="completeSection" style="display: none; text-align: center;">
      <h2 style="color: #28a745; margin-top: 10px;">✅ ご注文を受け付けました</h2>
      <p style="font-size: 14px; color: #555;">スプレッドシートへの記録が正常に完了いたしました。</p>
      
      <div class="summary-box">
        <h4 style="margin-top: 0; margin-bottom: 10px; border-bottom: 1px solid #ccc; padding-bottom: 5px;">【ご注文内容の控え】</h4>
        <div class="summary-item">発注月度: <strong id="sumMonth"></strong></div>
        <div class="summary-item">購入会員番号: <strong id="sumMemberId"></strong></div>
        <div class="summary-item">ポジション名: <strong id="sumPosition"></strong></div>
        
        <div class="summary-item" style="margin-top: 10px; font-weight: bold;">ご注文製品一覧:</div>
        <div id="sumProductList" class="product-list-summary"></div>

        <div class="summary-item">総合計金額: <strong id="sumPrice" style="color: #d9534f;"></strong></div>
        <div class="summary-item">総獲得ポイント: <strong id="sumPt" style="color: #0275d8;"></strong></div>
        <div class="summary-item">注文者名: <strong id="sumContact"></strong></div>
      </div>

      <p style="font-size: 12px; color: #888; margin-top: 15px;">※この画面をスクリーンショットして保管してください。</p>
      
      <button onclick="location.reload()" class="btn-reload">続けて別の注文を入力する</button>
    </div>

  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxSS7HPjWxDYajNI9elvw5eKbE8PWytInY-wJZgss4PqlTQN56IPoZRcgKi2dClM6t5/exec";

    const productMaster = {
      "OX-288": { price: 13800, pt: { "7月度": 10000, "8月度": 10000 } },
      "OX-288(追加購入)": { price: 13800, pt: { "7月度": 10000, "8月度": 10000 } },
      "OX-288 (ゼリータイプ)": { price: 14200, pt: { "7月度": 10000, "8月度": 10000 } },
      "ボアソン": { price: 10800, pt: { "7月度": 10000, "8月度": 10000 } },
      "ハイプロリーナ": { price: 7200, pt: { "7月度": 6000, "8月度": 6000 } },
      "ゼウス 2026": { price: 17800, pt: { "7月度": 13000, "8月度": 13000 } },
      "アルピニスト スラージュ": { price: 4000, pt: { "7月度": 1400, "8月度": 2800 } },
      "O・M・C プロテイン": { price: 6000, pt: { "7月度": 2000, "8月度": 5000 } },
      "サヴォン アンベリール (120g)": { price: 5200, pt: { "7月度": 1800, "8月度": 4300 } },
      "サヴォン アンベリール (70g)": { price: 3500, pt: { "7月度": 1200, "8月度": 2900 } },
      "ブランシュール (150g)": { price: 12200, pt: { "7月度": 10500, "8月度": 10500 } },
      "ブブランシュール (80g)": { price: 6800, pt: { "7月度": 5800, "8月度": 5800 } },
      "デマキヤン": { price: 4100, pt: { "7月度": 1500, "8月度": 3400 } },
      "赤化粧水": { price: 3600, pt: { "7月度": 1300, "8月度": 3000 } },
      "赤美容液": { price: 6400, pt: { "7月度": 2300, "8月度": 5400 } },
      "赤ジェル": { price: 4800, pt: { "7月度": 1700, "8月度": 4000 } },
      "白化粧水": { price: 3600, pt: { "7月度": 3000, "8月度": 3000 } },
      "白美容液": { price: 6400, pt: { "7月度": 5400, "8月度": 5400 } },
      "白ジェル": { price: 4800, pt: { "7月度": 4000, "8月度": 4000 } },
      "グルナードゥ": { price: 32000, pt: { "7月度": 26000, "8月度": 26000 } },
      "リペアセラム": { price: 14800, pt: { "7月度": 15000, "8月度": 15000 } },
      "リペアクリーム": { price: 18700, pt: { "7月度": 6600, "8月度": 15000 } },
      "レボリューション": { price: 17200, pt: { "7月度": 9000, "8月度": 14500 } },
      "グロウジェルクリーム": { price: 9800, pt: { "7月度": 3600, "8月度": 8000 } },
      "ハンドモイスチャー": { price: 2200, pt: { "7月度": 700, "8月度": 1800 } },
      "リップセラム": { price: 2000, pt: { "7月度": 600, "8月度": 1600 } },
      "ボディミルク": { price: 3200, pt: { "7月度": 1000, "8月度": 2500 } },
      "ミュー ヴィサージュ": { price: 3300, pt: { "7月度": 1200, "8月度": 2600 } },
      "ミューコール": { price: 3300, pt: { "7月度": 2600, "8月度": 2600 } },
      "バイオミスト": { price: 3700, pt: { "7月度": 3000, "8月度": 3000 } },
      "ボディソープ": { price: 3200, pt: { "7月度": 2500, "8月度": 2500 } },
      "シャンプー": { price: 3200, pt: { "7月度": 1000, "8月度": 2500 } },
      "トリートメント": { price: 3200, pt: { "7月度": 1000, "8月度": 2500 } },
      "ヘアマスク": { price: 3200, pt: { "7月度": 1000, "8月度": 2500 } },
      "スカルプトナー": { price: 9200, pt: { "7月度": 7500, "8月度": 7500 } },
      "クレオ デンタルクリーン": { price: 2200, pt: { "7月度": 700, "8月度": 1800 } },
      "クレオ マウスウォッシュ": { price: 3200, pt: { "7月度": 1000, "8月度": 2500 } },
      "アロマオイル ローズ": { price: 8700, pt: { "7月度": 3000, "8月度": 7300 } },
      "ゼウス オードゥ パルファン 2026": { price: 21000, pt: { "7月度": 16000, "8月度": 18000 } },
      "モン コパン": { price: 3500, pt: { "7月度": 2800, "8月度": 2800 } },
      "モン コパン ジュレ": { price: 3500, pt: { "7月度": 2800, "8月度": 2800 } }
    };

    window.addEventListener('DOMContentLoaded', () => {
      // 枝番（01〜20）自動生成
      const memberIdSub = document.getElementById('memberIdSub');
      for (let i = 1; i <= 20; i++) {
        const opt = document.createElement('option');
        const val = String(i).padStart(2, '0');
        opt.value = val;
        opt.textContent = val;
        memberIdSub.appendChild(opt);
      }

      // 最初の商品行を作成
      addProductRow();
    });

    // 商品行の追加処理
    function addProductRow() {
      const container = document.getElementById('productContainer');
      const row = document.createElement('div');
      row.className = 'flex-row product-row';

      let productOptions = '<option value="">製品を選択</option>';
      for (let key in productMaster) {
        productOptions += `<option value="${key}">${key}</option>`;
      }

      let qtyOptions = '';
      for (let i = 1; i <= 20; i++) {
        qtyOptions += `<option value="${i}">${i}個</option>`;
      }

      const isFirst = container.children.length === 0;

      row.innerHTML = `
        <select class="prod-select" style="flex: 2;" required>${productOptions}</select>
        <select class="qty-select" style="width: 80px;" required>${qtyOptions}</select>
        ${!isFirst ? '<button type="button" class="btn-remove">✕</button>' : ''}
      `;

      container.appendChild(row);

      row.querySelector('.prod-select').addEventListener('change', updateCalc);
      row.querySelector('.qty-select').addEventListener('change', updateCalc);

      if (!isFirst) {
        row.querySelector('.btn-remove').addEventListener('click', () => {
          container.removeChild(row);
          updateCalc();
        });
      }
    }

    document.getElementById('btnAddProduct').addEventListener('click', addProductRow);
    document.getElementById('month').addEventListener('change', updateCalc);

    let currentGrandTotal = 0;
    let currentGrandPt = 0;
    let currentItemsData = [];

    // 計算処理
    function updateCalc() {
      const month = document.getElementById('month').value;
      const rows = document.querySelectorAll('.product-row');
      
      currentGrandTotal = 0;
      currentGrandPt = 0;
      currentItemsData = [];

      rows.forEach(row => {
        const prod = row.querySelector('.prod-select').value;
        const qty = parseInt(row.querySelector('.qty-select').value) || 1;

        if (prod && productMaster[prod]) {
          const itemPrice = productMaster[prod].price * qty;
          let itemPt = 0;
          if (month && productMaster[prod].pt[month]) {
            itemPt = productMaster[prod].pt[month] * qty;
          }

          currentGrandTotal += itemPrice;
          currentGrandPt += itemPt;

          currentItemsData.push({
            product: prod,
            quantity: qty + "個",
            price: "¥" + itemPrice.toLocaleString(),
            pt: itemPt.toLocaleString() + "pt"
          });
        }
      });

      document.getElementById('displayPrice').textContent = "¥" + currentGrandTotal.toLocaleString();
      document.getElementById('displayPt').textContent = currentGrandPt.toLocaleString() + "pt";
    }

    // 送信処理
    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();

      if (currentItemsData.length === 0) {
        alert("製品を選択してください。");
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = "送信中...";

      const month = document.getElementById('month').value;
      const memberId = document.getElementById('memberIdMain').value.trim() + "-" + document.getElementById('memberIdSub').value;
      const position = document.getElementById('position').value.trim();
      const contact = document.getElementById('contact').value.trim();

      const callbackName = "handleGasResponse_" + Date.now();

      const params = new URLSearchParams({
        callback: callbackName,
        month: month,
        memberId: memberId,
        position: position,
        contact: contact,
        items: JSON.stringify(currentItemsData)
      });

      const script = document.createElement('script');
      script.src = `${GAS_URL}?${params.toString()}`;

      window[callbackName] = function(response) {
        document.body.removeChild(script);
        delete window[callbackName];

        if (response && response.result === "success") {
          document.getElementById('sumMonth').textContent = month;
          document.getElementById('sumMemberId').textContent = memberId;
          document.getElementById('sumPosition').textContent = position;
          
          let listHtml = '';
          currentItemsData.forEach(item => {
            listHtml += `<div style="margin-bottom: 4px; font-size: 13px;">・${item.product} × ${item.quantity} (${item.price})</div>`;
          });
          document.getElementById('sumProductList').innerHTML = listHtml;

          document.getElementById('sumPrice').textContent = "¥" + currentGrandTotal.toLocaleString();
          document.getElementById('sumPt').textContent = currentGrandPt.toLocaleString() + "pt";
          document.getElementById('sumContact').textContent = contact;

          document.getElementById('formSection').style.display = "none";
          document.getElementById('completeSection').style.display = "block";
        } else {
          alert("送信エラー: スプレッドシートへの記録に失敗しました。\n電波状況を確認の上、もう一度お試しください。");
          submitBtn.disabled = false;
          submitBtn.textContent = "注文を送信する";
        }
      };

      script.onerror = function() {
        alert("通信エラーが発生しました。ネットワーク接続を確認してください。");
        submitBtn.disabled = false;
        submitBtn.textContent = "注文を送信する";
      };

      document.body.appendChild(script);
    });
  </script>
</body>
</html>
