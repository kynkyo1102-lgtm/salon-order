<!-- 注文送信フォーム -->
<form id="orderForm" style="max-width: 500px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>注文送信フォーム</h2>

  <!-- 1. 発注月度 -->
  <div style="margin-bottom: 15px;">
    <label for="month">1. 発注月度</label><br>
    <select id="month" name="month" style="width: 100%; padding: 8px; margin-top: 5px;" required>
      <option value="">選択してください</option>
      <option value="7月度">7月度</option>
      <option value="8月度">8月度</option>
    </select>
  </div>

  <!-- 2. 会員番号 -->
  <div style="margin-bottom: 15px;">
    <label for="memberId">2. 購入会員番号</label><br>
    <div style="display: flex; gap: 10px; align-items: center; margin-top: 5px;">
      <input type="text" id="memberIdMain" placeholder="例: 12345" style="flex: 1; padding: 8px;" required>
      <span>-</span>
      <select id="memberIdSub" style="width: 80px; padding: 8px;">
        <!-- JSで001〜020まで自動生成します -->
      </select>
    </div>
  </div>

  <!-- 3. ポジション名 -->
  <div style="margin-bottom: 15px;">
    <label for="position">3. ポジション名</label><br>
    <input type="text" id="position" name="position" style="width: 100%; padding: 8px; margin-top: 5px;" required>
  </div>

  <!-- 4. 製品名・数量 -->
  <div style="margin-bottom: 15px;">
    <label>4. 製品名 × 数量</label><br>
    <div style="display: flex; gap: 10px; margin-top: 5px;">
      <select id="product" name="product" style="flex: 2; padding: 8px;" required>
        <option value="">製品を選択</option>
        <option value="OX-288">OX-288</option>
        <option value="OX-288(追加購入)">OX-288(追加購入)</option>
        <option value="OX-288（ゼリータイプ）">OX-288（ゼリータイプ）</option>
        <option value="ボアソン">ボアソン</option>
        <option value="ハイプロリーナ">ハイプロリーナ</option>
        <option value="ゼウス 2026">ゼウス 2026</option>
        <option value="アルピニスト スラージュ">アルピニスト スラージュ</option>
        <option value="Ｏ・Ｍ・Ｃ プロテイン">Ｏ・Ｍ・Ｃ プロテイン</option>
        <option value="サヴォン アンベリール（120g）">サヴォン アンベリール（120g）</option>
        <option value="サヴォン アンベリール（70g）">サヴォン アンベリール（70g）</option>
        <option value="ブランシュール（150g）">ブランシュール（150g）</option>
        <option value="ブランシュール（80g）">ブランシュール（80g）</option>
        <option value="デマキヤン">デマキヤン</option>
        <option value="赤化粧水">赤化粧水</option>
        <option value="赤美容液">赤美容液</option>
        <option value="赤ジェル">赤ジェル</option>
      </select>

      <select id="quantity" name="quantity" style="flex: 1; padding: 8px;" required>
        <!-- JSで1〜10などの数量を選択肢として生成します -->
      </select>
    </div>

    <!-- 自動計算結果の表示スペース -->
    <div style="margin-top: 10px; padding: 10px; background-color: #f9f9f9; text-align: right; border-radius: 4px;">
      <div>合計金額: <strong id="totalPrice" style="font-size: 1.2em; color: #d9534f;">¥0</strong></div>
      <div style="font-size: 0.9em; color: #666;">（獲得ポイント: <span id="totalPt">0</span> pt）</div>
    </div>
  </div>

  <!-- 5. 連絡先 -->
  <div style="margin-bottom: 20px;">
    <label for="contact">5. 連絡先</label><br>
    <input type="text" id="contact" name="contact" placeholder="電話番号またはメールアドレス" style="width: 100%; padding: 8px; margin-top: 5px;" required>
  </div>

  <!-- 送信ボタン -->
  <button type="submit" style="width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 1em; cursor: pointer;">
    注文を送信する
  </button>
</form>
