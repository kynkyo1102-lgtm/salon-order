<!-- 注文送信フォーム -->
<form id="orderForm" style="max-width: 500px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>注文送信フォーム</h2>

  <!-- 1. 発注月度 -->
  <div style="margin-bottom: 15px;">
    <label for="month">1. 発注月度</label><br>
    <select id="month" name="month" style="width: 100%; padding: 8px; margin-top: 5px;" required>
      <option value="">選択してください</option>
      <option value="7月度">7月度</option>
      <option value="8月度">8月度</option>
    </select>
  </div>

  <!-- 2. 会員番号 -->
  <div style="margin-bottom: 15px;">
    <label for="memberId">2. 購入会員番号</label><br>
    <div style="display: flex; gap: 10px; align-items: center; margin-top: 5px;">
      <input type="text" id="memberIdMain" placeholder="例: 12345" style="flex: 1; padding: 8px;" required>
      <span>-</span>
      <select id="memberIdSub" style="width: 80px; padding: 8px;">
        <!-- JSで001〜020まで自動生成します -->
      </select>
    </div>
  </div>

  <!-- 3. ポジション名 -->
  <div style="margin-bottom: 15px;">
    <label for="position">3. ポジション名</label><br>
    <input type="text" id="position" name="position" style="width: 100%; padding: 8px; margin-top: 5px;" required>
  </div>

  <!-- 4. 製品名・数量 -->
  <div style="margin-bottom: 15px;">
    <label>4. 製品名 × 数量</label><br>
    <div style="display: flex; gap: 10px; margin-top: 5px;">
      <select id="product" name="product" style="flex: 2; padding: 8px;" required>
        <option value="">製品を選択</option>
        <option value="OX-288">OX-288</option>
        <option value="OX-288(追加購入)">OX-288(追加購入)</option>
        <option value="OX-288（ゼリータイプ）">OX-288（ゼリータイプ）</option>
        <option value="ボアソン">ボアソン</option>
        <option value="ハイプロリーナ">ハイプロリーナ</option>
        <option value="ゼウス 2026">ゼウス 2026</option>
        <option value="アルピニスト スラージュ">アルピニスト スラージュ</option>
        <option value="Ｏ・Ｍ・Ｃ プロテイン">Ｏ・Ｍ・Ｃ プロテイン</option>
        <option value="サヴォン アンベリール（120g）">サヴォン アンベリール（120g）</option>
        <option value="サヴォン アンベリール（70g）">サヴォン アンベリール（70g）</option>
        <option value="ブランシュール（150g）">ブランシュール（150g）</option>
        <option value="ブランシュール（80g）">ブランシュール（80g）</option>
        <option value="デマキヤン">デマキヤン</option>
        <option value="赤化粧水">赤化粧水</option>
        <option value="赤美容液">赤美容液</option>
        <option value="赤ジェル">赤ジェル</option>
      </select>

      <select id="quantity" name="quantity" style="flex: 1; padding: 8px;" required>
        <!-- JSで1〜10などの数量を選択肢として生成します -->
      </select>
    </div>

    <!-- 自動計算結果の表示スペース -->
    <div style="margin-top: 10px; padding: 10px; background-color: #f9f9f9; text-align: right; border-radius: 4px;">
      <div>合計金額: <strong id="totalPrice" style="font-size: 1.2em; color: #d9534f;">¥0</strong></div>
      <div style="font-size: 0.9em; color: #666;">（獲得ポイント: <span id="totalPt">0</span> pt）</div>
    </div>
  </div>

  <!-- 5. 連絡先 -->
  <div style="margin-bottom: 20px;">
    <label for="contact">5. 連絡先</label><br>
    <input type="text" id="contact" name="contact" placeholder="電話番号またはメールアドレス" style="width: 100%; padding: 8px; margin-top: 5px;" required>
  </div>

  <!-- 送信ボタン -->
  <button type="submit" style="width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 1em; cursor: pointer;">
    注文を送信する
  </button>
</form>
<script>
  // 商品データ（製品名、価格、7月度pt、8月度pt）
  const productData = {
    "OX-288": { price: 13800, pt: { "7月度": 10000, "8月度": 8000 } },
    "OX-288(追加購入)": { price: 11000, pt: { "7月度": 8000, "8月度": 8000 } },
    "OX-288（ゼリータイプ）": { price: 14000, pt: { "7月度": 10000, "8月度": 8000 } },
    "ボアソン": { price: 12500, pt: { "7月度": 9000, "8月度": 7500 } },
    "ハイプロリーナ": { price: 10500, pt: { "7月度": 7500, "8月度": 6000 } },
    "ゼウス 2026": { price: 15000, pt: { "7月度": 11000, "8月度": 9000 } },
    "アルピニスト スラージュ": { price: 13000, pt: { "7月度": 9500, "8月度": 7800 } },
    "Ｏ・Ｍ・Ｃ プロテイン": { price: 8800, pt: { "7月度": 6000, "8月度": 5000 } },
    "サヴォン アンベリール（120g）": { price: 5500, pt: { "7月度": 3500, "8月度": 3000 } },
    "サヴォン アンベリール（70g）": { price: 3500, pt: { "7月度": 2000, "8月度": 1800 } },
    "ブランシュール（150g）": { price: 6000, pt: { "7月度": 4000, "8月度": 3500 } },
    "ブランシュール（80g）": { price: 3800, pt: { "7月度": 2300, "8月度": 2000 } },
    "デマキヤン": { price: 4800, pt: { "7月度": 3000, "8月度": 2500 } },
    "赤化粧水": { price: 5000, pt: { "7月度": 3200, "8月度": 2700 } },
    "赤美容液": { price: 7500, pt: { "7月度": 5000, "8月度": 4200 } },
    "赤ジェル": { price: 6500, pt: { "7月度": 4200, "8月度": 3600 } }
  };

  // 1. 会員番号の枝番（-001〜-020）を自動生成
  const subSelect = document.getElementById("memberIdSub");
  for (let i = 1; i <= 20; i++) {
    const opt = document.createElement("option");
    const numStr = String(i).padStart(3, "0"); // 001, 002...
    opt.value = numStr;
    opt.textContent = numStr;
    subSelect.appendChild(opt);
  }

  // 2. 数量（1〜10個）の選択肢を自動生成
  const qtySelect = document.getElementById("quantity");
  for (let i = 1; i <= 10; i++) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = i + "個";
    qtySelect.appendChild(opt);
  }
  // 3. 金額とポイントを自動計算する関数
  function calculateTotal() {
    const selectedMonth = document.getElementById("month").value;
    const selectedProduct = document.getElementById("product").value;
    const quantity = parseInt(document.getElementById("quantity").value) || 1;

    let price = 0;
    let pt = 0;

    if (selectedProduct && productData[selectedProduct]) {
      price = productData[selectedProduct].price;
      // 選択された月度に応じたポイントを取得（未選択の場合は0pt）
      if (selectedMonth && productData[selectedProduct].pt[selectedMonth]) {
        pt = productData[selectedProduct].pt[selectedMonth];
      }
    }

    const totalPrice = price * quantity;
    const totalPt = pt * quantity;

    // 画面の表示を更新
    document.getElementById("totalPrice").textContent = "¥" + totalPrice.toLocaleString();
    document.getElementById("totalPt").textContent = totalPt.toLocaleString();
  }

  // 4. イベントリスナー（選択が変わったら自動計算を実行）
  document.getElementById("month").addEventListener("change", calculateTotal);
  document.getElementById("product").addEventListener("change", calculateTotal);
  document.getElementById("quantity").addEventListener("change", calculateTotal);
</script>
