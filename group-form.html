<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文送信フォーム</title>
  <style>
    body {
      margin: 0;
      padding: 10px;
      font-family: sans-serif;
      background-color: #f4f4f4;
    }
    .form-container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 15px;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    label {
      font-weight: bold;
      font-size: 15px;
      display: block;
      margin-bottom: 5px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .flex-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
    .btn-submit:disabled {
      background-color: #ccc;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2 style="font-size: 1.3em; text-align: center; margin-top: 5px; margin-bottom: 20px;">注文送信フォーム</h2>

  <form id="orderForm">
    <!-- 1. 発注月度 -->
    <div style="margin-bottom: 15px;">
      <label for="month">1. 発注月度</label>
      <select id="month" name="month" required>
        <option value="">選択してください</option>
        <option value="7月度">7月度</option>
        <option value="8月度">8月度</option>
      </select>
    </div>

    <!-- 2. 会員番号 -->
    <div style="margin-bottom: 15px;">
      <label>2. 購入会員番号</label>
      <div class="flex-row">
        <input type="text" id="memberIdMain" placeholder="例: 12345" style="flex: 1;" required>
        <span>-</span>
        <select id="memberIdSub" style="width: 85px;">
          <!-- JSで自動生成（2桁） -->
        </select>
      </div>
    </div>

    <!-- 3. ポジション名 -->
    <div style="margin-bottom: 15px;">
      <label for="position">3. ポジション名</label>
      <input type="text" id="position" name="position" required>
    </div>

    <!-- 4. 製品名・数量 -->
    <div style="margin-bottom: 15px;">
      <label>4. 製品名 × 数量</label>
      <div class="flex-row">
        <select id="product" name="product" style="flex: 2;" required>
          <option value="">製品を選択</option>
          <option value="OX-288">OX-288</option>
          <option value="OX-288(追加購入)">OX-288(追加購入)</option>
          <option value="OX-288 (ゼリータイプ)">OX-288 (ゼリータイプ)</option>
          <option value="ボアソン">ボアソン</option>
          <option value="ハイプロリーナ">ハイプロリーナ</option>
          <option value="ゼウス 2026">ゼウス 2026</option>
          <option value="アルピニスト スラージュ">アルピニスト スラージュ</option>
          <option value="O・M・C プロテイン">O・M・C プロテイン</option>
          <option value="サヴォン アンベリール (120g)">サヴォン アンベリール (120g)</option>
          <option value="サヴォン アンベリール (70g)">サヴォン アンベリール (70g)</option>
          <option value="ブランシュール (150g)">ブランシュール (150g)</option>
          <option value="ブブランシュール (80g)">ブブランシュール (80g)</option>
          <option value="デマキヤン">デマキヤン</option>
          <option value="赤化粧水">赤化粧水</option>
          <option value="赤美容液">赤美容液</option>
          <option value="赤ジェル">赤ジェル</option>
          <option value="白化粧水">白化粧水</option>
          <option value="白美容液">白美容液</option>
          <option value="白ジェル">白ジェル</option>
          <option value="グルナードゥ">グルナードゥ</option>
          <option value="リペアセラム">リペアセラム</option>
          <option value="リペアクリーム">リペアクリーム</option>
          <option value="レボリューション">レボリューション</option>
          <option value="グロウジェルクリーム">グロウジェルクリーム</option>
          <option value="ハンドモイスチャー">ハンドモイスチャー</option>
          <option value="リップセラム">リップセラム</option>
          <option value="ボディミルク">ボディミルク</option>
          <option value="ミュー ヴィサージュ">ミュー ヴィサージュ</option>
          <option value="ミューコール">ミューコール</option>
          <option value="バイオミスト">バイオミスト</option>
          <option value="ボディソープ">ボディソープ</option>
          <option value="シャンプー">シャンプー</option>
          <option value="トリートメント">トリートメント</option>
          <option value="ヘアマスク">ヘアマスク</option>
          <option value="スカルプトナー">スカルプトナー</option>
          <option value="クレオ デンタルクリーン">クレオ デンタルクリーン</option>
          <option value="クレオ マウスウォッシュ">クレオ マウスウォッシュ</option>
          <option value="アロマオイル ローズ">アロマオイル ローズ</option>
          <option value="ゼウス オードゥ パルファン 2026">ゼウス オードゥ パルファン 2026</option>
          <option value="モン コパン">モン コパン</option>
          <option value="モン コパン ジュレ">モン コパン ジュレ</option>
        </select>

        <select id="quantity" name="quantity" style="flex: 1;" required>
          <!-- JSで自動生成（1〜20個） -->
        </select>
      </div>

      <!-- 計算結果 -->
      <div style="margin-top: 10px; padding: 10px; background-color: #f9f9f9; text-align: right; border-radius: 4px;">
        <div style="font-size: 1em;">合計金額: <strong id="totalPrice" style="font-size: 1.2em; color: #d9534f;">¥0</strong></div>
        <div style="font-size: 0.9em; color: #666; margin-top: 2px;">（獲得ポイント: <span id="totalPt">0</span> pt）</div>
      </div>
    </div>

    <!-- 5. 注文者名（連絡先） -->
    <div style="margin-bottom: 15px;">
      <label for="contact">5. 注文者名（連絡先）</label>
      <input type="text" id="contact" name="contact" required>
    </div>

    <!-- 送信ボタン -->
    <button type="submit" id="submitBtn" class="btn-submit">注文を送信する</button>
  </form>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxSS7HPjWxDYajNI9elvw5eKbE8PWytInY-wJZgss4PqlTQN56IPoZRcgKi2dClM6t5/exec";

const productData = {
  "OX-288": { price: 13800, pt: { "7月度": 10000, "8月度": 10000 } },
  "OX-288(追加購入)": { price: 13800, pt: { "7月度": 10000, "8月度": 10000 } },
  "OX-288 (ゼリータイプ)": { price: 14200, pt: { "7月度": 10000, "8月度": 10000 } },
  "ボアソン": { price: 10800, pt: { "7月度": 10000, "8月度": 10000 } },
  "ハイプロリーナ": { price: 7200, pt: { "7月度": 6000, "8月度": 6000 } },
  "ゼウス 2026": { price: 17800, pt: { "7月度": 13000, "8月度": 13000 } },
  "アルピニスト スラージュ": { price: 4000, pt: { "7月度": 1400, "8月度": 2800 } },
  "O・M・C プロテイン": { price: 6000, pt: { "7月度": 2000, "8月度": 5000 } },
  "サヴォン アンベリール (120g)": { price: 5200, pt: { "7月度": 1800, "8月度": 4300 } },
  "サヴォン アンベリール (70g)": { price: 3500, pt: { "7月度": 1200, "8月度": 2900 } },
  "ブランシュール (150g)": { price: 12200, pt: { "7月度": 10500, "8月度": 10500 } },
  "ブブランシュール (80g)": { price: 6800, pt: { "7月度": 5800, "8月度": 5800 } },
  "デマキヤン": { price: 4100, pt: { "7月度": 1500, "8月度": 3400 } },
  "赤化粧水": { price: 3600, pt: { "7月度": 1300, "8月度": 3000 } },
  "赤美容液": { price: 6400, pt: { "7月度": 2300, "8月度": 5400 } },
  "赤ジェル": { price: 4800, pt: { "7月度": 1700, "8月度": 4000 } },
  "白化粧水": { price: 3600, pt: { "7月度": 3000, "8月度": 3000 } },
  "白美容液": { price: 6400, pt: { "7月度": 5400, "8月度": 5400 } },
  "白ジェル": { price: 4800, pt: { "7月度": 4000, "8月度": 4000 } },
  "グルナードゥ": { price: 32000, pt: { "7月度": 26000, "8月度": 26000 } },
  "リペアセラム": { price: 14800, pt: { "7月度": 15000, "8月度": 15000 } },
  "リペアクリーム": { price: 18700, pt: { "7月度": 6600, "8月度": 15000 } },
  "レボリューション": { price: 17200, pt: { "7月度": 9000, "8月度": 14500 } },
  "グロウジェルクリーム": { price: 9800, pt: { "7月度": 3600, "8月度": 8000 } },
  "ハンドモイスチャー": { price: 2200, pt: { "7月度": 700, "8月度": 1800 } },
  "リップセラム": { price: 2000, pt: { "7月度": 600, "8月度": 1600 } },
  "ボディミルク": { price: 3200, pt: { "7月度": 1000, "8月度": 2500 } },
  "ミュー ヴィサージュ": { price: 3300, pt: { "7月度": 1200, "8月度": 2600 } },
  "ミューコール": { price: 3300, pt: { "7月度": 2600, "8月度": 2600 } },
  "バイオミスト": { price: 3700, pt: { "7月度": 3000, "8月度": 3000 } },
  "ボディソープ": { price: 3200, pt: { "7月度": 2500, "8月度": 2500 } },
  "シャンプー": { price: 3200, pt: { "7月度": 1000, "8月度": 2500 } },
  "トリートメント": { price: 3200, pt: { "7月度": 1000, "8月度": 2500 } },
  "ヘアマスク": { price: 3200, pt: { "7月度": 1000, "8月度": 2500 } },
  "スカルプトナー": { price: 9200, pt: { "7月度": 7500, "8月度": 7500 } },
  "クレオ デンタルクリーン": { price: 2200, pt: { "7月度": 700, "8月度": 1800 } },
  "クレオ マウスウォッシュ": { price: 3200, pt: { "7月度": 1000, "8月度": 2500 } },
  "アロマオイル ローズ": { price: 8700, pt: { "7月度": 3000, "8月度": 7300 } },
  "ゼウス オードゥ パルファン 2026": { price: 21000, pt: { "7月度": 16000, "8月度": 18000 } },
  "モン コパン": { price: 3500, pt: { "7月度": 2800, "8月度": 2800 } },
  "モン コパン ジュレ": { price: 3500, pt: { "7月度": 2800, "8月度": 2800 } }
};

window.addEventListener("DOMContentLoaded", () => {
  // 枝番生成（2桁: 01〜20）
  const subSelect = document.getElementById("memberIdSub");
  for (let i = 1; i <= 20; i++) {
    const opt = document.createElement("option");
    const numStr = String(i).padStart(2, "0");
    opt.value = numStr;
    opt.textContent = numStr;
    subSelect.appendChild(opt);
  }

  // 数量生成（1〜20個）
  const qtySelect = document.getElementById("quantity");
  for (let i = 1; i <= 20; i++) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = i + "個";
    qtySelect.appendChild(opt);
  }

  // 計算処理
  function calculateTotal() {
    const selectedMonth = document.getElementById("month").value;
    const selectedProduct = document.getElementById("product").value;
    const quantity = parseInt(document.getElementById("quantity").value) || 1;

    let price = 0;
    let pt = 0;

    if (selectedProduct && productData[selectedProduct]) {
      price = productData[selectedProduct].price;
      if (selectedMonth && productData[selectedProduct].pt[selectedMonth]) {
        pt = productData[selectedProduct].pt[selectedMonth];
      }
    }

    const totalPrice = price * quantity;
    const totalPt = pt * quantity;

    document.getElementById("totalPrice").textContent = "¥" + totalPrice.toLocaleString();
    document.getElementById("totalPt").textContent = totalPt.toLocaleString();
    return { totalPrice, totalPt };
  }

  document.getElementById("month").addEventListener("change", calculateTotal);
  document.getElementById("product").addEventListener("change", calculateTotal);
  document.getElementById("quantity").addEventListener("change", calculateTotal);

  // 送信処理
  document.getElementById("orderForm").addEventListener("submit", (e) => {
    e.preventDefault();

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "送信中...";

    const totals = calculateTotal();
    const mainId = document.getElementById("memberIdMain").value.trim();
    const subId = document.getElementById("memberIdSub").value;

    const payload = {
      month: document.getElementById("month").value,
      memberId: mainId + "-" + subId,
      position: document.getElementById("position").value,
      product: document.getElementById("product").value,
      quantity: document.getElementById("quantity").value + "個",
      totalPrice: "¥" + totals.totalPrice.toLocaleString(),
      totalPt: totals.totalPt + "pt",
      contact: document.getElementById("contact").value
    };

    fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      alert("ご注文を受け付けました。ありがとうございました！");
      document.getElementById("orderForm").reset();
      calculateTotal();
    })
    .catch((err) => {
      alert("送信に失敗しました。時間をおいて再度お試しください。");
      console.error(err);
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = "注文を送信する";
    });
  });
});
</script>

</body>
</html>
