<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プラッス ドゥ ニナ 南熊本店</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Supabase JSライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="style.css?v=4">

  <style>
    .auth-card { background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .auth-title { font-weight: bold; font-size: 0.9rem; color: var(--wood-dark); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .auth-desc { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 12px; line-height: 1.4; }
    .auth-form { display: flex; flex-direction: column; gap: 10px; }
    .auth-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.85rem; box-sizing: border-box; background-color: #fcfbfa; color: #333333; }
    .auth-btn-group { display: flex; gap: 8px; margin-top: 4px; }
    .auth-btn-main { flex: 1; padding: 9px; background-color: var(--wood-dark); color: #ffffff; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
    .auth-btn-sub { flex: 1; padding: 9px; background-color: #ffffff; color: var(--wood-dark); border: 1px solid var(--wood-dark); border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
    .user-info-box { display: flex; align-items: center; justify-content: space-between; background-color: #f7f3ed; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border-color); }
    #newsContainerArea { margin-bottom: 20px; }
    .hero-order-section { margin-bottom: 24px; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="header-logo">Place de Nina</a>
    <h1>プラッス ドゥ ニナ 南熊本店</h1>
  </header>

  <main>
    <div class="auth-card">
      <div id="authLoggedOut">
        <div class="auth-title">🔐 メンバーログイン / 会員登録</div>
        <p class="auth-desc">ログインすると、お届先情報などが保存され共有して利用できます。</p>
        <div class="auth-form">
          <input type="email" id="authEmail" class="auth-input" placeholder="メールアドレス">
          <input type="password" id="authPassword" class="auth-input" placeholder="パスワード（6文字以上）">
          <div class="auth-btn-group">
            <button type="button" class="auth-btn-main" onclick="handleLogin()">ログイン</button>
            <button type="button" class="auth-btn-sub" onclick="handleSignUp()">新規登録</button>
          </div>
        </div>
      </div>

      <div id="authLoggedIn" style="display: none;">
        <div class="auth-title">👤 マイページ</div>
        <div class="user-info-box">
          <div>
            <span style="font-size: 0.75rem; color: var(--text-sub);">ログイン中のアカウント</span>
            <div id="userEmailDisplay" style="font-size: 0.88rem; font-weight: bold; color: var(--wood-dark);"></div>
          </div>
          <button type="button" onclick="handleLogout()" style="padding: 6px 12px; background: #ffffff; border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; font-size: 0.78rem; font-weight: bold; color: var(--wood-dark);">ログアウト</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Supabase 初期化のテスト
    let supabase;
    try {
      const SUPABASE_URL = 'https://foeyyrbftaiscxijgvjv.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_7IVQaL-0ptbvQ_DSmK9BTQ_fEajO01E';
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      console.log("Supabase初期化成功");
    } catch (e) {
      alert("Supabaseの初期化に失敗しました: " + e.message);
    }

    // 認証状態の確認
    async function checkAuth() {
      if (!supabase) return;
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
          document.getElementById('authLoggedOut').style.display = 'none';
          document.getElementById('authLoggedIn').style.display = 'block';
          document.getElementById('userEmailDisplay').textContent = user.email;
        } else {
          document.getElementById('authLoggedOut').style.display = 'block';
          document.getElementById('authLoggedIn').style.display = 'none';
        }
      } catch (e) {
        console.error("認証チェックエラー:", e);
      }
    }

    // 新規登録処理（デバッグアラート追加）
    async function handleSignUp() {
      alert('新規登録ボタンが押されました');
      
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      
      if (!email || !password) {
        alert('メールアドレスとパスワードを入力してください。');
        return;
      }
      if (password.length < 6) {
        alert('パスワードは6文字以上で設定してください。');
        return;
      }

      alert('Supabaseへ登録リクエストを送信します...');
      
      try {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) {
          alert('登録エラー発生: ' + error.message);
        } else {
          alert('登録処理が完了しました！');
          checkAuth();
        }
      } catch (err) {
        alert('通信例外エラー: ' + err.message);
      }
    }

    // ログイン処理
    async function handleLogin() {
      alert('ログインボタンが押されました');
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      
      if (!email || !password) {
        alert('メールアドレスとパスワードを入力してください。');
        return;
      }

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          alert('ログインエラー発生: ' + error.message);
        } else {
          alert('ログイン成功！');
          checkAuth();
        }
      } catch (err) {
        alert('通信例外エラー: ' + err.message);
      }
    }

    async function handleLogout() {
      if (!supabase) return;
      await supabase.auth.signOut();
      alert('ログアウトしました。');
      checkAuth();
    }

    window.addEventListener('DOMContentLoaded', () => {
      checkAuth();
    });
  </script>
</body>
</html>
