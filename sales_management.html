<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サロン注文管理アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4 font-sans">

  <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold mb-4 text-center text-pink-600">サロン注文管理</h1>

    <!-- ログイン画面 -->
    <div id="login-section" class="space-y-4">
      <p class="text-sm text-gray-500 mb-4">メールアドレスとパスワードでログイン・登録してください。</p>
      <input type="email" id="email" placeholder="メールアドレス" class="w-full p-3 border rounded-lg">
      <input type="password" id="password" placeholder="パスワード" class="w-full p-3 border rounded-lg">
      <button onclick="signUp()" class="w-full bg-gray-500 text-white p-3 rounded-lg font-bold">新規登録</button>
      <button onclick="signIn()" class="w-full bg-pink-500 text-white p-3 rounded-lg font-bold mt-2">ログイン</button>
    </div>

    <!-- メイン画面（ログイン後に表示） -->
    <div id="main-section" class="hidden space-y-6">
      <button onclick="signOut()" class="text-sm text-gray-400 underline float-right">ログアウト</button>
      
      <!-- 入力フォーム -->
      <div class="bg-pink-50 p-4 rounded-lg border border-pink-100 mt-8">
        <h2 class="font-bold mb-3 text-pink-700">＋ 新しい注文を登録</h2>
        <input type="text" id="customer" placeholder="お客さま名" class="w-full p-2 mb-2 border rounded">
        <input type="text" id="line_num" placeholder="LINEノート番号" class="w-full p-2 mb-2 border rounded">
        <input type="number" id="amount" placeholder="金額 (円)" class="w-full p-2 mb-2 border rounded">
        
        <select id="payment" class="w-full p-2 mb-2 border rounded bg-white">
          <option value="振込">振込</option>
          <option value="クレカ">クレジットカード</option>
          <option value="PayPay">PayPay</option>
        </select>

        <select id="status" class="w-full p-2 mb-4 border rounded bg-white">
          <option value="未払い">未払い</option>
          <option value="支払済">支払済</option>
        </select>

        <button onclick="addOrder()" class="w-full bg-pink-500 text-white p-3 rounded-lg font-bold shadow">登録する</button>
      </div>

      <!-- 未払い（振込）の自動計算・一覧 -->
      <div>
        <h2 class="font-bold text-lg mb-2 border-b pb-1">振込の未払い一覧</h2>
        <p class="text-xl font-bold text-red-500 mb-3">未払い合計: <span id="total-amount">0</span> 円</p>
        <div id="order-list" class="space-y-3">
          <!-- ここにデータが自動で入ります -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // Supabaseの設定情報
    const SUPABASE_URL = 'https://rukbcklehpbnkksecmng.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_HOZYGWTx-EunPVG_mnFvlw_EA3PZWP_';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 画面の切り替え
    async function checkUser() {
      const { data: { user } } = await supabase.auth.getUser();
      if (user) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('main-section').classList.remove('hidden');
        fetchOrders();
      } else {
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('main-section').classList.add('hidden');
      }
    }

    // ログイン・登録・ログアウト処理
    async function signUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabase.auth.signUp({ email, password });
      if (error) alert(error.message); else alert("登録処理を行いました。ログインをお試しください。");
      checkUser();
    }
    
    async function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) alert("ログイン失敗: " + error.message);
      checkUser();
    }

    async function signOut() {
      await supabase.auth.signOut();
      checkUser();
    }

    // データの登録
    async function addOrder() {
      const customer_name = document.getElementById('customer').value;
      const line_note_number = document.getElementById('line_num').value;
      const amount = document.getElementById('amount').value;
      const payment_method = document.getElementById('payment').value;
      const status = document.getElementById('status').value;

      if (!customer_name || !amount) {
        alert("名前と金額は入力してください");
        return;
      }

      const { error } = await supabase.from('orders').insert([
        { customer_name, line_note_number, amount: parseInt(amount), payment_method, status }
      ]);

      if (error) {
        alert("エラーが発生しました: " + error.message);
      } else {
        alert("登録しました！");
        document.getElementById('customer').value = '';
        document.getElementById('line_num').value = '';
        document.getElementById('amount').value = '';
        fetchOrders();
      }
    }

    // 未払いデータの取得と自動計算
    async function fetchOrders() {
      const { data, error } = await supabase
        .from('orders')
        .select('*')
        .eq('payment_method', '振込')
        .eq('status', '未払い')
        .order('created_at', { ascending: false });

      if (error) return console.error(error);

      const listDiv = document.getElementById('order-list');
      listDiv.innerHTML = '';
      let total = 0;

      data.forEach(order => {
        total += order.amount;
        listDiv.innerHTML += `
          <div class="bg-white p-3 rounded shadow-sm border border-gray-200 flex justify-between items-center">
            <div>
              <p class="font-bold">${order.customer_name} <span class="text-xs text-gray-400">#${order.line_note_number || '-'}</span></p>
              <p class="text-pink-600 font-bold">¥${order.amount.toLocaleString()}</p>
            </div>
            <button onclick="markAsPaid('${order.id}')" class="text-sm bg-green-500 text-white px-3 py-1 rounded">支払済にする</button>
          </div>
        `;
      });

      document.getElementById('total-amount').innerText = total.toLocaleString();
    }

    // 支払済への変更
    async function markAsPaid(id) {
      if(!confirm("支払済にしますか？")) return;
      const { error } = await supabase.from('orders').update({ status: '支払済' }).eq('id', id);
      if (error) alert(error.message);
      fetchOrders();
    }

    // アプリ起動時にログインチェック
    checkUser();
  </script>
</body>
</html>
