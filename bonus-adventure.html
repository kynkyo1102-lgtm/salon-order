<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>サファイアへの道｜メンバーズWebガイド</title>
<link rel="stylesheet" href="./guide-shared-chrome.css"><link rel="stylesheet" href="./guide-design-system.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans JP",system-ui,sans-serif;color:#273544;background:#fff;line-height:1.75}.game{max-width:860px;margin:auto;padding:25px 20px 90px}.crumb{font-size:13px;margin-bottom:34px}.crumb a{color:#0055a4}.eyebrow{font-size:12px;color:#0055a4;font-weight:800;letter-spacing:.12em}h1{font-size:clamp(29px,6vw,43px);color:#0055a4;margin:4px 0 12px}h2{font-size:20px;color:#0055a4;margin:0}.intro{color:#526778}.panel{border:1px solid #d8e5ed;border-radius:20px;padding:22px;background:#fff;margin:22px 0;box-shadow:4px 5px 0 #eaf1f5}.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.stat{background:#f2f7fb;border-radius:12px;padding:12px 6px;text-align:center}.stat small{display:block;color:#607284;font-size:11px}.stat strong{font-size:19px;color:#0055a4}.track{display:flex;gap:5px;margin:15px 0}.track span{height:6px;flex:1;background:#dce7ee;border-radius:9px}.track span.on{background:#0055a4}.org{width:100%;max-width:500px;display:block;margin:10px auto}.node{fill:#9caab3}.node.active{fill:#368469}.node.me{fill:#0055a4}.node.new{fill:#e5a23c}.edge{stroke:#91aeb9;stroke-width:2.5;fill:none}.person-label{fill:white;text-anchor:middle;font-size:13px;font-weight:700}.choice{display:block;width:100%;border:2px solid #d7e5ee;border-radius:13px;padding:14px;text-align:left;background:#fff;margin:9px 0;color:#273544;font-weight:700;cursor:pointer}.choice.selected{border-color:#0055a4;background:#eef6fd}.action{background:#0055a4;color:#fff;border:0;border-radius:13px;padding:13px 23px;font:inherit;font-weight:700;cursor:pointer}.action:disabled{opacity:.4;cursor:default}.secondary{background:#f1f6fa;color:#0055a4}.buttons{display:flex;gap:10px;justify-content:space-between;margin-top:18px}.result{background:#f3f8f4;border-left:4px solid #368469;padding:15px;border-radius:10px;margin-top:15px}.note{font-size:12px;color:#647586}.hidden{display:none}@media(max-width:500px){.game{padding:18px 15px 75px}.panel{padding:15px}.stat strong{font-size:16px}.choice{font-size:14px}} 
</style></head><body class="registration-guide"><main class="game">
<nav class="crumb"><a href="./ninaguide.html">メンバーズガイド</a> › ボーナスプラン体験</nav>
<div class="eyebrow">BONUS PLAN EXPERIENCE</div><h1>サファイアへの道</h1>
<p class="intro">架空の組織を育てながら、購入ポイント・アクティブ人数・紹介関係がボーナスにどう関係するかを考えてみましょう。</p>
<div class="panel"><div class="eyebrow" id="chapter">CHAPTER 1 / 4</div><h2 id="heading"></h2><div class="track" id="track"></div><p id="story"></p>
<div class="status"><div class="stat"><small>左グループ</small><strong id="left"></strong></div><div class="stat"><small>右グループ</small><strong id="right"></strong></div><div class="stat"><small>活動人数（例）</small><strong id="active"></strong></div></div>
<svg class="org" viewBox="0 0 340 235" role="img" aria-label="架空の組織図">
<g class="edge"><path d="M170 47 L90 95 M170 47 L250 95 M90 116 L45 167 M90 116 L133 167 M250 116 L210 167 M250 116 L295 167"/><path id="newEdge" d="M295 188 L295 216" class="hidden"/></g>
<g id="people"></g></svg>
<div id="prompt"></div><div id="choices"></div><div id="result" class="result hidden" aria-live="polite"></div>
<div class="buttons"><button class="action secondary" id="back" type="button">← 戻る</button><button class="action" id="next" type="button">結果を見る</button></div></div>
<p class="note">※学習用の試作品です。人物・購入ポイント・活動状況は架空の設定です。表示するポイントはボーナス支給額ではありません。実際の会員配置やランク認定、報酬計算は制度上の条件に従います。報酬目的の不要な購入を推奨するものではありません。</p>
</main><script>
const chapters=[
{title:"最初の組織を知ろう",story:"あなたはメンバー。まずは左右のグループに購入実績がある架空の組織を見てみましょう。",left:30,right:20,active:["A","B","C"],question:"この組織で最初に確認したいことは？",choices:["左右のポイントの違い","活動している人の人数"],results:["左右の実績には10万Pの差があります。ボーナスによっては左右それぞれの実績が計算に関係します。","現在の活動人数は3人という仮設定です。アクティブ人数を条件とするボーナスでは、誰が条件を満たすかが重要です。"]},
{title:"Dさんの活動が変わった！",story:"Dさんが今月アクティブになり、左グループに10万Pの実績が加わったとします。",left:40,right:20,active:["A","B","C","D"],changed:"D",question:"この変化で注目するのは？",choices:["左の実績が増えたこと","活動人数が増えたこと"],results:["左の実績は40万Pになりました。総実績が増えても、左右のバランスによってボーナスへの影響は異なります。","活動人数は4人になりました。人数条件だけでなく、各人の紹介関係なども確認する必要があります。"]},
{title:"Fさんもアクティブに",story:"翌月の架空の出来事として、Fさんもアクティブになり、右グループに10万Pが加わったとします。",left:40,right:30,active:["A","B","C","D","F"],changed:"F",question:"左右のポイント差はどうなった？",choices:["縮まった","広がった"],results:["正解！ 差は20万Pから10万Pに縮まりました。左右の実績を使う計算では、この変化が重要です。","もう一度数字を比べてみましょう。前は40万Pと20万P、今は40万Pと30万Pです。差は縮まっています。"]},
{title:"新しいGさんが加わる",story:"今度は新しいGさんが組織に加わりました。ここからは紹介関係も考えていきます。",left:40,right:30,active:["A","B","C","D","F"],changed:"G",newPerson:true,question:"新規登録で確認すべきことは？",choices:["どの人の紹介による登録か","人数が増えたことだけ"],results:["そのとおり。紹介関係は、直接紹介者・二次紹介者に関係するボーナスを考えるうえで重要です。","人数だけでは判断できません。誰が紹介したか、どのグループに属するかなど、制度上の関係を確認する必要があります。"]}
];
let step=0,selection=null,revealed=false;const $=id=>document.getElementById(id);
function draw(){const c=chapters[step];$("chapter").textContent="CHAPTER "+(step+1)+" / "+chapters.length;$("heading").textContent=c.title;$("story").textContent=c.story;$("left").textContent=c.left+"万P";$("right").textContent=c.right+"万P";$("active").textContent=c.active.length+"人";$("track").innerHTML=chapters.map((_,i)=>'<span class="'+(i<=step?'on':'')+'"></span>').join("");$("prompt").textContent=c.question;$("choices").replaceChildren();c.choices.forEach((t,i)=>{const b=document.createElement("button");b.type="button";b.className="choice"+(selection===i?" selected":"");b.textContent=t;b.setAttribute("aria-pressed",selection===i);b.addEventListener("click",()=>{selection=i;revealed=false;draw()});$("choices").append(b)});$("result").classList.toggle("hidden",!revealed);$("result").textContent=revealed&&selection!==null?c.results[selection]:"";$("back").disabled=step===0;$("next").disabled=selection===null;$("next").textContent=revealed?(step===chapters.length-1?"最初から遊ぶ":"次の章へ"):"結果を見る";
const people=[["自分",170,29],["A",90,103],["B",250,103],["C",45,176],["D",133,176],["E",210,176],["F",295,176]];if(c.newPerson)people.push(["G",295,225]);$("newEdge").classList.toggle("hidden",!c.newPerson);const ns="http://www.w3.org/2000/svg";$("people").replaceChildren();people.forEach(([name,x,y])=>{const circle=document.createElementNS(ns,"circle");circle.setAttribute("cx",x);circle.setAttribute("cy",y);circle.setAttribute("r",name==="G"?14:20);circle.setAttribute("class","node "+(name==="自分"?"me":name===c.changed?"new":c.active.includes(name)?"active":""));const txt=document.createElementNS(ns,"text");txt.setAttribute("x",x);txt.setAttribute("y",y+5);txt.setAttribute("class","person-label");txt.textContent=name;$("people").append(circle,txt)})}
$("back").addEventListener("click",()=>{if(step>0){step--;selection=null;revealed=false;draw()}});$("next").addEventListener("click",()=>{if(selection===null)return;if(!revealed){revealed=true;draw()}else{step=(step+1)%chapters.length;selection=null;revealed=false;draw()}});draw();
</script><script src="./guide-shared-chrome.js" defer></script></body></html>
