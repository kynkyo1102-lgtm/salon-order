function render(){const q=document.getElementById('search').value.toLowerCase().replace(/\s/g,''),p=pref.value;const arr=salons.map((s,i)=>({...s,i})).filter(s=>(!p||s.address.startsWith(p)||p==='大阪府'&&s.address.startsWith('大阪市'))&&(s.name+s.address).toLowerCase().replace(/\s/g,'').includes(q));document.getElementById('count').textContent=arr.length+'件 / 全40件';document.getElementById('list').innerHTML=arr.map(s=>'<button class="store '+(active===s.i?'active':'')+'" data-i="'+s.i+'"><b>'+esc(s.name)+'</b><small>'+esc(s.address)+'</small></button>').join('');document.querySelectorAll('.store').forEach(b=>b.onclick=()=>choose(Number(b.dataset.i),true));if(map)markers.forEach((m,i)=>m.setOpacity(arr.some(s=>s.i===i)?1:.18))}

async function lookupAddress(i,moveMap=false){
 const s=salons[i];
 const q=s.address.split('　')[0].split(' ')[0];
 const res=await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(q));
 if(!res.ok)throw Error('network');
 const data=await res.json();if(!Array.isArray(data)||!data.length)throw Error('not found');
 const v=data[0],c=v.geometry&&v.geometry.coordinates;
 if(!c||!Number.isFinite(c[0])||!Number.isFinite(c[1]))throw Error('invalid');
 const label=v.properties&&v.properties.title||'住所候補';
 // GSI address-search may only locate the neighborhood or block, not the building.
 if(!label.includes(s.address.slice(0,3)))throw Error('mismatch');
 s.lon=c[0];s.lat=c[1];geoCache[i]={lon:s.lon,lat:s.lat,label};
 try{localStorage.setItem('ninaguide-geocoded-v1',JSON.stringify(geoCache))}catch(e){}
 if(map){markers[i].setLatLng([s.lat,s.lon]);if(moveMap)map.setView([s.lat,s.lon],15)}
 return label;
}
async function resolveAddress(i){
 const el=document.getElementById('geoStatus');el.textContent='住所から位置を検索しています…';
 try{const label=await lookupAddress(i,true);if(active===i){choose(i,false);document.getElementById('geoStatus').textContent='住所検索結果：'+label+'。番地まで一致するかは未確認です。'}}catch(e){if(active===i)el.textContent='位置を取得できませんでした。仮位置のままです。'}
}
let bulkRunning=false;
document.getElementById('resolveAll').onclick=async()=>{
 if(bulkRunning)return;
 bulkRunning=true;const btn=document.getElementById('resolveAll'),status=document.getElementById('bulkStatus');
 btn.disabled=true;let success=0,failed=0;
 for(let i=0;i<salons.length;i++){
  status.textContent=(i+1)+'/40 件を検索中（成功 '+success+'、未取得 '+failed+'）';
  if(geoCache[i]){success++;continue}
  try{await lookupAddress(i,false);success++}catch(e){failed++}
  render();
